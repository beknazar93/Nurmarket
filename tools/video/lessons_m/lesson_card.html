<!doctype html>
<html><head><meta charset="utf-8"><title>lesson-card</title>
<link rel="stylesheet" href="../templates/base.css">
<style>
  /* 2026-10-30: заставка (3 с) и финал (4 с) видеоурока: фон #191919, логотип, жёлтая плашка #FFB208. */
  html, body { background:#191919; }
  #c { position:absolute; inset:0; }
  .logo { position:absolute; left:50%; top:34%; width:230px; height:230px; margin:-115px 0 0 -115px; border-radius:50%; }
  .word { position:absolute; left:0; right:0; top:52%; text-align:center; font-weight:800; font-size:76px; letter-spacing:.01em; }
  .word b { color:#FFB208; }
  .word small { display:block; font-weight:600; font-size:30px; color:#cfcfcf; margin-top:6px; letter-spacing:.14em; text-transform:uppercase; }
  .plaque { position:absolute; left:0; right:0; bottom:110px; background:#FFB208; color:#191919; padding:34px 110px 30px; }
  .plaque .t { font-weight:800; font-size:56px; line-height:1.12; }
  .plaque .n { font-weight:700; font-size:28px; margin-bottom:8px; letter-spacing:.05em; }
  .subline { position:absolute; left:0; right:0; bottom:50px; text-align:center; color:#fff; font-weight:600; font-size:28px; }
  .big { position:absolute; left:0; right:0; top:25%; text-align:center; font-weight:800; font-size:110px; }
  .big b { color:#FFB208; }
  .res { position:absolute; left:160px; right:160px; top:44%; text-align:center; font-weight:600; font-size:48px; line-height:1.25; }
  .next { position:absolute; left:0; right:0; bottom:150px; text-align:center; font-weight:700; font-size:34px; color:#FFB208; }
  .ver { position:absolute; left:0; right:0; bottom:60px; text-align:center; font-weight:500; font-size:26px; color:#bdbdbd; }
</style></head>
<body><div id="root"><div id="c"></div></div>
<script src="../templates/nm.js"></script>
<script>
/* params: kind "intro"|"outro"; intro: num, title, sub; outro: result, next, version */
window.__ready = window.__ready.then(async () => {
  const { P, S, el, seg, ease } = NM;
  const c = document.getElementById('c');
  const logo = el('img', 'logo', c);
  if (S.logo) { logo.src = NM.toURL(S.logo); await new Promise(r => { logo.onload = logo.onerror = r; }); }
  const w = el('div', 'word', c); w.innerHTML = 'Nur<b>CRM</b> Mobile' + (P.kind === 'intro' ? '<small>Видеоурок</small>' : '');
  let a = {};
  if (P.kind === 'intro') {
    a.pl = el('div', 'plaque', c);
    el('div', 'n', a.pl, P.num || ''); el('div', 't', a.pl, P.title || '');
    a.sub = el('div', 'subline', c, P.sub || '');
  } else {
    logo.style.top = '17%'; logo.style.width = logo.style.height = '150px'; logo.style.margin = '-75px 0 0 -75px';
    w.style.display = 'none';
    a.big = el('div', 'big', c); a.big.innerHTML = '<b>Готово</b>';
    a.res = el('div', 'res', c, P.result || '');
    a.next = P.next ? el('div', 'next', c, 'Следующий урок: ' + P.next) : null;
    a.ver = el('div', 'ver', c, P.version || '');
  }
  window.__render = (t) => {
    const p = seg(t, 0, 0.6, ease.back); logo.style.opacity = Math.min(1, p * 1.4); logo.style.transform = `scale(${0.7 + 0.3 * p})`;
    w.style.opacity = seg(t, 0.15, 0.5);
    if (P.kind === 'intro') {
      const k = seg(t, 0.35, 0.24, ease.out);              // «протирающий» въезд плашки 240 мс
      a.pl.style.transform = `translateX(${(1 - k) * -100}%)`; a.pl.style.opacity = 1;
      a.sub.style.opacity = seg(t, 0.8, 0.5);
    } else {
      a.big.style.opacity = seg(t, 0.2, 0.5); a.big.style.transform = `translateY(${(1 - seg(t, 0.2, 0.5)) * 30}px)`;
      a.res.style.opacity = seg(t, 0.6, 0.5);
      if (a.next) a.next.style.opacity = seg(t, 1.3, 0.5);
      a.ver.style.opacity = seg(t, 1.6, 0.5);
    }
  };
});
</script></body></html>
