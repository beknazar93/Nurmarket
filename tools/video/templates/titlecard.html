<!doctype html>
<html><head><meta charset="utf-8"><title>titlecard</title>
<link rel="stylesheet" href="base.css">
<style>
  .wrap { position:absolute; inset:0; padding:0 calc(var(--u)*8); display:flex; flex-direction:column; justify-content:center; }
  .num { font-weight:800; font-size:calc(var(--u)*5); color:var(--brand); margin-bottom:calc(var(--u)*1.5); }
  .h { font-weight:800; font-size:calc(var(--u)*7.2); line-height:1.1; max-width:calc(100vw - var(--u)*16); }
  .bar { height:calc(var(--u)*1); width:calc(var(--u)*16); background:var(--brand); border-radius:calc(var(--u)); margin:calc(var(--u)*2.6) 0; transform-origin:left center; }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:flex-start; gap:calc(var(--u)*2); font-weight:600; font-size:calc(var(--u)*3.8); line-height:1.3; margin:calc(var(--u)*1.4) 0; max-width:calc(100vw - var(--u)*16); }
  li::before { content:''; flex:none; width:calc(var(--u)*2.4); height:calc(var(--u)*2.4); margin-top:calc(var(--u)*.9); border-radius:calc(var(--u)*.6); background:var(--brand); }
</style></head>
<body><div id="root"><div class="bg-glow"></div></div>
<script src="nm.js"></script>
<script>
/* params: {kicker?, title, bullets?: [..]}  Пункты появляются по очереди (равномерно в течение сцены, не раньше 1.0 с). */
window.__ready = window.__ready.then(async () => {
  const { P, S, el, seg, ease } = NM, root = document.getElementById('root');
  const mark = el('div', 'brandmark', root); mark.style.left = mark.style.top = 'calc(var(--u)*4)';
  el('span', null, mark).innerHTML = 'Nur<b>Market</b>';
  const w = el('div', 'wrap', root);
  const k = P.kicker ? el('div', 'num', w, P.kicker) : null;
  const h = el('div', 'h', w, P.title || '');
  const bar = el('div', 'bar', w);
  const ul = el('ul', null, w);
  const lis = (P.bullets || []).map(b => el('li', null, ul, b));
  const span = Math.max(S.duration - 2.2, 1.0), gap = lis.length > 1 ? Math.min(1.1, span / lis.length) : 0;
  window.__render = (t) => {
    mark.style.opacity = seg(t, 0, 0.4);
    if (k) { const a = seg(t, 0.1, 0.4); k.style.opacity = a; k.style.transform = `translateY(${(1 - a) * 3}vmin)`; }
    const a = seg(t, 0.25, 0.6); h.style.opacity = a; h.style.transform = `translateY(${(1 - a) * 5}vmin)`;
    bar.style.transform = `scaleX(${seg(t, 0.7, 0.6, ease.inOut)})`;
    lis.forEach((li, i) => { const b = seg(t, 1.0 + i * gap, 0.5); li.style.opacity = b; li.style.transform = `translateX(${(1 - b) * -5}vmin)`; });
  };
});
</script></body></html>
