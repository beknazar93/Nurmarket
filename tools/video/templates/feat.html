<!doctype html>
<html><head><meta charset="utf-8"><title>feat</title>
<link rel="stylesheet" href="base.css">
<style>
  /* 2026-10-30: шаблон роликов-фишек NurCRM (серия «15 сценариев»): заставка с номером серии, сценка с персонажами
     (design/Ad-Light, PNG из feat_assets.py), экран стенда/видео-кадры/телефон с жёлтой рамкой кликов, титры шагов, финал.
     Всё считается из времени t (window.__render). Рабочее поле 1920x1080, масштаб K = ширина кадра / 1920. */
  #d { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; overflow:hidden; }
  .abs { position:absolute; }
  .t { font-family:'Montserrat','Noto Sans',sans-serif; }
  .panel { position:absolute; overflow:hidden; background:#fff; box-shadow:0 14px 60px rgba(0,0,0,.6); border-radius:14px; }
  .panel .c { position:absolute; left:0; top:0; transform-origin:0 0; }
  .panel canvas, .panel img.src { position:absolute; left:0; top:0; width:100%; height:100%; display:block; }
  .phone { position:absolute; background:#0b0b0b; box-shadow:0 14px 60px rgba(0,0,0,.65), inset 0 0 0 3px #3a3a3a; }
  .phone .panel { box-shadow:none; }
  .clk { position:absolute; box-sizing:border-box; border-style:solid; border-color:#FFB208; pointer-events:none; }
  .msk { position:absolute; }
  #titr { position:absolute; left:64px; bottom:150px; max-width:1500px; color:#fff; background:rgba(25,25,25,.82); border-radius:14px;
          padding:14px 30px 16px; font:800 56px/1.12 'Montserrat','Noto Sans',sans-serif; white-space:nowrap; opacity:0; z-index:30; }
  #titr .y, .t .y { color:#FFB208; }
  .bub { position:absolute; background:#fff; border:5px solid #191919; border-radius:26px; color:#191919; font:700 40px/1.2 'Montserrat','Noto Sans',sans-serif;
         padding:14px 24px; text-align:center; z-index:25; opacity:0; }
  .bub i { position:absolute; width:26px; height:26px; background:#fff; border-right:5px solid #191919; border-bottom:5px solid #191919; transform:rotate(45deg); bottom:-17px; }
  .bub b { color:#E5484D; font-weight:800; }
  #bump { position:absolute; inset:0; background:#191919; z-index:60; }
  #wipe { position:absolute; inset:0; background:#FFB208; z-index:70; will-change:transform; }
  .actor { position:absolute; transform-origin:50% 100%; }
  .actor img { display:block; width:100%; height:100%; }
  .fin { position:absolute; inset:0; background:#191919; z-index:40; }
</style></head>
<body><div id="root"><div id="d"></div></div>
<script src="nm.js"></script>
<script>
/* params: kind: hook | shot | finale ; titr:[{text,at,dur}] ; intro:{num,name} (только в первой сцене) ; nowipe */
window.__ready = window.__ready.then(async () => {
  const { P, S, seg, ease, clamp, lerp, toURL } = NM;
  const K = innerWidth / 1920, D = document.getElementById('d');
  D.style.transform = 'scale(' + K + ')';
  const A = (name) => toURL(P.assets + '/' + name);
  const mk = (cls, parent, css, html) => { const e = document.createElement('div'); if (cls) e.className = cls; if (css) e.style.cssText = css; if (html != null) e.innerHTML = html; (parent || D).appendChild(e); return e; };
  const loadI = (src) => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(i); i.src = src; });
  const hl = (s) => String(s || '').replace(/\[\[(.+?)\]\]/g, '<span class="y">$1</span>');
  const kind = P.kind || 'shot';
  const items = [];   // { set(t) }
  const kfv = (keys, t, k) => {  // значение k по ключам [{at,..}] с плавностью
    if (!keys || !keys.length) return undefined;
    if (t <= keys[0].at) return keys[0][k];
    for (let i = 1; i < keys.length; i++) if (t <= keys[i].at) { const a = keys[i - 1], b = keys[i]; const u = ease.inOut(clamp((t - a.at) / Math.max(1e-6, b.at - a.at))); return b[k] == null || a[k] == null ? (b[k] != null ? b[k] : a[k]) : lerp(a[k], b[k], u); }
    return keys[keys.length - 1][k];
  };

  /* ------------------------------------------------------------ фон магазина (сценки) */
  async function buildStore(B) {
    mk('abs', D, 'left:0;top:0;width:1920px;height:660px;background:#FFF1DB');
    mk('abs', D, 'left:0;top:660px;width:1920px;height:420px;background:#DADADA');
    mk('abs', D, 'left:0;top:652px;width:1920px;height:10px;background:#C4C4C4');
    const img = (n, css) => { const i = document.createElement('img'); i.src = A(n); i.className = 'abs'; i.style.cssText = css; D.appendChild(i); return i; };
    if (B.window !== false) img('bg-window.png', 'left:80px;top:150px;width:588px');
    if (B.clock !== false) img('bg-clock.png', 'left:760px;top:70px;width:90px');
    if (B.poster) img('bg-poster.png', 'left:1560px;top:200px;width:' + 118 + 'px');
    if (B.door) img('bg-door.png', 'left:1640px;top:140px;width:170px');
    if (B.sign !== false) mk('abs', D, 'left:' + (B.signX || 480) + 'px;top:64px;width:420px;height:104px;background:#FFB208;border:5px solid #191919;border-radius:14px;color:#191919;font:800 78px/94px Montserrat,sans-serif;text-align:center;letter-spacing:.04em', B.sign || 'НУР');
    if (B.tint) mk('abs', D, 'left:0;top:0;width:1920px;height:1080px;background:rgba(25,25,25,' + B.tint + ')');
    if (B.router) { const r = img('prop-router.png', 'left:' + (B.router.x || 1100) + 'px;top:178px;width:130px'); }
  }
  const store = P.store;
  if (kind === 'hook') await buildStore(store || {});
  else if (kind === 'shot') {
    mk('abs', D, 'inset:0;background:radial-gradient(900px 600px at 85% 10%, rgba(255,178,8,.20), transparent 60%),radial-gradient(800px 600px at 0% 100%, rgba(255,178,8,.10), transparent 60%),#191919');
  }

  /* ------------------------------------------------------------ актёры, предметы, пузыри */
  const actors = {};
  const layerBack = mk('abs', D, 'inset:0'), layerCounter = mk('abs', D, 'inset:0'), layerFront = mk('abs', D, 'inset:0');
  if (kind === 'hook' && store && store.counter) {
    const c = document.createElement('img'); c.src = A('bg-counter.png'); c.className = 'abs';
    c.style.cssText = 'left:' + store.counter.x + 'px;top:' + (store.counter.y == null ? 300 : store.counter.y) + 'px;width:' + 888 * (store.counter.s || 1) + 'px';
    layerCounter.appendChild(c);
  }
  for (const a of (P.actors || [])) {
    const im = await loadI(A(a.img + '.png'));
    const nat = (im.naturalWidth || 800) / 2, nath = (im.naturalHeight || 1400) / 2;
    const el = mk('actor', a.layer === 'back' ? layerBack : layerFront);
    const imgs = [a.img].concat((a.swaps || []).map(s => s.img));
    const els = imgs.map((n, i) => { const e = document.createElement('img'); e.src = A(n + '.png'); e.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%'; el.appendChild(e); return e; });
    actors[a.id] = { a, el, els, nat, nath };
    items.push({ set(t) {
      const s0 = a.s == null ? 1 : a.s;
      const path = a.path && a.path.length ? a.path : [{ at: 0, x: a.x, feet: a.feet }];
      const x = kfv(path, t, 'x'), f = kfv(path, t, 'feet'), s = (kfv(path, t, 's') == null ? s0 : kfv(path, t, 's'));
      const w = nat * s, h = nath * s;
      const anchorFeet = a.anchor !== 'center';
      const bob = a.bob ? Math.sin(t * 5 + (a.x || 0)) * 3 : 0;
      const shake = a.shake && t >= a.shake.at && t < a.shake.at + a.shake.dur ? Math.sin((t - a.shake.at) * 50) * (a.shake.amp || 6) : 0;
      let hop = 0; if (a.hop) for (const hh of a.hop) if (t >= hh && t < hh + 0.3) hop = -Math.sin((t - hh) / 0.3 * Math.PI) * 26;
      el.style.width = w + 'px'; el.style.height = h + 'px';
      el.style.left = (x - w / 2 + shake) + 'px'; el.style.top = ((anchorFeet ? f - 689 * s : f - h / 2) + bob + hop) + 'px';
      const flip = a.flip ? -1 : 1, rot = a.rot ? kfv(a.rot, t, 'r') || 0 : 0;
      el.style.transform = 'scaleX(' + flip + ') rotate(' + rot + 'deg)';
      // позы
      let cur = 0; (a.swaps || []).forEach((sw, i) => { if (t >= sw.at) cur = i + 1; });
      els.forEach((e, i) => { e.style.display = i === cur ? 'block' : 'none'; });
      // появление/уход
      let op = 1;
      if (a.show != null) op = Math.min(op, seg(t, a.show, 0.25, ease.out));
      if (a.hide != null) op = Math.min(op, 1 - seg(t, a.hide, 0.25, ease.in));
      if (a.enter) { const u = seg(t, a.enter.at || 0, a.enter.dur || 0.6, ease.out); el.style.left = (x - w / 2 + shake + (1 - u) * (a.enter.dx || 0)) + 'px'; op = Math.min(op, clamp(u * 3)); }
      el.style.opacity = op;
    } });
  }
  for (const it of (P.items || [])) {   // предметы и произвольные HTML-блоки
    let el;
    if (it.markup) { el = mk(null, it.layer === 'counter' ? layerCounter : layerFront, 'position:absolute;left:' + it.x + 'px;top:' + it.y + 'px;' + (it.css || ''), it.markup); }
    else { const im = await loadI(A(it.img + '.png')); const w = (im.naturalWidth || 200) / 2 * (it.s == null ? 1 : it.s), h = (im.naturalHeight || 200) / 2 * (it.s == null ? 1 : it.s);
      el = mk(null, it.layer === 'back' ? layerBack : (it.layer === 'counter' ? layerCounter : layerFront), 'position:absolute;left:' + (it.x - w / 2) + 'px;top:' + (it.y - h / 2) + 'px;width:' + w + 'px;height:' + h + 'px');
      const i2 = document.createElement('img'); i2.src = im.src; i2.style.cssText = 'width:100%;height:100%;display:block'; el.appendChild(i2); }
    items.push({ set(t) {
      let op = 1;
      if (it.at != null) op = Math.min(op, seg(t, it.at, 0.2, ease.out));
      if (it.until != null) op = Math.min(op, 1 - seg(t, it.until, 0.2, ease.in));
      el.style.opacity = op;
      if (it.path) { const x = kfv(it.path, t, 'x'), y = kfv(it.path, t, 'y'); const r = kfv(it.path, t, 'r') || 0; el.style.transform = 'translate(' + (x - it.x) + 'px,' + (y - it.y) + 'px) rotate(' + r + 'deg)'; }
    } });
  }
  for (const b of (P.bubbles || [])) {
    const el = mk('bub', D, 'max-width:' + (b.w || 600) + 'px', hl(b.text).replace(/\[\[|\]\]/g, ''));
    const tail = document.createElement('i'); el.appendChild(tail);
    let ax = b.x, top = b.y;
    if (b.who && actors[b.who]) { const A_ = actors[b.who].a; const path = A_.path && A_.path.length ? A_.path : [{ at: 0, x: A_.x, feet: A_.feet }]; const tt = b.at + 0.3; ax = kfv(path, tt, 'x'); const f = kfv(path, tt, 'feet'); const s = kfv(path, tt, 's') == null ? (A_.s == null ? 1 : A_.s) : kfv(path, tt, 's'); top = f - (A_.h || 650) * s - 30; if (A_.anchor === 'center') top = f - actors[b.who].nath * s / 2 - 30; }
    items.push({ set(t) {
      const w = el.offsetWidth, h = el.offsetHeight;
      let left = clamp(ax - w / 2, 24, 1920 - w - 24);
      el.style.left = left + 'px'; el.style.top = (top - h - 20 + (b.dy || 0)) + 'px';
      tail.style.left = clamp(ax - left - 13, 30, w - 56) + 'px';
      const p = Math.min(seg(t, b.at, 0.18, ease.back), 1 - seg(t, b.at + b.dur, 0.18, ease.in));
      el.style.opacity = clamp(p * 2); el.style.transform = 'scale(' + (0.85 + 0.15 * Math.min(1, p)) + ')';
    } });
  }

  /* ------------------------------------------------------------ экраны (панели) */
  async function loadFrames(v) {
    const meta = v.meta, bms = [];
    const i0 = Math.max(0, Math.floor((v.from || 0) * meta.fps)), i1 = Math.min(meta.n - 1, Math.ceil((v.to == null ? meta.n / meta.fps : v.to) * meta.fps));
    const imgs = await Promise.all(Array.from({ length: i1 - i0 + 1 }, (_, k) => loadI(toURL(v.dir + '/' + String(i0 + k + 1).padStart(4, '0') + '.jpg'))));
    for (const im of imgs) bms.push(await createImageBitmap(im));
    return { bms, i0, fps: meta.fps };
  }
  async function buildPanel(p) {
    let kindSrc, vid = null, im = null, iw, ih;
    if (p.video) { vid = await loadFrames(p.video); iw = vid.bms[0].width; ih = vid.bms[0].height; }
    else { im = await loadI(toURL(p.image)); iw = im.naturalWidth; ih = im.naturalHeight; }
    const [W0, H0] = p.size || [iw, ih];
    const crop = p.crop || [0, 0, W0, H0];
    const area = p.area || [100, 36, 1720, 790];
    const phone = p.frame === 'phone';
    const pad = phone ? 14 : 0;
    const aw = area[2] - 2 * pad, ah = area[3] - 2 * pad;
    const s0 = Math.min(aw / crop[2], ah / crop[3]);
    const bw = crop[2] * s0, bh = crop[3] * s0;
    const bx = area[0] + (area[2] - bw) / 2, by = area[1] + (area[3] - bh) / 2;
    let holder = null, parent = D;
    if (phone) { holder = mk('phone', D, 'left:' + (bx - pad) + 'px;top:' + (by - pad) + 'px;width:' + (bw + 2 * pad) + 'px;height:' + (bh + 2 * pad) + 'px;border-radius:' + (bw * 0.12 + pad) + 'px'); parent = holder; }
    const pan = mk('panel', parent, 'left:' + (phone ? pad : bx) + 'px;top:' + (phone ? pad : by) + 'px;width:' + bw + 'px;height:' + bh + 'px;' + (phone ? 'border-radius:' + (bw * 0.12) + 'px;' : ''));
    const c = mk('c', pan, 'width:' + W0 + 'px;height:' + H0 + 'px');
    let cv = null;
    if (vid) { cv = document.createElement('canvas'); cv.width = iw; cv.height = ih; cv.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%'; c.appendChild(cv); }
    else { const e = document.createElement('img'); e.className = 'src'; e.src = im.src; c.appendChild(e); }
    const ctx = cv ? cv.getContext('2d') : null;
    // клики и маски — в координатах исходника
    const clicks = (p.clicks || []).map(k => {
      const e = mk('clk', c, ''); return { k, e };
    });
    const masks = (p.masks || []).map(m => { const e = mk('msk', c, 'left:' + m.rect[0] + 'px;top:' + m.rect[1] + 'px;width:' + m.rect[2] + 'px;height:' + m.rect[3] + 'px;' + (m.blur ? 'backdrop-filter:blur(' + m.blur + 'px);background:rgba(255,255,255,.35)' : 'background:' + (m.color || '#fff'))); return e; });
    const focus = p.focus || [];
    const camAt = (t) => {
      let prev = crop;
      for (const f of focus) {
        if (t < f.at) break;
        const u = ease.inOut(clamp((t - f.at) / (f.dur || 0.8)));
        const cur = prev.map((v, i) => lerp(v, f.rect[i], u));
        if (u < 1) return cur;
        prev = f.rect;
      }
      return prev;
    };
    const fit = (r) => { // к пропорции панели, внутри crop
      let [x, y, w, h] = r; const ar = bw / bh;
      if (w / h < ar) { const nw = h * ar; x -= (nw - w) / 2; w = nw; } else { const nh = w / ar; y -= (nh - h) / 2; h = nh; }
      if (w > crop[2]) { h *= crop[2] / w; w = crop[2]; } if (h > crop[3]) { w *= crop[3] / h; h = crop[3]; }
      x = clamp(x, crop[0], crop[0] + crop[2] - w); y = clamp(y, crop[1], crop[1] + crop[3] - h);
      return [x, y, w, h];
    };
    items.push({ set(t) {
      const vis = (p.from == null ? 1 : seg(t, p.from, 0.3, ease.out)) * (p.until == null ? 1 : 1 - seg(t, p.until, 0.3, ease.in));
      const tgt = holder || pan; tgt.style.opacity = vis;
      const slide = p.slide ? (1 - (p.from == null ? 1 : seg(t, p.from, 0.45, ease.out))) * p.slide : 0;
      tgt.style.transform = 'translateX(' + slide + 'px) scale(' + (1.04 - 0.04 * seg(t, p.from || 0, 0.3, ease.out)) + ')';
      const r = fit(camAt(t)), s = bw / r[2];
      c.style.transform = 'translate(' + (-r[0] * s) + 'px,' + (-r[1] * s) + 'px) scale(' + s + ')';
      if (vid) { let fi = Math.floor((t - (p.delay || 0)) * (p.rate || 1) * vid.fps) + Math.floor((p.video.from || 0) * vid.fps) - vid.i0; fi = clamp(fi, 0, vid.bms.length - 1); ctx.drawImage(vid.bms[fi], 0, 0); }
      for (const { k, e } of clicks) {
        const a = k.at, bs = 3 / s, infl = 5 / s, rr = k.rect;
        const sc = 1 + 0.08 * (1 - seg(t, a, 0.12, ease.out));
        const op = Math.min(seg(t, a, 0.12, ease.out), 1 - seg(t, a + 0.12 + (k.hold || 0.4), 0.16, ease.in));
        e.style.cssText = 'left:' + (rr[0] - infl) + 'px;top:' + (rr[1] - infl) + 'px;width:' + (rr[2] + 2 * infl) + 'px;height:' + (rr[3] + 2 * infl) + 'px;border-width:' + bs + 'px;border-radius:' + (8 / s) + 'px;opacity:' + clamp(op) + ';transform:scale(' + sc + ');' + (k.fill ? 'background:rgba(255,178,8,' + (0.3 * clamp(op)) + ');' : '');
      }
    } });
    return pan;
  }
  if (kind === 'shot') for (const p of (P.panels || [])) await buildPanel(p);
  for (const e of (P.chips || [])) {   // подписи у панелей (например «Телефон», «Касса»)
    const el = mk('t abs', D, 'left:' + e.x + 'px;top:' + e.y + 'px;font:700 ' + (e.size || 30) + 'px Montserrat,sans-serif;color:' + (e.color || '#d8d8d8') + ';white-space:nowrap', hl(e.text));
    items.push({ set(t) { el.style.opacity = (e.at == null ? 1 : seg(t, e.at, 0.3)); } });
  }

  /* ------------------------------------------------------------ титры шагов */
  const titrEl = mk(null, D, '', '');
  titrEl.id = 'titr'; D.appendChild(titrEl);
  const tl = P.titr || [];
  items.push({ set(t) {
    let on = null; for (const x of tl) if (t >= x.at && t < x.at + x.dur) on = x;
    if (!on) { titrEl.style.opacity = 0; return; }
    if (titrEl.dataset.k !== on.text) { titrEl.innerHTML = hl(on.text); titrEl.dataset.k = on.text; }
    const p = Math.min(seg(t, on.at, 0.16, ease.out), 1 - seg(t, on.at + on.dur - 0.16, 0.16, ease.in));
    titrEl.style.opacity = p; titrEl.style.transform = 'translateY(' + ((1 - p) * 24) + 'px)';
    if (on.right) { titrEl.style.left = 'auto'; titrEl.style.right = '64px'; } else { titrEl.style.left = '64px'; titrEl.style.right = 'auto'; }
    if (on.bottom != null) titrEl.style.bottom = on.bottom + 'px'; else titrEl.style.bottom = '150px';
  } });

  /* ------------------------------------------------------------ финальная плашка */
  if (kind === 'finale') {
    const fin = mk('fin', D, '');
    mk('abs', fin, 'inset:0;background:radial-gradient(900px 600px at 85% 10%, rgba(255,178,8,.20), transparent 60%),#191919');
    const lg = document.createElement('img'); lg.src = toURL(S.logo); lg.className = 'abs'; lg.style.cssText = 'left:810px;top:56px;width:300px;height:300px;border-radius:50%'; fin.appendChild(lg);
    const l1 = mk('t abs', fin, 'left:0;width:1920px;top:392px;text-align:center;font:800 78px/1.1 Montserrat,sans-serif;color:#fff', 'NurCRM — касса,');
    const l2 = mk('t abs', fin, 'left:0;width:1920px;top:484px;text-align:center;font:800 78px/1.1 Montserrat,sans-serif;color:#fff', '<span style="color:#FFB208">которая знает</span> ваш магазин');
    const sb = mk('t abs', fin, 'left:0;width:1920px;top:620px;text-align:center;font:600 33px/1.3 Montserrat,sans-serif;color:#d8d8d8', 'Работает без интернета. Говорит на вашем языке. Считает вашу прибыль.');
    const pl = mk('abs', fin, 'left:360px;top:770px;width:1200px;height:230px;background:#FFB208;border-radius:26px');
    mk('t abs', pl, 'left:60px;top:0;height:230px;line-height:230px;font:800 82px Montserrat,sans-serif;line-height:230px;color:#191919;white-space:nowrap', 'app.nurcrm.kg');
    const qb = mk('abs', pl, 'right:24px;top:15px;width:200px;height:200px;background:#fff;border-radius:16px;overflow:hidden');
    const q = document.createElement('img'); q.src = A('qr-app.svg'); q.style.cssText = 'width:100%;height:100%;display:block'; qb.appendChild(q);
    items.push({ set(t) {
      const a = seg(t, 0.2, 0.5, ease.back); lg.style.opacity = clamp(a * 1.4); lg.style.transform = 'scale(' + (0.96 + 0.04 * Math.min(1, a)) + ')';
      for (const [e, at] of [[l1, 0.55], [l2, 0.67]]) { const b = seg(t, at, 0.3); e.style.opacity = b; e.style.transform = 'translateY(' + ((1 - b) * 22) + 'px)'; }
      sb.style.opacity = seg(t, 1.25, 0.4);
      const c = seg(t, 1.7, 0.45, ease.out); pl.style.opacity = c; pl.style.transform = 'translateY(' + ((1 - c) * 40) + 'px)';
    } });
  }

  /* ------------------------------------------------------------ заставка серии (первые 1,5 с) */
  const intro = P.intro;
  let bump = null, bumpLogo = null;
  if (intro) {
    bump = mk(null, D, ''); bump.id = 'bump';
    bumpLogo = document.createElement('img'); bumpLogo.src = toURL(S.logo); bumpLogo.className = 'abs'; bumpLogo.style.cssText = 'left:810px;top:230px;width:300px;height:300px;border-radius:50%'; bump.appendChild(bumpLogo);
    mk('t abs', bump, 'left:0;width:1920px;top:580px;text-align:center;font:600 36px/1.2 Montserrat,sans-serif;color:#fff', intro.name);
    mk('t abs', bump, 'right:90px;bottom:60px;font:800 48px Montserrat,sans-serif;color:#FFB208', intro.num);
  }
  const wipe = mk(null, D, ''); wipe.id = 'wipe';
  window.__render = (t) => {
    for (const it of items) it.set(t);
    let x = 100;   // протирание жёлтой плашкой
    if (intro) {
      const u = ease.out(clamp(t / 0.3)); bumpLogo.style.transform = 'scale(' + (0.9 + 0.1 * u) + ')';
      bump.style.display = t < 1.32 ? 'block' : 'none';
      if (t >= 1.2 && t < 1.32) x = -100 + 100 * ease.out((t - 1.2) / 0.12); else if (t >= 1.32 && t < 1.5) x = 100 * ease.inOut((t - 1.32) / 0.18);
      wipe.style.display = (t >= 1.2 && t < 1.5) ? 'block' : 'none';
    } else if (P.nowipe) { wipe.style.display = 'none'; return; }
    else {
      if (t < 0.12) x = -100 + 100 * ease.out(t / 0.12); else if (t < 0.30) x = 100 * ease.inOut((t - 0.12) / 0.18);
      wipe.style.display = t < 0.30 ? 'block' : 'none';
    }
    wipe.style.transform = 'translateX(' + x + '%)';
  };
});
