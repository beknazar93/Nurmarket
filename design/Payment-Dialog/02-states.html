<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Окно оплаты — галерея состояний (30.10.2026)</title>
<link rel="stylesheet" href="../Large-lists/shared.css">
<style>
/* Все состояния окна оплаты рядом — для приёмки и снимков. Каждый кадр — index.html с предустановкой через #hash. */
.g{ display:grid; grid-template-columns:repeat(auto-fill,minmax(680px,1fr)); gap:18px; padding:18px; }
.c{ display:flex; flex-direction:column; gap:6px; }
.c h3{ margin:0; font-size:13px; color:#FFB208; } .c p{ margin:0; font-size:12px; color:#AAA; }
.c iframe{ border:0; border-radius:8px; background:#111; width:100%; aspect-ratio:1330/900; transform-origin:0 0; }
.c.sm iframe{ aspect-ratio:1060/640; } .c.xs iframe{ aspect-ratio:840/520; }
</style>
</head>
<body>
<div class="tb"><b>Окно оплаты · состояния</b><span style="color:#AAA">Кадры интерактивные — можно нажимать клавиши внутри. Полная версия: <a href="index.html">index.html</a></span></div>
<div class="g" id="g"></div>
<script>
const F = [
  ['Наличные, обычное, 1296×879', 'Поле «Получено» 20 → «Не хватает 8,00», кнопка заблокирована с причиной', 'cash=20', ''],
  ['Наличные, сдача', 'Получено 50 → сдача 22,00 зелёным; формула «50 − 28»', 'cash=50', ''],
  ['Наличные, тёмная тема', 'Контраст надписей ≥ 4,5:1, жёлтый итог на #2A2A2A', 'theme=dark&cash=100', ''],
  ['Безнал · QR, терминал выбран', 'QR с суммой на экране покупателя, статус ожидания, Enter подтверждает вручную', 'method=card&bank=1', ''],
  ['В долг без клиента', 'Чип клиента красный, причина «выберите клиента», F5', 'method=debt', ''],
  ['В долг с клиентом', 'Долг / лимит / после продажи, предоплата, срок 7/14/30/дата, «В долг уйдёт»', 'method=debt&client=1', ''],
  ['В долг без связи', 'Бейдж «Без связи», данные клиента от ЧЧ:ММ, бонусы не списываются', 'state=debtoff', ''],
  ['Смешанная', 'Наличные + карта + долг (клиент есть), «Осталось распределить», «Остаток → карта»', 'method=mixed&client=1', ''],
  ['Клиент с бонусами, списание', 'Чип «бонусы 120 · долг 1 250», кнопка «Списать 28», строка «Бонусами −28,00», итог 0', 'client=1&bonus=1', ''],
  ['Крупная сумма, кыргызский', '1 234 567,89 без переполнения, длинные надписи', 'total=1234567.89&lang=ky&cash=1240000', ''],
  ['Цена изменилась (Д-6)', 'Плашка «Цена изменилась … Чек обновлён» над телом окна', 'notice=1&cash=28', ''],
  ['Проводим оплату…', 'Спиннер в кнопке, тело окна неактивно', 'state=busy&cash=50', ''],
  ['Успех', 'Зелёная галочка, сдача крупно, «Новая продажа (Enter)», автозакрытие 3 с', 'state=success&cash=50', ''],
  ['Ошибка «сервер занят»', 'Понятный текст «деньги не списаны», Повторить / В очередь', 'state=error&cash=50', ''],
  ['Пустой чек', 'Способы и клиент неактивны, причина «Чек пуст — добавьте товар»', 'state=empty', ''],
  ['1024×600 сенсор, наличные', 'Цифровая клавиатура, зоны ≥ 44–48 px', 'size=s1024&cash=20', 'sm'],
  ['1024×600, тёмная, турецкий, в долг', 'Длинные строки, лимит', 'size=s1024&theme=dark&lang=tr&method=debt&client=1', 'sm'],
  ['800×480, наличные', 'Окно во весь экран, компактные плитки', 'size=s800&cash=50', 'xs'],
  ['800×480, смешанная, узбекский', 'Две колонки 290 + остальное', 'size=s800&method=mixed&client=1&lang=uz', 'xs'],
  ['800×480, успех', 'Экран успеха на маленьком экране', 'size=s800&state=success&cash=50', 'xs']
];
document.getElementById('g').innerHTML = F.map(f => `<div class="c ${f[3]}"><h3>${f[0]}</h3><p>${f[1]}</p><iframe loading="lazy" src="index.html#${f[2]}"></iframe></div>`).join('');
</script>
</body>
</html>
