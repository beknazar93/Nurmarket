<!doctype html>
<html lang="ru"><head><style>
    .sc-placeholder{background:color-mix(in srgb,currentColor 8%,transparent);
      border:1px solid color-mix(in srgb,currentColor 50%,transparent);
      border-radius:2px;box-sizing:border-box;overflow:hidden}
    @keyframes sc-shine{0%{background-position:100% 50%}100%{background-position:0% 50%}}
    html.sc-dc-streaming .sc-placeholder,
    html.sc-dc-streaming .sc-interp.sc-missing{position:relative;
      background:color-mix(in srgb,currentColor 5%,transparent);
      border-color:transparent}
    html.sc-dc-streaming .sc-placeholder::before,
    html.sc-dc-streaming .sc-interp.sc-missing::before{content:'';
      position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(90deg,rgba(217,119,87,0) 25%,rgba(247,225,211,.95) 37%,rgba(217,119,87,0) 63%);
      background-size:400% 100%;animation:sc-shine 1.4s ease infinite}
    html.sc-dc-streaming .sc-placeholder:nth-child(n+9 of .sc-placeholder)::before,
    html.sc-dc-streaming .sc-interp.sc-missing:nth-child(n+9 of .sc-interp.sc-missing)::before{animation:none;
      background:color-mix(in srgb,currentColor 8%,transparent)}
    .sc-placeholder-error{padding:4px 8px;font:11px/1.4 ui-monospace,monospace;
      color:color-mix(in srgb,currentColor 70%,transparent);word-break:break-word}
    .sc-interp.sc-missing{display:inline-block;width:2em;height:1em;overflow:hidden;
      vertical-align:text-bottom;background:rgba(255,255,255,.3);border:1px solid rgba(0,0,0,.5);
      border-radius:2px;box-sizing:border-box;color:transparent;
      user-select:none}
    .sc-interp.sc-unresolved{font-family:ui-monospace,monospace;font-size:.85em;
      color:color-mix(in srgb,currentColor 50%,transparent);
      background:color-mix(in srgb,currentColor 10%,transparent);border-radius:3px;
      padding:0 3px}
    .sc-host.sc-has-error{position:relative}
    .sc-logic-error{position:absolute;top:8px;left:8px;z-index:2147483647;max-width:60ch;
      padding:6px 10px;background:#b00020;color:#fff;font:12px/1.4 ui-monospace,monospace;
      border-radius:4px;white-space:pre-wrap;pointer-events:none}
    /* Mirrors PRINT_BASELINE_CSS in apps/web deck-stage-export.ts — keep both
       in sync until dc-runtime regains a build step. */
    @media print {
      @page { margin: 0.5cm; }
      figure, table { break-inside: avoid; }
      #dc-root, #dc-root > .sc-host { height: auto; }
      *, *::before, *::after {
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
        backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
        animation-delay: -99s !important; animation-duration: .001s !important;
        animation-iteration-count: 1 !important; animation-fill-mode: both !important;
        animation-play-state: running !important; transition-duration: 0s !important;
      }
    }
  </style>
<meta charset="utf-8">
<title>Администратор — главная</title>
<style>x-dc{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#FFFFFF;border-top:1px solid #EAECF0;padding:8px 4px 14px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:#667085;text-decoration:none;padding:6px 0}
.nav a.on{color:#0B2A3C;font-weight:800}
.nav a.on span{background:#FFD600}
.nav span{width:44px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.kpi{background:#FFFFFF;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px}
.kpi span{font-size:11px;color:#667085;font-weight:600}
.kpi b{font-size:18px;font-weight:800;color:#0B2A3C}
.qa{border:0;border-radius:16px;background:#FFFFFF;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:inherit;font-size:11px;font-weight:700;color:#0B2A3C}
.qa i{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-style:normal}
.al{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:#FFFFFF;border:0;font-family:inherit;text-align:left;width:100%}
</style></head>
<body>
<div id="dc-root"><div class="sc-host" data-sc-name="PAdmHome"><div style="width: 390px; height: 844px; box-sizing: border-box; background: rgb(244, 245, 247); font-family: Montserrat, system-ui, sans-serif; color: rgb(17, 24, 39); display: flex; flex-direction: column;">
  <header style="padding: 18px 16px 10px; display: flex; align-items: center; gap: 10px;">
    <button type="button" style="flex-grow: 1; height: 44px; border-radius: 12px; border: 1px solid rgb(229, 231, 235); background: rgb(255, 255, 255); font-family: inherit; display: flex; align-items: center; gap: 10px; padding: 0px 12px; text-align: left;">
      <span style="width: 28px; height: 28px; border-radius: 8px; background: rgb(11, 42, 60); color: rgb(255, 214, 0); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px;">N</span>
      <span style="flex-grow: 1; display: flex; flex-direction: column;"><b style="font-size: 14px;">NBS · все филиалы</b></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <span style="width: 44px; height: 44px; border-radius: 22px; background: rgb(11, 42, 60); color: rgb(255, 255, 255); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px;">АД</span>
  </header>

  <main style="flex-grow: 1; padding: 0px 16px 12px; display: flex; flex-direction: column; gap: 12px; overflow: hidden;">
    <section style="border-radius: 20px; background: rgb(11, 42, 60); color: rgb(255, 255, 255); padding: 16px; display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 12px; color: rgb(199, 210, 219);">Выручка сегодня</span>
      <b style="font-size: 30px; font-weight: 800; color: rgb(255, 214, 0);">[сумма]</b>
      <span style="font-size: 12px; color: rgb(199, 210, 219);">Касса сейчас: [сумма] · открыто смен: [N]</span>
    </section>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0px, 1fr)); gap: 8px;">
      <div class="kpi"><span>Чеков</span><b>[N]</b></div>
      <div class="kpi"><span>Средний чек</span><b>[сумма]</b></div>
      <div class="kpi"><span>Прибыль</span><b>[сумма]</b></div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0px, 1fr)); gap: 8px;">
      <button type="button" class="qa"><i style="background: rgb(255, 214, 0);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></i>Умная камера</button>
      <button type="button" class="qa"><i style="background: rgb(242, 244, 247);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></i>Новый товар</button>
      <button type="button" class="qa"><i style="background: rgb(242, 244, 247);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"></path><path d="M3 8l9 5 9-5"></path></svg></i>Приёмка</button>
      <button type="button" class="qa"><i style="background: rgb(242, 244, 247);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></i>Отчёт</button>
    </div>

    <span style="font-size: 12px; font-weight: 700; color: rgb(102, 112, 133);">ЖДЁТ ВНИМАНИЯ</span>
    <button type="button" class="al"><span style="width: 36px; height: 36px; border-radius: 10px; background: rgb(254, 243, 226); color: rgb(181, 71, 8); display: flex; align-items: center; justify-content: center; font-weight: 800;">!</span><span style="flex-grow: 1; display: flex; flex-direction: column;"><b style="font-size: 13px;">Заканчиваются товары</b><span style="font-size: 12px; color: rgb(102, 112, 133);">[N] позиций · заказать поставщику</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#98A2B3" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
    <button type="button" class="al"><span style="width: 36px; height: 36px; border-radius: 10px; background: rgb(231, 238, 243); color: rgb(11, 42, 60); display: flex; align-items: center; justify-content: center; font-weight: 800;">₸</span><span style="flex-grow: 1; display: flex; flex-direction: column;"><b style="font-size: 13px;">Долги клиентов</b><span style="font-size: 12px; color: rgb(102, 112, 133);">[N] должников · [сумма]</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#98A2B3" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
    <button type="button" class="al"><span style="width: 36px; height: 36px; border-radius: 10px; background: rgb(231, 246, 236); color: rgb(14, 122, 58); display: flex; align-items: center; justify-content: center; font-weight: 800;">@</span><span style="flex-grow: 1; display: flex; flex-direction: column;"><b style="font-size: 13px;">Заказы с сайта</b><span style="font-size: 12px; color: rgb(102, 112, 133);">[N] новых</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#98A2B3" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
  </main>

  <nav class="nav" aria-label="Разделы администратора">
    <a href="#" class="on"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21H3z"></path></svg></span>Главная</a>
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 4h2l2.5 11h11L21 7H6.5"></path><circle cx="9" cy="19.5" r="1.5"></circle><circle cx="17" cy="19.5" r="1.5"></circle></svg></span>Продажа</a>
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg></span>Товары</a>
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span>Отчёты</a>
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg></span>Ещё</a>
  </nav></div></div></div>



</body></html>
