<!doctype html>
<html lang="ru"><head><style>
    .sc-placeholder{background:color-mix(in srgb,currentColor 8%,transparent);
      border:1px solid color-mix(in srgb,currentColor 50%,transparent);
      border-radius:2px;box-sizing:border-box;overflow:hidden}
    @keyframes sc-shine{0%{background-position:100% 50%}100%{background-position:0% 50%}}
    html.sc-dc-streaming .sc-placeholder,
    html.sc-dc-streaming .sc-interp.sc-missing{position:relative;
      background:color-mix(in srgb,currentColor 5%,transparent);
      border-color:transparent}
    html.sc-dc-streaming .sc-placeholder::before,
    html.sc-dc-streaming .sc-interp.sc-missing::before{content:'';
      position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(90deg,rgba(217,119,87,0) 25%,rgba(247,225,211,.95) 37%,rgba(217,119,87,0) 63%);
      background-size:400% 100%;animation:sc-shine 1.4s ease infinite}
    html.sc-dc-streaming .sc-placeholder:nth-child(n+9 of .sc-placeholder)::before,
    html.sc-dc-streaming .sc-interp.sc-missing:nth-child(n+9 of .sc-interp.sc-missing)::before{animation:none;
      background:color-mix(in srgb,currentColor 8%,transparent)}
    .sc-placeholder-error{padding:4px 8px;font:11px/1.4 ui-monospace,monospace;
      color:color-mix(in srgb,currentColor 70%,transparent);word-break:break-word}
    .sc-interp.sc-missing{display:inline-block;width:2em;height:1em;overflow:hidden;
      vertical-align:text-bottom;background:rgba(255,255,255,.3);border:1px solid rgba(0,0,0,.5);
      border-radius:2px;box-sizing:border-box;color:transparent;
      user-select:none}
    .sc-interp.sc-unresolved{font-family:ui-monospace,monospace;font-size:.85em;
      color:color-mix(in srgb,currentColor 50%,transparent);
      background:color-mix(in srgb,currentColor 10%,transparent);border-radius:3px;
      padding:0 3px}
    .sc-host.sc-has-error{position:relative}
    .sc-logic-error{position:absolute;top:8px;left:8px;z-index:2147483647;max-width:60ch;
      padding:6px 10px;background:#b00020;color:#fff;font:12px/1.4 ui-monospace,monospace;
      border-radius:4px;white-space:pre-wrap;pointer-events:none}
    /* Mirrors PRINT_BASELINE_CSS in apps/web deck-stage-export.ts — keep both
       in sync until dc-runtime regains a build step. */
    @media print {
      @page { margin: 0.5cm; }
      figure, table { break-inside: avoid; }
      #dc-root, #dc-root > .sc-host { height: auto; }
      *, *::before, *::after {
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
        backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
        animation-delay: -99s !important; animation-duration: .001s !important;
        animation-iteration-count: 1 !important; animation-fill-mode: both !important;
        animation-play-state: running !important; transition-duration: 0s !important;
      }
    }
  </style>
<meta charset="utf-8">
<title>Заказы с сайта</title>
<style>x-dc{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:12px;font-weight:600;color:#344054;white-space:nowrap}
.chip.on{border:0;background:#0B2A3C;color:#FFFFFF}
.or{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:#FFFFFF;border:0;font-family:inherit;text-align:left;width:100%}
.rl{display:flex;justify-content:space-between;font-size:13px}
</style></head>
<body>
<div id="dc-root"><div class="sc-host" data-sc-name="PAdmOrders"><div style="width: 390px; height: 844px; box-sizing: border-box; background: rgb(244, 245, 247); font-family: Montserrat, system-ui, sans-serif; color: rgb(17, 24, 39); display: flex; flex-direction: column;">
  <header style="padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <button type="button" aria-label="Назад" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid rgb(229, 231, 235); background: rgb(255, 255, 255); color: rgb(52, 64, 84); display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
      <b style="font-size: 18px; font-weight: 800; flex-grow: 1;">Заказы с сайта</b>
    </div>
    <div style="display: flex; gap: 6px; overflow: hidden;"><button type="button" class="chip on">Новые · [N]</button><button type="button" class="chip">Собираются</button><button type="button" class="chip">Готовы</button><button type="button" class="chip">Выданы</button></div>
  </header>

  <main style="flex-grow: 1; padding: 0px 16px 16px; display: flex; flex-direction: column; gap: 8px; overflow: hidden;">
    <section style="background: rgb(255, 255, 255); border: 2px solid rgb(255, 214, 0); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; justify-content: space-between; align-items: center;"><b style="font-size: 15px;">Заказ [№]</b><span style="font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: rgb(254, 243, 226); color: rgb(181, 71, 8);">новый · [время]</span></div>
      <span style="font-size: 12px; color: rgb(102, 112, 133);">[Клиент] · доставка · [адрес]</span>
      <div class="rl"><span>Кока-Кола (ПЭТ) 2л × 2</span><b>340</b></div>
      <div class="rl"><span>Mars × 1</span><b>39</b></div>
      <div class="rl" style="border-top: 1px dashed rgb(208, 213, 221); padding-top: 8px; font-size: 15px;"><b>Итого</b><b style="color: rgb(11, 42, 60);">379 сом</b></div>
      <div style="display: flex; gap: 8px; padding-top: 4px;"><button type="button" style="height: 46px; padding: 0px 14px; border-radius: 12px; border: 1.5px solid rgb(253, 226, 225); background: rgb(255, 255, 255); color: rgb(180, 35, 24); font-family: inherit; font-size: 13px; font-weight: 700;">Отклонить</button><button type="button" style="flex-grow: 1; height: 46px; border-radius: 12px; border: 0px; background: rgb(255, 214, 0); color: rgb(11, 42, 60); font-family: inherit; font-size: 14px; font-weight: 800;">Принять и собрать</button></div>
    </section>
    <button type="button" class="or"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><b style="font-size: 14px;">Заказ [№] · [Клиент]</b><span style="font-size: 12px; color: rgb(102, 112, 133);">самовывоз · [время]</span></span><b style="color: rgb(11, 42, 60);">[сумма]</b></button>
    <button type="button" class="or"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><b style="font-size: 14px;">Заказ [№] · [Клиент]</b><span style="font-size: 12px; color: rgb(102, 112, 133);">доставка · [время]</span></span><b style="color: rgb(11, 42, 60);">[сумма]</b></button>
    <span style="font-size: 12px; color: rgb(152, 162, 179); text-align: center; padding-top: 4px;">Принятый заказ сразу появится на кассе для оплаты</span>
  </main></div></div></div>



</body></html>
