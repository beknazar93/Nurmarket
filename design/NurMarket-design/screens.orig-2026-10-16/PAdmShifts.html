<!doctype html>
<html lang="ru"><head><style>
    .sc-placeholder{background:color-mix(in srgb,currentColor 8%,transparent);
      border:1px solid color-mix(in srgb,currentColor 50%,transparent);
      border-radius:2px;box-sizing:border-box;overflow:hidden}
    @keyframes sc-shine{0%{background-position:100% 50%}100%{background-position:0% 50%}}
    html.sc-dc-streaming .sc-placeholder,
    html.sc-dc-streaming .sc-interp.sc-missing{position:relative;
      background:color-mix(in srgb,currentColor 5%,transparent);
      border-color:transparent}
    html.sc-dc-streaming .sc-placeholder::before,
    html.sc-dc-streaming .sc-interp.sc-missing::before{content:'';
      position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(90deg,rgba(217,119,87,0) 25%,rgba(247,225,211,.95) 37%,rgba(217,119,87,0) 63%);
      background-size:400% 100%;animation:sc-shine 1.4s ease infinite}
    html.sc-dc-streaming .sc-placeholder:nth-child(n+9 of .sc-placeholder)::before,
    html.sc-dc-streaming .sc-interp.sc-missing:nth-child(n+9 of .sc-interp.sc-missing)::before{animation:none;
      background:color-mix(in srgb,currentColor 8%,transparent)}
    .sc-placeholder-error{padding:4px 8px;font:11px/1.4 ui-monospace,monospace;
      color:color-mix(in srgb,currentColor 70%,transparent);word-break:break-word}
    .sc-interp.sc-missing{display:inline-block;width:2em;height:1em;overflow:hidden;
      vertical-align:text-bottom;background:rgba(255,255,255,.3);border:1px solid rgba(0,0,0,.5);
      border-radius:2px;box-sizing:border-box;color:transparent;
      user-select:none}
    .sc-interp.sc-unresolved{font-family:ui-monospace,monospace;font-size:.85em;
      color:color-mix(in srgb,currentColor 50%,transparent);
      background:color-mix(in srgb,currentColor 10%,transparent);border-radius:3px;
      padding:0 3px}
    .sc-host.sc-has-error{position:relative}
    .sc-logic-error{position:absolute;top:8px;left:8px;z-index:2147483647;max-width:60ch;
      padding:6px 10px;background:#b00020;color:#fff;font:12px/1.4 ui-monospace,monospace;
      border-radius:4px;white-space:pre-wrap;pointer-events:none}
    /* Mirrors PRINT_BASELINE_CSS in apps/web deck-stage-export.ts — keep both
       in sync until dc-runtime regains a build step. */
    @media print {
      @page { margin: 0.5cm; }
      figure, table { break-inside: avoid; }
      #dc-root, #dc-root > .sc-host { height: auto; }
      *, *::before, *::after {
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
        backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
        animation-delay: -99s !important; animation-duration: .001s !important;
        animation-iteration-count: 1 !important; animation-fill-mode: both !important;
        animation-play-state: running !important; transition-duration: 0s !important;
      }
    }
  </style>
<meta charset="utf-8">
<title>Смены и отчёт</title>
<style>x-dc{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#FFFFFF;border-top:1px solid #EAECF0;padding:8px 4px 14px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:#667085;text-decoration:none;padding:6px 0}
.nav a.on{color:#0B2A3C;font-weight:800}
.nav a.on span{background:#FFD600}
.nav span{width:44px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:13px;font-weight:600;color:#344054}
.chip.on{border:0;background:#0B2A3C;color:#FFFFFF}
.pm{display:flex;flex-direction:column;gap:2px;flex-grow:1}
.pm span{font-size:11px;color:#C7D2DB}
.pm b{font-size:14px}
.sh{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:#FFFFFF;border:0;font-family:inherit;text-align:left;width:100%}
</style></head>
<body>
<div id="dc-root"><div class="sc-host" data-sc-name="PAdmShifts"><div style="width: 390px; height: 844px; box-sizing: border-box; background: rgb(244, 245, 247); font-family: Montserrat, system-ui, sans-serif; color: rgb(17, 24, 39); display: flex; flex-direction: column;">
  <header style="padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 10px;">
    <b style="font-size: 20px; font-weight: 800;">Отчёты</b>
    <div style="display: flex; gap: 6px;"><button type="button" class="chip on">Сегодня</button><button type="button" class="chip">Вчера</button><button type="button" class="chip">Неделя</button><button type="button" class="chip">Месяц</button></div>
  </header>

  <main style="flex-grow: 1; padding: 0px 16px 12px; display: flex; flex-direction: column; gap: 10px; overflow: hidden;">
    <section style="border-radius: 20px; background: rgb(11, 42, 60); color: rgb(255, 255, 255); padding: 16px; display: flex; flex-direction: column; gap: 12px;">
      <span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 12px; color: rgb(199, 210, 219);">Выручка</span><b style="font-size: 28px; font-weight: 800; color: rgb(255, 214, 0);">[сумма]</b></span>
      <div style="display: flex; gap: 8px;"><span class="pm"><span>Наличные</span><b>[сумма]</b></span><span class="pm"><span>Карта</span><b>[сумма]</b></span><span class="pm"><span>QR</span><b>[сумма]</b></span></div>
    </section>

    <span style="font-size: 12px; font-weight: 700; color: rgb(102, 112, 133);">СМЕНЫ</span>
    <button type="button" class="sh"><span style="width: 40px; height: 40px; border-radius: 20px; background: rgb(255, 214, 0); color: rgb(11, 42, 60); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px;">КТ</span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><b style="font-size: 14px;">Кассир Тест · Касса 1</b><span style="font-size: 12px; color: rgb(102, 112, 133);">с [время] · [N] чеков</span></span><span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;"><b style="font-size: 14px; color: rgb(11, 42, 60);">[сумма]</b><span style="font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: rgb(231, 246, 236); color: rgb(14, 122, 58);">открыта</span></span></button>
    <button type="button" class="sh"><span style="width: 40px; height: 40px; border-radius: 20px; background: rgb(242, 244, 247); color: rgb(11, 42, 60); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px;">[ИФ]</span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><b style="font-size: 14px;">[Сотрудник] · Телефон</b><span style="font-size: 12px; color: rgb(102, 112, 133);">[время]–[время] · [N] чеков</span></span><span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;"><b style="font-size: 14px; color: rgb(11, 42, 60);">[сумма]</b><span style="font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: rgb(242, 244, 247); color: rgb(52, 64, 84);">закрыта</span></span></button>
    <button type="button" class="sh"><span style="width: 40px; height: 40px; border-radius: 20px; background: rgb(242, 244, 247); color: rgb(11, 42, 60); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px;">[ИФ]</span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><b style="font-size: 14px;">[Сотрудник] · Веб-касса</b><span style="font-size: 12px; color: rgb(102, 112, 133);">[время]–[время] · [N] чеков</span></span><span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;"><b style="font-size: 14px; color: rgb(11, 42, 60);">[сумма]</b><span style="font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: rgb(253, 226, 225); color: rgb(180, 35, 24);">недостача</span></span></button>

    <button type="button" style="height: 48px; border-radius: 14px; border: 1.5px solid rgb(208, 213, 221); background: rgb(255, 255, 255); font-family: inherit; font-size: 14px; font-weight: 700; color: rgb(52, 64, 84); margin-top: auto;">Отправить отчёт в WhatsApp</button>
  </main>

  <nav class="nav" aria-label="Разделы администратора">
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21H3z"></path></svg></span>Главная</a>
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 4h2l2.5 11h11L21 7H6.5"></path><circle cx="9" cy="19.5" r="1.5"></circle><circle cx="17" cy="19.5" r="1.5"></circle></svg></span>Продажа</a>
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg></span>Товары</a>
    <a href="#" class="on"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span>Отчёты</a>
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg></span>Ещё</a>
  </nav></div></div></div>
