<!doctype html>
<html lang="ru"><head><style>
    .sc-placeholder{background:color-mix(in srgb,currentColor 8%,transparent);
      border:1px solid color-mix(in srgb,currentColor 50%,transparent);
      border-radius:2px;box-sizing:border-box;overflow:hidden}
    @keyframes sc-shine{0%{background-position:100% 50%}100%{background-position:0% 50%}}
    html.sc-dc-streaming .sc-placeholder,
    html.sc-dc-streaming .sc-interp.sc-missing{position:relative;
      background:color-mix(in srgb,currentColor 5%,transparent);
      border-color:transparent}
    html.sc-dc-streaming .sc-placeholder::before,
    html.sc-dc-streaming .sc-interp.sc-missing::before{content:'';
      position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(90deg,rgba(217,119,87,0) 25%,rgba(247,225,211,.95) 37%,rgba(217,119,87,0) 63%);
      background-size:400% 100%;animation:sc-shine 1.4s ease infinite}
    html.sc-dc-streaming .sc-placeholder:nth-child(n+9 of .sc-placeholder)::before,
    html.sc-dc-streaming .sc-interp.sc-missing:nth-child(n+9 of .sc-interp.sc-missing)::before{animation:none;
      background:color-mix(in srgb,currentColor 8%,transparent)}
    .sc-placeholder-error{padding:4px 8px;font:11px/1.4 ui-monospace,monospace;
      color:color-mix(in srgb,currentColor 70%,transparent);word-break:break-word}
    .sc-interp.sc-missing{display:inline-block;width:2em;height:1em;overflow:hidden;
      vertical-align:text-bottom;background:rgba(255,255,255,.3);border:1px solid rgba(0,0,0,.5);
      border-radius:2px;box-sizing:border-box;color:transparent;
      user-select:none}
    .sc-interp.sc-unresolved{font-family:ui-monospace,monospace;font-size:.85em;
      color:color-mix(in srgb,currentColor 50%,transparent);
      background:color-mix(in srgb,currentColor 10%,transparent);border-radius:3px;
      padding:0 3px}
    .sc-host.sc-has-error{position:relative}
    .sc-logic-error{position:absolute;top:8px;left:8px;z-index:2147483647;max-width:60ch;
      padding:6px 10px;background:#b00020;color:#fff;font:12px/1.4 ui-monospace,monospace;
      border-radius:4px;white-space:pre-wrap;pointer-events:none}
    /* Mirrors PRINT_BASELINE_CSS in apps/web deck-stage-export.ts — keep both
       in sync until dc-runtime regains a build step. */
    @media print {
      @page { margin: 0.5cm; }
      figure, table { break-inside: avoid; }
      #dc-root, #dc-root > .sc-host { height: auto; }
      *, *::before, *::after {
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
        backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
        animation-delay: -99s !important; animation-duration: .001s !important;
        animation-iteration-count: 1 !important; animation-fill-mode: both !important;
        animation-play-state: running !important; transition-duration: 0s !important;
      }
    }
  </style>
<meta charset="utf-8">
<title>Умная камера — проверка и загрузка</title>
<style>x-dc{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.card{background:#FFFFFF;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:10px}
.ph{width:44px;height:44px;border-radius:12px;flex-shrink:0}
.in{height:38px;box-sizing:border-box;border-radius:10px;border:1px solid #D0D5DD;padding:0 10px;font-family:inherit;font-size:13px;font-weight:700;width:100%;background:#FFFFFF}
.lbl{font-size:10px;font-weight:700;color:#667085;letter-spacing:.03em}
.tag{font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px}
.ex{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#FFFFFF}
</style></head>
<body>
<div id="dc-root"><div class="sc-host" data-sc-name="PSmartReview"><div style="width: 390px; height: 844px; box-sizing: border-box; background: rgb(244, 245, 247); font-family: Montserrat, system-ui, sans-serif; color: rgb(17, 24, 39); display: flex; flex-direction: column;">
  <header style="padding: 18px 16px 10px; display: flex; align-items: center; gap: 12px;">
    <button type="button" aria-label="Назад к камере" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid rgb(229, 231, 235); background: rgb(255, 255, 255); color: rgb(52, 64, 84); display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <span style="display: flex; flex-direction: column; flex-grow: 1;"><b style="font-size: 17px; font-weight: 800;">Проверьте товары</b><span style="font-size: 12px; color: rgb(102, 112, 133);">2 новых · 3 пополнить остаток</span></span>
  </header>

  <main style="flex-grow: 1; padding: 0px 16px 10px; display: flex; flex-direction: column; gap: 8px; overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 8px; border-radius: 12px; background: rgb(255, 247, 204); padding: 8px 12px; font-size: 12px; color: rgb(11, 42, 60);"><b>Наценка 30 %</b><span style="flex-grow: 1;">· цена округляется до 5 сом</span><a href="#" style="font-weight: 700;">Изменить</a></div>

    <span class="lbl">НОВЫЕ ТОВАРЫ</span>
    <section class="card">
      <div class="top"><span class="ph" style="background: rgb(245, 158, 11);"></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><b style="font-size: 13px;">Сок Gracio яблочный 1л</b><span style="font-size: 11px; color: rgb(102, 112, 133);">Штрихкод найден на этикетке</span></span><span class="tag" style="background: rgb(231, 246, 236); color: rgb(14, 122, 58);">точно</span></div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0px, 1fr)); gap: 6px;">
        <span style="display: flex; flex-direction: column; gap: 3px;"><label class="lbl" for="b1">ЗАКУПКА</label><input id="b1" class="in" type="text" placeholder="[цена]"></span>
        <span style="display: flex; flex-direction: column; gap: 3px;"><label class="lbl" for="s1">ПРОДАЖА</label><input id="s1" class="in" type="text" placeholder="авто"></span>
        <span style="display: flex; flex-direction: column; gap: 3px;"><label class="lbl" for="q1">КОЛ-ВО</label><input id="q1" class="in" type="text" value="2"></span>
      </div>
    </section>
    <section class="card" style="border: 2px solid rgb(255, 214, 0);">
      <div class="top"><span class="ph" style="background: rgb(74, 222, 128);"></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><label class="lbl" for="n2">НАЗВАНИЕ</label><input id="n2" class="in" type="text" placeholder="Камера не уверена — впишите"></span><span class="tag" style="background: rgb(254, 243, 226); color: rgb(181, 71, 8);">уточнить</span></div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0px, 1fr)); gap: 6px;">
        <span style="display: flex; flex-direction: column; gap: 3px;"><label class="lbl" for="b2">ЗАКУПКА</label><input id="b2" class="in" type="text" placeholder="[цена]"></span>
        <span style="display: flex; flex-direction: column; gap: 3px;"><label class="lbl" for="s2">ПРОДАЖА</label><input id="s2" class="in" type="text" placeholder="авто"></span>
        <span style="display: flex; flex-direction: column; gap: 3px;"><label class="lbl" for="q2">КОЛ-ВО</label><input id="q2" class="in" type="text" value="1"></span>
      </div>
    </section>

    <span class="lbl" style="padding-top: 4px;">УЖЕ ЕСТЬ — ДОБАВИТЬ К ОСТАТКУ</span>
    <div class="ex"><span class="ph" style="width: 36px; height: 36px; background: rgb(185, 28, 28);"></span><span style="flex-grow: 1; font-size: 13px; font-weight: 600;">Кока-Кола (ПЭТ) 2л</span><b style="font-size: 13px; color: rgb(14, 122, 58);">+2</b></div>
    <div class="ex"><span class="ph" style="width: 36px; height: 36px; background: rgb(124, 45, 18);"></span><span style="flex-grow: 1; font-size: 13px; font-weight: 600;">Mars</span><b style="font-size: 13px; color: rgb(14, 122, 58);">+3</b></div>
    <div class="ex"><span class="ph" style="width: 36px; height: 36px; background: rgb(253, 230, 138);"></span><span style="flex-grow: 1; font-size: 13px; font-weight: 600;">Макароны «Макфа» спагетти 450г</span><b style="font-size: 13px; color: rgb(14, 122, 58);">+1</b></div>
    <label style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: rgb(52, 64, 84); padding-top: 2px;"><input type="checkbox" checked="" style="width: 20px; height: 20px; accent-color: rgb(11, 42, 60);">Поставить новым товарам фото с полки</label>
  </main>

  <div style="padding: 10px 16px 22px; display: flex; gap: 8px; background: rgb(255, 255, 255); border-top: 1px solid rgb(234, 236, 240);">
    <button type="button" style="height: 56px; padding: 0px 16px; border-radius: 16px; border: 1.5px solid rgb(208, 213, 221); background: rgb(255, 255, 255); font-family: inherit; font-size: 14px; font-weight: 700; color: rgb(52, 64, 84);">Ещё снимок</button>
    <button type="button" style="flex-grow: 1; height: 56px; border-radius: 16px; border: 0px; background: rgb(255, 214, 0); color: rgb(11, 42, 60); font-family: inherit; font-size: 16px; font-weight: 800;">Загрузить 5 товаров</button>
  </div></div></div></div>



</body></html>
