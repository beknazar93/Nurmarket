<!doctype html>
<html lang="ru"><head><style>
    .sc-placeholder{background:color-mix(in srgb,currentColor 8%,transparent);
      border:1px solid color-mix(in srgb,currentColor 50%,transparent);
      border-radius:2px;box-sizing:border-box;overflow:hidden}
    @keyframes sc-shine{0%{background-position:100% 50%}100%{background-position:0% 50%}}
    html.sc-dc-streaming .sc-placeholder,
    html.sc-dc-streaming .sc-interp.sc-missing{position:relative;
      background:color-mix(in srgb,currentColor 5%,transparent);
      border-color:transparent}
    html.sc-dc-streaming .sc-placeholder::before,
    html.sc-dc-streaming .sc-interp.sc-missing::before{content:'';
      position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(90deg,rgba(217,119,87,0) 25%,rgba(247,225,211,.95) 37%,rgba(217,119,87,0) 63%);
      background-size:400% 100%;animation:sc-shine 1.4s ease infinite}
    html.sc-dc-streaming .sc-placeholder:nth-child(n+9 of .sc-placeholder)::before,
    html.sc-dc-streaming .sc-interp.sc-missing:nth-child(n+9 of .sc-interp.sc-missing)::before{animation:none;
      background:color-mix(in srgb,currentColor 8%,transparent)}
    .sc-placeholder-error{padding:4px 8px;font:11px/1.4 ui-monospace,monospace;
      color:color-mix(in srgb,currentColor 70%,transparent);word-break:break-word}
    .sc-interp.sc-missing{display:inline-block;width:2em;height:1em;overflow:hidden;
      vertical-align:text-bottom;background:rgba(255,255,255,.3);border:1px solid rgba(0,0,0,.5);
      border-radius:2px;box-sizing:border-box;color:transparent;
      user-select:none}
    .sc-interp.sc-unresolved{font-family:ui-monospace,monospace;font-size:.85em;
      color:color-mix(in srgb,currentColor 50%,transparent);
      background:color-mix(in srgb,currentColor 10%,transparent);border-radius:3px;
      padding:0 3px}
    .sc-host.sc-has-error{position:relative}
    .sc-logic-error{position:absolute;top:8px;left:8px;z-index:2147483647;max-width:60ch;
      padding:6px 10px;background:#b00020;color:#fff;font:12px/1.4 ui-monospace,monospace;
      border-radius:4px;white-space:pre-wrap;pointer-events:none}
    /* Mirrors PRINT_BASELINE_CSS in apps/web deck-stage-export.ts — keep both
       in sync until dc-runtime regains a build step. */
    @media print {
      @page { margin: 0.5cm; }
      figure, table { break-inside: avoid; }
      #dc-root, #dc-root > .sc-host { height: auto; }
      *, *::before, *::after {
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
        backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
        animation-delay: -99s !important; animation-duration: .001s !important;
        animation-iteration-count: 1 !important; animation-fill-mode: both !important;
        animation-play-state: running !important; transition-duration: 0s !important;
      }
    }
  </style>
<meta charset="utf-8">
<title>Чек — отправить, печать</title>
<style>x-dc{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.rl{display:flex;justify-content:space-between;font-size:13px}
.act{height:72px;border-radius:16px;border:1px solid #E5E7EB;background:#FFFFFF;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;color:#344054}
</style></head>
<body>
<div id="dc-root"><div class="sc-host" data-sc-name="PCashCheck"><div style="width: 390px; height: 844px; box-sizing: border-box; background: rgb(244, 245, 247); font-family: Montserrat, system-ui, sans-serif; color: rgb(17, 24, 39); display: flex; flex-direction: column;">
  <header style="padding: 18px 16px 8px; display: flex; align-items: center; gap: 12px;">
    <button type="button" aria-label="Назад к чекам" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid rgb(229, 231, 235); background: rgb(255, 255, 255); color: rgb(52, 64, 84); display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <span style="display: flex; flex-direction: column; flex-grow: 1;"><b style="font-size: 18px; font-weight: 800;">Чек [№]</b><span style="font-size: 12px; color: rgb(102, 112, 133);">[дата, время] · Кассир Тест</span></span>
  </header>

  <main style="flex-grow: 1; padding: 8px 16px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; gap: 10px; border-radius: 14px; background: rgb(254, 243, 226); padding: 10px 12px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B54708" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0M12 19h.01"></path></svg><span style="font-size: 12px; font-weight: 600; color: rgb(147, 55, 13);">Нет связи — чек сохранён и уйдёт на сервер сам</span></div>

    <section style="background: rgb(255, 255, 255); border-radius: 18px; padding: 18px 18px 22px; display: flex; flex-direction: column; gap: 8px; box-shadow: rgba(16, 24, 40, 0.05) 0px 1px 2px;">
      <b style="font-size: 16px; text-align: center;">NBS</b>
      <span style="font-size: 12px; color: rgb(102, 112, 133); text-align: center;">[адрес магазина]</span>
      <span style="border-top: 1px dashed rgb(208, 213, 221); margin: 6px 0px;"></span>
      <div class="rl"><span>Макароны «Макфа» спагетти 450г</span></div>
      <div class="rl" style="color: rgb(102, 112, 133);"><span>2 × 85</span><b style="color: rgb(17, 24, 39);">170</b></div>
      <div class="rl"><span>Mars</span></div>
      <div class="rl" style="color: rgb(102, 112, 133);"><span>1 × 39</span><b style="color: rgb(17, 24, 39);">39</b></div>
      <span style="border-top: 1px dashed rgb(208, 213, 221); margin: 6px 0px;"></span>
      <div class="rl" style="font-size: 16px;"><b>Итого</b><b style="color: rgb(11, 42, 60);">209 сом</b></div>
      <div class="rl" style="color: rgb(71, 84, 103);"><span>Наличные</span><span>500</span></div>
      <div class="rl" style="color: rgb(71, 84, 103);"><span>Сдача</span><span>291</span></div>
    </section>

    <span style="font-size: 11px; font-weight: 700; color: rgb(102, 112, 133); letter-spacing: 0.03em;">ОТПРАВИТЬ ПОКУПАТЕЛЮ</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0px, 1fr)); gap: 8px;">
      <button type="button" class="act"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E7A3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l1.6-4.7A8.5 8.5 0 1 1 7.7 19.4z"></path></svg>WhatsApp</button>
      <button type="button" class="act"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4 3 11l6 2 2 6 3-4 5 4z"></path></svg>Telegram</button>
      <button type="button" class="act"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2"></path><rect x="6" y="14" width="12" height="7"></rect></svg>На кассе</button>
    </div>
    <button type="button" disabled="" style="height: 48px; border-radius: 14px; border: 1px dashed rgb(208, 213, 221); background: transparent; font-family: inherit; font-size: 13px; font-weight: 600; color: rgb(102, 112, 133); display: flex; align-items: center; justify-content: center; gap: 8px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Возврат — с разрешения администратора</button>
  </main></div></div></div>



</body></html>
