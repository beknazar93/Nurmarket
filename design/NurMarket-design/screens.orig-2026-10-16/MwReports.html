<!doctype html>
<html lang="ru"><head><style>
    .sc-placeholder{background:color-mix(in srgb,currentColor 8%,transparent);
      border:1px solid color-mix(in srgb,currentColor 50%,transparent);
      border-radius:2px;box-sizing:border-box;overflow:hidden}
    @keyframes sc-shine{0%{background-position:100% 50%}100%{background-position:0% 50%}}
    html.sc-dc-streaming .sc-placeholder,
    html.sc-dc-streaming .sc-interp.sc-missing{position:relative;
      background:color-mix(in srgb,currentColor 5%,transparent);
      border-color:transparent}
    html.sc-dc-streaming .sc-placeholder::before,
    html.sc-dc-streaming .sc-interp.sc-missing::before{content:'';
      position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(90deg,rgba(217,119,87,0) 25%,rgba(247,225,211,.95) 37%,rgba(217,119,87,0) 63%);
      background-size:400% 100%;animation:sc-shine 1.4s ease infinite}
    html.sc-dc-streaming .sc-placeholder:nth-child(n+9 of .sc-placeholder)::before,
    html.sc-dc-streaming .sc-interp.sc-missing:nth-child(n+9 of .sc-interp.sc-missing)::before{animation:none;
      background:color-mix(in srgb,currentColor 8%,transparent)}
    .sc-placeholder-error{padding:4px 8px;font:11px/1.4 ui-monospace,monospace;
      color:color-mix(in srgb,currentColor 70%,transparent);word-break:break-word}
    .sc-interp.sc-missing{display:inline-block;width:2em;height:1em;overflow:hidden;
      vertical-align:text-bottom;background:rgba(255,255,255,.3);border:1px solid rgba(0,0,0,.5);
      border-radius:2px;box-sizing:border-box;color:transparent;
      user-select:none}
    .sc-interp.sc-unresolved{font-family:ui-monospace,monospace;font-size:.85em;
      color:color-mix(in srgb,currentColor 50%,transparent);
      background:color-mix(in srgb,currentColor 10%,transparent);border-radius:3px;
      padding:0 3px}
    .sc-host.sc-has-error{position:relative}
    .sc-logic-error{position:absolute;top:8px;left:8px;z-index:2147483647;max-width:60ch;
      padding:6px 10px;background:#b00020;color:#fff;font:12px/1.4 ui-monospace,monospace;
      border-radius:4px;white-space:pre-wrap;pointer-events:none}
    /* Mirrors PRINT_BASELINE_CSS in apps/web deck-stage-export.ts — keep both
       in sync until dc-runtime regains a build step. */
    @media print {
      @page { margin: 0.5cm; }
      figure, table { break-inside: avoid; }
      #dc-root, #dc-root > .sc-host { height: auto; }
      *, *::before, *::after {
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
        backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
        animation-delay: -99s !important; animation-duration: .001s !important;
        animation-iteration-count: 1 !important; animation-fill-mode: both !important;
        animation-play-state: running !important; transition-duration: 0s !important;
      }
    }
  </style>
<meta charset="utf-8">
<title>Веб в телефоне — отчёты</title>
<style>x-dc{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.hb{width:44px;height:44px;border-radius:12px;border:0;background:#F2F4F7;color:#0B2A3C;display:flex;align-items:center;justify-content:center}
.chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:12px;font-weight:600;color:#344054;white-space:nowrap}
.chip.on{border:0;background:#0B2A3C;color:#FFFFFF}
.kpi{background:#FFFFFF;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.kpi span{font-size:11px;color:#667085;font-weight:600}
.kpi b{font-size:17px;font-weight:800;color:#0B2A3C}
.ab{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #F2F4F7;font-size:13px}
.g{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
</style></head>
<body>
<div id="dc-root"><div class="sc-host" data-sc-name="MwReports"><div style="width: 390px; height: 844px; box-sizing: border-box; background: rgb(244, 245, 247); font-family: Montserrat, system-ui, sans-serif; color: rgb(17, 24, 39); display: flex; flex-direction: column;">

    <b style="font-size: 16px; flex-grow: 1;">Прибыль и отчёты</b>
    <button type="button" class="hb" aria-label="Скачать Excel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"></path></svg></button>
  </header>
  <main style="flex-grow: 1; padding: 10px 16px 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden;">
    <div style="display: flex; gap: 6px; overflow: hidden;"><button type="button" class="chip on">Прибыль</button><button type="button" class="chip">ABC</button><button type="button" class="chip">В убыток</button><button type="button" class="chip">Кассиры</button></div>
    <div style="display: flex; gap: 6px; overflow: hidden;"><button type="button" class="chip">Сегодня</button><button type="button" class="chip on">Месяц</button><button type="button" class="chip">Свой период</button></div>
    <section style="border-radius: 18px; background: rgb(11, 42, 60); color: rgb(255, 255, 255); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 12px; color: rgb(199, 210, 219);">Чистая прибыль</span><b style="font-size: 26px; color: rgb(255, 214, 0);">[сумма]</b></section>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0px, 1fr)); gap: 6px;">
      <div class="kpi"><span>Выручка</span><b>[сумма]</b></div>
      <div class="kpi"><span>Себест.</span><b>[сумма]</b></div>
      <div class="kpi"><span>Расходы</span><b>[сумма]</b></div>
    </div>
    <section style="background: rgb(255, 255, 255); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;">
      <b style="font-size: 14px;">По дням</b>
      <div style="height: 100px; display: flex; align-items: flex-end; gap: 4px;"><span style="flex-grow: 1; height: 55%; border-radius: 3px 3px 0px 0px; background: rgb(203, 213, 225); display: flex; align-items: flex-end;"><span style="width: 100%; height: 18%; background: rgb(11, 42, 60); border-radius: 3px 3px 0px 0px;"></span></span><span style="flex-grow: 1; height: 70%; border-radius: 3px 3px 0px 0px; background: rgb(203, 213, 225); display: flex; align-items: flex-end;"><span style="width: 100%; height: 22%; background: rgb(11, 42, 60); border-radius: 3px 3px 0px 0px;"></span></span><span style="flex-grow: 1; height: 45%; border-radius: 3px 3px 0px 0px; background: rgb(203, 213, 225); display: flex; align-items: flex-end;"><span style="width: 100%; height: 14%; background: rgb(11, 42, 60); border-radius: 3px 3px 0px 0px;"></span></span><span style="flex-grow: 1; height: 80%; border-radius: 3px 3px 0px 0px; background: rgb(203, 213, 225); display: flex; align-items: flex-end;"><span style="width: 100%; height: 26%; background: rgb(11, 42, 60); border-radius: 3px 3px 0px 0px;"></span></span><span style="flex-grow: 1; height: 65%; border-radius: 3px 3px 0px 0px; background: rgb(203, 213, 225); display: flex; align-items: flex-end;"><span style="width: 100%; height: 21%; background: rgb(11, 42, 60); border-radius: 3px 3px 0px 0px;"></span></span><span style="flex-grow: 1; height: 90%; border-radius: 3px 3px 0px 0px; background: rgb(203, 213, 225); display: flex; align-items: flex-end;"><span style="width: 100%; height: 29%; background: rgb(11, 42, 60); border-radius: 3px 3px 0px 0px;"></span></span><span style="flex-grow: 1; height: 75%; border-radius: 3px 3px 0px 0px; background: rgb(203, 213, 225); display: flex; align-items: flex-end;"><span style="width: 100%; height: 24%; background: rgb(11, 42, 60); border-radius: 3px 3px 0px 0px;"></span></span><span style="flex-grow: 1; height: 60%; border-radius: 3px 3px 0px 0px; background: rgb(203, 213, 225); display: flex; align-items: flex-end;"><span style="width: 100%; height: 19%; background: rgb(11, 42, 60); border-radius: 3px 3px 0px 0px;"></span></span><span style="flex-grow: 1; height: 85%; border-radius: 3px 3px 0px 0px; background: rgb(203, 213, 225); display: flex; align-items: flex-end;"><span style="width: 100%; height: 27%; background: rgb(11, 42, 60); border-radius: 3px 3px 0px 0px;"></span></span><span style="flex-grow: 1; height: 95%; border-radius: 3px 3px 0px 0px; background: rgb(203, 213, 225); display: flex; align-items: flex-end;"><span style="width: 100%; height: 30%; background: rgb(11, 42, 60); border-radius: 3px 3px 0px 0px;"></span></span></div>
    </section>
    <section style="background: rgb(255, 255, 255); border-radius: 16px; padding: 6px 14px;">
      <div class="ab"><span class="g" style="background: rgb(231, 246, 236); color: rgb(14, 122, 58);">A</span><span style="flex-grow: 1;">[N] товаров</span><b>80 % выручки</b></div>
      <div class="ab"><span class="g" style="background: rgb(255, 247, 204); color: rgb(11, 42, 60);">B</span><span style="flex-grow: 1;">[N] товаров</span><b>15 %</b></div>
      <div class="ab" style="border: 0px;"><span class="g" style="background: rgb(242, 244, 247); color: rgb(71, 84, 103);">C</span><span style="flex-grow: 1;">[N] товаров</span><b>5 %</b></div>
    </section>
  </main></div></div></div>



</body></html>
