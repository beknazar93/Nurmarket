<!doctype html>
<html lang="ru"><head><style>
    .sc-placeholder{background:color-mix(in srgb,currentColor 8%,transparent);
      border:1px solid color-mix(in srgb,currentColor 50%,transparent);
      border-radius:2px;box-sizing:border-box;overflow:hidden}
    @keyframes sc-shine{0%{background-position:100% 50%}100%{background-position:0% 50%}}
    html.sc-dc-streaming .sc-placeholder,
    html.sc-dc-streaming .sc-interp.sc-missing{position:relative;
      background:color-mix(in srgb,currentColor 5%,transparent);
      border-color:transparent}
    html.sc-dc-streaming .sc-placeholder::before,
    html.sc-dc-streaming .sc-interp.sc-missing::before{content:'';
      position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(90deg,rgba(217,119,87,0) 25%,rgba(247,225,211,.95) 37%,rgba(217,119,87,0) 63%);
      background-size:400% 100%;animation:sc-shine 1.4s ease infinite}
    html.sc-dc-streaming .sc-placeholder:nth-child(n+9 of .sc-placeholder)::before,
    html.sc-dc-streaming .sc-interp.sc-missing:nth-child(n+9 of .sc-interp.sc-missing)::before{animation:none;
      background:color-mix(in srgb,currentColor 8%,transparent)}
    .sc-placeholder-error{padding:4px 8px;font:11px/1.4 ui-monospace,monospace;
      color:color-mix(in srgb,currentColor 70%,transparent);word-break:break-word}
    .sc-interp.sc-missing{display:inline-block;width:2em;height:1em;overflow:hidden;
      vertical-align:text-bottom;background:rgba(255,255,255,.3);border:1px solid rgba(0,0,0,.5);
      border-radius:2px;box-sizing:border-box;color:transparent;
      user-select:none}
    .sc-interp.sc-unresolved{font-family:ui-monospace,monospace;font-size:.85em;
      color:color-mix(in srgb,currentColor 50%,transparent);
      background:color-mix(in srgb,currentColor 10%,transparent);border-radius:3px;
      padding:0 3px}
    .sc-host.sc-has-error{position:relative}
    .sc-logic-error{position:absolute;top:8px;left:8px;z-index:2147483647;max-width:60ch;
      padding:6px 10px;background:#b00020;color:#fff;font:12px/1.4 ui-monospace,monospace;
      border-radius:4px;white-space:pre-wrap;pointer-events:none}
    /* Mirrors PRINT_BASELINE_CSS in apps/web deck-stage-export.ts — keep both
       in sync until dc-runtime regains a build step. */
    @media print {
      @page { margin: 0.5cm; }
      figure, table { break-inside: avoid; }
      #dc-root, #dc-root > .sc-host { height: auto; }
      *, *::before, *::after {
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
        backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
        animation-delay: -99s !important; animation-duration: .001s !important;
        animation-iteration-count: 1 !important; animation-fill-mode: both !important;
        animation-play-state: running !important; transition-duration: 0s !important;
      }
    }
  </style>
<meta charset="utf-8">
<title>Кассир — ревизия</title>
<style>x-dc{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.row{display:grid;grid-template-columns:1fr 54px 64px;gap:8px;align-items:center;padding:10px 12px;border-radius:14px;background:#FFFFFF;font-size:13px}
.cnt{height:38px;box-sizing:border-box;border-radius:10px;border:2px solid #0B2A3C;font-family:inherit;font-size:15px;font-weight:800;text-align:center;width:100%}
.chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:12px;font-weight:600;color:#344054;white-space:nowrap}
.chip.on{border:0;background:#0B2A3C;color:#FFFFFF}
</style></head>
<body>
<div id="dc-root"><div class="sc-host" data-sc-name="PCashAudit"><div style="width: 390px; height: 844px; box-sizing: border-box; background: rgb(244, 245, 247); font-family: Montserrat, system-ui, sans-serif; color: rgb(17, 24, 39); display: flex; flex-direction: column;">
  <header style="padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <button type="button" aria-label="Назад" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid rgb(229, 231, 235); background: rgb(255, 255, 255); color: rgb(52, 64, 84); display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
      <span style="display: flex; flex-direction: column; flex-grow: 1;"><b style="font-size: 18px; font-weight: 800;">Ревизия · Напитки</b><span style="font-size: 12px; color: rgb(102, 112, 133);">Проверено [N] из [N]</span></span>
      <button type="button" aria-label="Сканировать" style="width: 44px; height: 44px; border-radius: 14px; border: 0px; background: rgb(11, 42, 60); color: rgb(255, 214, 0); display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path><path d="M8 9v6M12 9v6M16 9v6"></path></svg></button>
    </div>
    <span style="height: 8px; border-radius: 4px; background: rgb(228, 231, 236); overflow: hidden;"><span style="display: block; width: 40%; height: 8px; background: rgb(255, 214, 0);"></span></span>
    <div style="display: flex; gap: 6px;"><button type="button" class="chip on">Все</button><button type="button" class="chip">Не проверены</button><button type="button" class="chip">Расхождения</button></div>
  </header>

  <main style="flex-grow: 1; padding: 0px 16px 12px; display: flex; flex-direction: column; gap: 8px; overflow: hidden;">
    <div class="row" style="background: transparent; font-size: 11px; font-weight: 700; color: rgb(102, 112, 133); padding: 0px 12px;"><span>ТОВАР</span><span>В БАЗЕ</span><span>НАШЛИ</span></div>
    <div class="row"><span style="font-weight: 600;">Кока-Кола (ПЭТ) 2л</span><span style="color: rgb(71, 84, 103);">[N]</span><input class="cnt" type="text" placeholder="?" aria-label="Нашли, Кока-Кола"></div>
    <div class="row" style="border: 2px solid rgb(253, 226, 225);"><span style="display: flex; flex-direction: column; gap: 2px;"><b style="font-weight: 600;">Сок Gracio яблочный 1л</b><span style="font-size: 11px; font-weight: 700; color: rgb(180, 35, 24);">не хватает 1</span></span><span style="color: rgb(71, 84, 103);">2</span><input class="cnt" type="text" aria-label="Нашли, сок" value="1" style="border-color: rgb(180, 35, 24);"></div>
    <div class="row"><span style="display: flex; flex-direction: column; gap: 2px;"><b style="font-weight: 600;">Адыгене 1л</b><span style="font-size: 11px; font-weight: 700; color: rgb(14, 122, 58);">совпало</span></span><span style="color: rgb(71, 84, 103);">10</span><input class="cnt" type="text" aria-label="Нашли, Адыгене" value="10" style="border-color: rgb(22, 163, 74);"></div>
    <div class="row"><span style="font-weight: 600;">[товар]</span><span style="color: rgb(71, 84, 103);">[N]</span><input class="cnt" type="text" placeholder="?" aria-label="Нашли"></div>
  </main>

  <div style="padding: 10px 16px 22px; display: flex; flex-direction: column; gap: 8px; background: rgb(255, 255, 255); border-top: 1px solid rgb(234, 236, 240);">
    <span style="font-size: 12px; color: rgb(102, 112, 133); text-align: center;">Остатки поменяет администратор после проверки</span>
    <button type="button" style="height: 54px; border-radius: 16px; border: 0px; background: rgb(255, 214, 0); color: rgb(11, 42, 60); font-family: inherit; font-size: 16px; font-weight: 800;">Отправить администратору</button>
  </div></div></div></div>



</body></html>
