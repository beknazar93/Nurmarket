<!doctype html>
<html lang="ru"><head><style>
    .sc-placeholder{background:color-mix(in srgb,currentColor 8%,transparent);
      border:1px solid color-mix(in srgb,currentColor 50%,transparent);
      border-radius:2px;box-sizing:border-box;overflow:hidden}
    @keyframes sc-shine{0%{background-position:100% 50%}100%{background-position:0% 50%}}
    html.sc-dc-streaming .sc-placeholder,
    html.sc-dc-streaming .sc-interp.sc-missing{position:relative;
      background:color-mix(in srgb,currentColor 5%,transparent);
      border-color:transparent}
    html.sc-dc-streaming .sc-placeholder::before,
    html.sc-dc-streaming .sc-interp.sc-missing::before{content:'';
      position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(90deg,rgba(217,119,87,0) 25%,rgba(247,225,211,.95) 37%,rgba(217,119,87,0) 63%);
      background-size:400% 100%;animation:sc-shine 1.4s ease infinite}
    html.sc-dc-streaming .sc-placeholder:nth-child(n+9 of .sc-placeholder)::before,
    html.sc-dc-streaming .sc-interp.sc-missing:nth-child(n+9 of .sc-interp.sc-missing)::before{animation:none;
      background:color-mix(in srgb,currentColor 8%,transparent)}
    .sc-placeholder-error{padding:4px 8px;font:11px/1.4 ui-monospace,monospace;
      color:color-mix(in srgb,currentColor 70%,transparent);word-break:break-word}
    .sc-interp.sc-missing{display:inline-block;width:2em;height:1em;overflow:hidden;
      vertical-align:text-bottom;background:rgba(255,255,255,.3);border:1px solid rgba(0,0,0,.5);
      border-radius:2px;box-sizing:border-box;color:transparent;
      user-select:none}
    .sc-interp.sc-unresolved{font-family:ui-monospace,monospace;font-size:.85em;
      color:color-mix(in srgb,currentColor 50%,transparent);
      background:color-mix(in srgb,currentColor 10%,transparent);border-radius:3px;
      padding:0 3px}
    .sc-host.sc-has-error{position:relative}
    .sc-logic-error{position:absolute;top:8px;left:8px;z-index:2147483647;max-width:60ch;
      padding:6px 10px;background:#b00020;color:#fff;font:12px/1.4 ui-monospace,monospace;
      border-radius:4px;white-space:pre-wrap;pointer-events:none}
    /* Mirrors PRINT_BASELINE_CSS in apps/web deck-stage-export.ts — keep both
       in sync until dc-runtime regains a build step. */
    @media print {
      @page { margin: 0.5cm; }
      figure, table { break-inside: avoid; }
      #dc-root, #dc-root > .sc-host { height: auto; }
      *, *::before, *::after {
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
        backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
        animation-delay: -99s !important; animation-duration: .001s !important;
        animation-iteration-count: 1 !important; animation-fill-mode: both !important;
        animation-play-state: running !important; transition-duration: 0s !important;
      }
    }
  </style>
<meta charset="utf-8">
<title>Сканер камерой</title>
<style>x-dc{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.rb{width:44px;height:44px;border-radius:22px;border:0;background:rgba(255,255,255,.14);color:#FFFFFF;display:flex;align-items:center;justify-content:center}
.seg{flex-grow:1;height:36px;border-radius:10px;border:0;font-family:inherit;font-size:12px;font-weight:700}
</style></head>
<body>
<div id="dc-root"><div class="sc-host" data-sc-name="PCashScan"><div style="width: 390px; height: 844px; box-sizing: border-box; background: rgb(10, 22, 32); font-family: Montserrat, system-ui, sans-serif; color: rgb(17, 24, 39); display: flex; flex-direction: column; position: relative;">
  <header style="padding: 18px 16px; display: flex; align-items: center; gap: 10px; color: rgb(255, 255, 255);">
    <button type="button" class="rb" aria-label="Закрыть сканер"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    <span style="flex-grow: 1; display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(255, 255, 255, 0.1);">
      <button type="button" class="seg" style="background: rgb(255, 214, 0); color: rgb(11, 42, 60);">В чек</button>
      <button type="button" class="seg" style="background: transparent; color: rgb(208, 213, 221);">Узнать цену</button>
      <button type="button" class="seg" style="background: transparent; color: rgb(208, 213, 221);">Приёмка</button>
    </span>
    <button type="button" class="rb" aria-label="Фонарик"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg></button>
  </header>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;">
    <div style="width: 270px; height: 170px; position: relative; border-radius: 18px; box-shadow: rgba(0, 0, 0, 0.35) 0px 0px 0px 999px;">
      <span style="position: absolute; left: 0px; top: 0px; width: 36px; height: 36px; border-left: 4px solid rgb(255, 214, 0); border-top: 4px solid rgb(255, 214, 0); border-top-left-radius: 18px;"></span>
      <span style="position: absolute; right: 0px; top: 0px; width: 36px; height: 36px; border-right: 4px solid rgb(255, 214, 0); border-top: 4px solid rgb(255, 214, 0); border-top-right-radius: 18px;"></span>
      <span style="position: absolute; left: 0px; bottom: 0px; width: 36px; height: 36px; border-left: 4px solid rgb(255, 214, 0); border-bottom: 4px solid rgb(255, 214, 0); border-bottom-left-radius: 18px;"></span>
      <span style="position: absolute; right: 0px; bottom: 0px; width: 36px; height: 36px; border-right: 4px solid rgb(255, 214, 0); border-bottom: 4px solid rgb(255, 214, 0); border-bottom-right-radius: 18px;"></span>
      <span style="position: absolute; left: 24px; right: 24px; top: 84px; height: 2px; background: rgb(255, 214, 0); box-shadow: rgb(255, 214, 0) 0px 0px 12px;"></span>
    </div>
    <span style="font-size: 13px; color: rgb(199, 210, 219);">Наведите на штрихкод — товар добавится сам</span>
  </div>

  <section style="background: rgb(255, 255, 255); border-radius: 24px 24px 0px 0px; padding: 14px 18px 22px; display: flex; flex-direction: column; gap: 12px;">
    <span style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: rgb(208, 213, 221);"></span>
    <div style="display: flex; gap: 12px; align-items: center;">
      <span style="width: 56px; height: 56px; border-radius: 14px; background: rgb(255, 244, 194); display: flex; align-items: center; justify-content: center; font-weight: 800; color: rgb(11, 42, 60);">Мк</span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><b style="font-size: 15px;">Макароны «Макфа» спагетти 450г</b><span style="font-size: 12px; color: rgb(102, 112, 133);">4702154000047 · на складе 48 шт.</span></span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <b style="font-size: 24px; font-weight: 800; color: rgb(11, 42, 60);">85 сом</b>
      <span style="display: flex; align-items: center; gap: 10px;"><button type="button" aria-label="Меньше" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid rgb(208, 213, 221); background: rgb(255, 255, 255); font-size: 20px; font-family: inherit;">−</button><b style="font-size: 18px; min-width: 20px; text-align: center;">1</b><button type="button" aria-label="Больше" style="width: 40px; height: 40px; border-radius: 20px; border: 0px; background: rgb(11, 42, 60); color: rgb(255, 255, 255); font-size: 20px; font-family: inherit;">+</button></span>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: rgb(52, 64, 84);"><input type="checkbox" checked="" style="width: 20px; height: 20px; accent-color: rgb(11, 42, 60);">Сканировать подряд, без подтверждения</label>
    <div style="display: flex; gap: 8px;">
      <button type="button" style="height: 52px; padding: 0px 16px; border-radius: 14px; border: 1.5px solid rgb(208, 213, 221); background: rgb(255, 255, 255); font-family: inherit; font-size: 14px; font-weight: 700; color: rgb(52, 64, 84);">Чек · 2</button>
      <button type="button" style="flex-grow: 1; height: 52px; border-radius: 14px; border: 0px; background: rgb(255, 214, 0); color: rgb(11, 42, 60); font-family: inherit; font-size: 16px; font-weight: 800;">Добавить в чек</button>
    </div>
  </section></div></div></div>



</body></html>
