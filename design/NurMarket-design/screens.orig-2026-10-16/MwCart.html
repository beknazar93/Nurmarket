<!doctype html>
<html lang="ru"><head><style>
    .sc-placeholder{background:color-mix(in srgb,currentColor 8%,transparent);
      border:1px solid color-mix(in srgb,currentColor 50%,transparent);
      border-radius:2px;box-sizing:border-box;overflow:hidden}
    @keyframes sc-shine{0%{background-position:100% 50%}100%{background-position:0% 50%}}
    html.sc-dc-streaming .sc-placeholder,
    html.sc-dc-streaming .sc-interp.sc-missing{position:relative;
      background:color-mix(in srgb,currentColor 5%,transparent);
      border-color:transparent}
    html.sc-dc-streaming .sc-placeholder::before,
    html.sc-dc-streaming .sc-interp.sc-missing::before{content:'';
      position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(90deg,rgba(217,119,87,0) 25%,rgba(247,225,211,.95) 37%,rgba(217,119,87,0) 63%);
      background-size:400% 100%;animation:sc-shine 1.4s ease infinite}
    html.sc-dc-streaming .sc-placeholder:nth-child(n+9 of .sc-placeholder)::before,
    html.sc-dc-streaming .sc-interp.sc-missing:nth-child(n+9 of .sc-interp.sc-missing)::before{animation:none;
      background:color-mix(in srgb,currentColor 8%,transparent)}
    .sc-placeholder-error{padding:4px 8px;font:11px/1.4 ui-monospace,monospace;
      color:color-mix(in srgb,currentColor 70%,transparent);word-break:break-word}
    .sc-interp.sc-missing{display:inline-block;width:2em;height:1em;overflow:hidden;
      vertical-align:text-bottom;background:rgba(255,255,255,.3);border:1px solid rgba(0,0,0,.5);
      border-radius:2px;box-sizing:border-box;color:transparent;
      user-select:none}
    .sc-interp.sc-unresolved{font-family:ui-monospace,monospace;font-size:.85em;
      color:color-mix(in srgb,currentColor 50%,transparent);
      background:color-mix(in srgb,currentColor 10%,transparent);border-radius:3px;
      padding:0 3px}
    .sc-host.sc-has-error{position:relative}
    .sc-logic-error{position:absolute;top:8px;left:8px;z-index:2147483647;max-width:60ch;
      padding:6px 10px;background:#b00020;color:#fff;font:12px/1.4 ui-monospace,monospace;
      border-radius:4px;white-space:pre-wrap;pointer-events:none}
    /* Mirrors PRINT_BASELINE_CSS in apps/web deck-stage-export.ts — keep both
       in sync until dc-runtime regains a build step. */
    @media print {
      @page { margin: 0.5cm; }
      figure, table { break-inside: avoid; }
      #dc-root, #dc-root > .sc-host { height: auto; }
      *, *::before, *::after {
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
        backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
        animation-delay: -99s !important; animation-duration: .001s !important;
        animation-iteration-count: 1 !important; animation-fill-mode: both !important;
        animation-play-state: running !important; transition-duration: 0s !important;
      }
    }
  </style>
<meta charset="utf-8">
<title>Веб в телефоне — чек и оплата</title>
<style>x-dc{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.ln{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #F2F4F7}
.st{width:30px;height:30px;border-radius:15px;font-family:inherit;font-size:16px;display:flex;align-items:center;justify-content:center}
.m{flex-grow:1;height:46px;border-radius:12px;border:1px solid #E5E7EB;background:#FFFFFF;font-family:inherit;font-size:13px;font-weight:700;color:#344054}
.m.on{border:2px solid #0B2A3C;background:#FFF7CC;color:#0B2A3C}
.q{flex-grow:1;height:38px;border-radius:19px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:13px;font-weight:700;color:#344054}
</style></head>
<body>
<div id="dc-root"><div class="sc-host" data-sc-name="MwCart"><div style="width: 390px; height: 844px; box-sizing: border-box; background: rgb(244, 245, 247); font-family: Montserrat, system-ui, sans-serif; color: rgb(17, 24, 39); position: relative; overflow: hidden;">
  <header style="height: 60px; background: rgb(255, 255, 255); border-bottom: 1px solid rgb(234, 236, 240); display: flex; align-items: center; padding: 0px 68px;"><b style="font-size: 16px;">Веб-касса</b></header>
  <div style="padding: 16px; display: grid; grid-template-columns: repeat(2, minmax(0px, 1fr)); gap: 10px;"><span style="height: 150px; border-radius: 16px; background: rgb(255, 255, 255);"></span><span style="height: 150px; border-radius: 16px; background: rgb(255, 255, 255);"></span></div>
  <div style="position: absolute; inset: 0px; background: rgba(11, 42, 60, 0.45);"></div>

  <section role="dialog" aria-label="Чек и оплата" style="position: absolute; left: 0px; right: 0px; bottom: 0px; height: 690px; background: rgb(255, 255, 255); border-radius: 24px 24px 0px 0px; display: flex; flex-direction: column;">
    <span style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: rgb(208, 213, 221); margin-top: 10px;"></span>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 18px;"><b style="font-size: 18px; flex-grow: 1;">Чек · 2 позиции</b><button type="button" aria-label="Свернуть" style="width: 40px; height: 40px; border-radius: 12px; border: 1px solid rgb(229, 231, 235); background: rgb(255, 255, 255); color: rgb(52, 64, 84); display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button></div>
    <div style="padding: 0px 18px; display: flex; flex-direction: column;">
      <div class="ln"><span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 13px; font-weight: 600;">Макароны «Макфа» 450г</span><b style="font-size: 13px; color: rgb(11, 42, 60);">170 сом</b></span><button type="button" class="st" aria-label="Меньше" style="border: 1px solid rgb(208, 213, 221); background: rgb(255, 255, 255);">−</button><b style="min-width: 16px; text-align: center;">2</b><button type="button" class="st" aria-label="Больше" style="border: 0px; background: rgb(11, 42, 60); color: rgb(255, 255, 255);">+</button></div>
      <div class="ln"><span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 13px; font-weight: 600;">Mars</span><b style="font-size: 13px; color: rgb(11, 42, 60);">39 сом</b></span><button type="button" class="st" aria-label="Меньше" style="border: 1px solid rgb(208, 213, 221); background: rgb(255, 255, 255);">−</button><b style="min-width: 16px; text-align: center;">1</b><button type="button" class="st" aria-label="Больше" style="border: 0px; background: rgb(11, 42, 60); color: rgb(255, 255, 255);">+</button></div>
    </div>
    <div style="padding: 14px 18px 0px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; gap: 6px;"><button type="button" class="m on">Наличные</button><button type="button" class="m">Карта</button><button type="button" class="m">QR</button><button type="button" class="m">Долг</button></div>
      <label for="got" style="font-size: 11px; font-weight: 700; color: rgb(102, 112, 133);">ПОЛУЧЕНО</label>
      <input id="got" type="text" value="500" style="height: 52px; box-sizing: border-box; border-radius: 14px; border: 2px solid rgb(11, 42, 60); padding: 0px 14px; font-family: inherit; font-size: 22px; font-weight: 800;">
      <div style="display: flex; gap: 6px;"><button type="button" class="q">Без сдачи</button><button type="button" class="q">500</button><button type="button" class="q">1000</button></div>
      <div style="display: flex; justify-content: space-between; align-items: baseline;"><span style="font-size: 14px; font-weight: 700;">Сдача</span><b style="font-size: 22px; color: rgb(14, 122, 58);">291 сом</b></div>
    </div>
    <span style="flex-grow: 1;"></span>
    <div style="padding: 12px 18px 22px; border-top: 1px solid rgb(234, 236, 240); display: flex; align-items: center; gap: 12px;">
      <span style="display: flex; flex-direction: column;"><span style="font-size: 12px; color: rgb(102, 112, 133);">Итого</span><b style="font-size: 22px; color: rgb(11, 42, 60);">209 сом</b></span>
      <button type="button" style="flex-grow: 1; height: 56px; border-radius: 16px; border: 0px; background: rgb(255, 214, 0); color: rgb(11, 42, 60); font-family: inherit; font-size: 17px; font-weight: 800;">Провести</button>
    </div>
  </section></div></div></div>



</body></html>
