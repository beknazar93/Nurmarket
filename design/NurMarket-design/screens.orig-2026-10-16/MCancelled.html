<meta charset="utf-8">

<body>
<div id="dc-root"><div class="sc-host" data-sc-name="MCancelled"><div style="width: 1440px; height: 900px; box-sizing: border-box; background: rgb(221, 226, 232); font-family: Montserrat, system-ui, sans-serif; color: rgb(17, 24, 39); padding: 30px; display: grid; grid-template-columns: repeat(3, minmax(0px, 1fr)); gap: 22px; align-items: start;">

  <section class="m" role="dialog" aria-label="Убрать из чека">
    <div class="mh"><div class="mt"><b>Убрать из чека?</b><span>Сигареты [марка] · 2 шт · 560</span></div><button type="button" class="x" aria-label="Закрыть">✕</button></div>
    <div class="mb">
      <span class="lbl">ПРИЧИНА — ПОПАДЁТ В ОТЧЁТ</span>
      <button type="button" class="chip on" style="height: 44px; border-radius: 12px; text-align: left; padding: 0px 14px;">Покупатель передумал</button>
      <button type="button" class="chip" style="height: 44px; border-radius: 12px; text-align: left; padding: 0px 14px;">Ошибка сканирования</button>
      <button type="button" class="chip" style="height: 44px; border-radius: 12px; text-align: left; padding: 0px 14px;">Не хватило денег</button>

      <input class="in" type="text" placeholder="Другое — напишите" aria-label="Другая причина">
      <div class="sg"><button type="button" class="seg on" style="height: 36px;">Всю строку</button><button type="button" class="seg" style="height: 36px;">Только 1 шт</button></div>
    </div>
    <div class="mf"><button type="button" class="b2">Оставить</button><span class="tot"></span><button type="button" class="bd">Убрать</button></div>
  </section>

  <section class="m" role="dialog" aria-label="Подтверждение администратора">
    <div class="mh"><div class="mt"><b>Нужен PIN администратора</b><span>Удаление после пречека</span></div><button type="button" class="x" aria-label="Закрыть">✕</button></div>
    <div class="mb">
      <div class="row" style="background: rgb(254, 243, 226);"><span style="flex-grow: 1;">Чек уже распечатан как пречек — удаление увидит владелец</span></div>
      <div style="display: flex; justify-content: center; gap: 12px; padding: 8px 0px;"><span style="width: 14px; height: 14px; border-radius: 50%; background: rgb(11, 42, 60);"></span><span style="width: 14px; height: 14px; border-radius: 50%; background: rgb(11, 42, 60);"></span><span style="width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgb(208, 213, 221); box-sizing: border-box;"></span><span style="width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgb(208, 213, 221); box-sizing: border-box;"></span></div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0px, 1fr)); gap: 6px;"><button type="button" class="b2" style="height: 46px; font-size: 18px;">1</button><button type="button" class="b2" style="height: 46px; font-size: 18px;">2</button><button type="button" class="b2" style="height: 46px; font-size: 18px;">3</button><button type="button" class="b2" style="height: 46px; font-size: 18px;">4</button><button type="button" class="b2" style="height: 46px; font-size: 18px;">5</button><button type="button" class="b2" style="height: 46px; font-size: 18px;">6</button><button type="button" class="b2" style="height: 46px; font-size: 18px;">7</button><button type="button" class="b2" style="height: 46px; font-size: 18px;">8</button><button type="button" class="b2" style="height: 46px; font-size: 18px;">9</button><button type="button" class="b2" style="height: 46px; font-size: 18px;">⌫</button><button type="button" class="b2" style="height: 46px; font-size: 18px;">0</button><button type="button" class="b2" style="height: 46px; font-size: 18px;">OK</button></div>
      <button type="button" class="b2" style="display: flex; align-items: center; justify-content: center; gap: 6px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"></path></svg>Запросить с телефона админа</button>
    </div>
  </section>

  <section class="m" role="dialog" aria-label="Контроль удалений">
    <div class="mh"><div class="mt"><b>Контроль удалений</b><span>Настройки → Касса · для всех касс</span></div><button type="button" class="x" aria-label="Закрыть">✕</button></div>
    <div class="mb">
      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px;"><input type="checkbox" checked="" style="width: 18px; height: 18px; accent-color: rgb(11, 42, 60);">Спрашивать причину удаления</label>
      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px;"><input type="checkbox" checked="" style="width: 18px; height: 18px; accent-color: rgb(11, 42, 60);">PIN админа после пречека</label>
      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px;"><input type="checkbox" checked="" style="width: 18px; height: 18px; accent-color: rgb(11, 42, 60);">PIN админа, если удаляют больше чем на</label>
      <input class="in" type="text" aria-label="Сумма для PIN" value="1 000" style="margin-left: 26px; width: calc(100% - 26px);">
      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px;"><input type="checkbox" checked="" style="width: 18px; height: 18px; accent-color: rgb(11, 42, 60);">PIN на «Очистить чек» и отмену чека</label>
      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px;"><input type="checkbox" checked="" style="width: 18px; height: 18px; accent-color: rgb(11, 42, 60);">Сообщать мне в Telegram, если за смену больше</label>
      <input class="in" type="text" aria-label="Порог удалений" value="10 удалений" style="margin-left: 26px; width: calc(100% - 26px);">
      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px;"><input type="checkbox" checked="" style="width: 18px; height: 18px; accent-color: rgb(11, 42, 60);">Удалённое — строкой в отчёте смены</label>
    </div>
    <div class="mf"><button type="button" class="b2">Отмена</button><span class="tot"></span><button type="button" class="b1">Сохранить</button></div>
  </section></div></div></div>
