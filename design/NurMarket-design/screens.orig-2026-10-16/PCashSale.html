<!doctype html>
<html lang="ru"><head><style>
    .sc-placeholder{background:color-mix(in srgb,currentColor 8%,transparent);
      border:1px solid color-mix(in srgb,currentColor 50%,transparent);
      border-radius:2px;box-sizing:border-box;overflow:hidden}
    @keyframes sc-shine{0%{background-position:100% 50%}100%{background-position:0% 50%}}
    html.sc-dc-streaming .sc-placeholder,
    html.sc-dc-streaming .sc-interp.sc-missing{position:relative;
      background:color-mix(in srgb,currentColor 5%,transparent);
      border-color:transparent}
    html.sc-dc-streaming .sc-placeholder::before,
    html.sc-dc-streaming .sc-interp.sc-missing::before{content:'';
      position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(90deg,rgba(217,119,87,0) 25%,rgba(247,225,211,.95) 37%,rgba(217,119,87,0) 63%);
      background-size:400% 100%;animation:sc-shine 1.4s ease infinite}
    html.sc-dc-streaming .sc-placeholder:nth-child(n+9 of .sc-placeholder)::before,
    html.sc-dc-streaming .sc-interp.sc-missing:nth-child(n+9 of .sc-interp.sc-missing)::before{animation:none;
      background:color-mix(in srgb,currentColor 8%,transparent)}
    .sc-placeholder-error{padding:4px 8px;font:11px/1.4 ui-monospace,monospace;
      color:color-mix(in srgb,currentColor 70%,transparent);word-break:break-word}
    .sc-interp.sc-missing{display:inline-block;width:2em;height:1em;overflow:hidden;
      vertical-align:text-bottom;background:rgba(255,255,255,.3);border:1px solid rgba(0,0,0,.5);
      border-radius:2px;box-sizing:border-box;color:transparent;
      user-select:none}
    .sc-interp.sc-unresolved{font-family:ui-monospace,monospace;font-size:.85em;
      color:color-mix(in srgb,currentColor 50%,transparent);
      background:color-mix(in srgb,currentColor 10%,transparent);border-radius:3px;
      padding:0 3px}
    .sc-host.sc-has-error{position:relative}
    .sc-logic-error{position:absolute;top:8px;left:8px;z-index:2147483647;max-width:60ch;
      padding:6px 10px;background:#b00020;color:#fff;font:12px/1.4 ui-monospace,monospace;
      border-radius:4px;white-space:pre-wrap;pointer-events:none}
    /* Mirrors PRINT_BASELINE_CSS in apps/web deck-stage-export.ts — keep both
       in sync until dc-runtime regains a build step. */
    @media print {
      @page { margin: 0.5cm; }
      figure, table { break-inside: avoid; }
      #dc-root, #dc-root > .sc-host { height: auto; }
      *, *::before, *::after {
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
        backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
        animation-delay: -99s !important; animation-duration: .001s !important;
        animation-iteration-count: 1 !important; animation-fill-mode: both !important;
        animation-play-state: running !important; transition-duration: 0s !important;
      }
    }
  </style>
<meta charset="utf-8">
<title>Кассир — продажа</title>
<style>x-dc{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#FFFFFF;border-top:1px solid #EAECF0;padding:8px 6px 14px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#667085;text-decoration:none;padding:6px 0}
.nav a.on{color:#0B2A3C;font-weight:800}
.nav a.on span{background:#FFD600}
.nav span{width:44px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:13px;font-weight:600;color:#344054;white-space:nowrap}
.chip.on{border:0;background:#0B2A3C;color:#FFFFFF}
.line{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:#FFFFFF}
.ph{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#0B2A3C;flex-shrink:0}
.st{width:32px;height:32px;border-radius:16px;font-family:inherit;font-size:18px;display:flex;align-items:center;justify-content:center}
.prod{border:0;border-radius:16px;background:#FFFFFF;padding:8px;display:flex;flex-direction:column;gap:6px;font-family:inherit;text-align:left}
</style></head>
<body>
<div id="dc-root"><div class="sc-host" data-sc-name="PCashSale"><div style="width: 390px; height: 844px; box-sizing: border-box; background: rgb(244, 245, 247); font-family: Montserrat, system-ui, sans-serif; color: rgb(17, 24, 39); display: flex; flex-direction: column;">
  <header style="padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 10px; background: rgb(255, 255, 255); border-bottom: 1px solid rgb(234, 236, 240);">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <b style="font-size: 18px; font-weight: 800;">Новый чек</b>
      <span style="display: flex; gap: 6px;"><span style="padding: 6px 10px; border-radius: 10px; background: rgb(242, 244, 247); font-size: 12px; font-weight: 700; color: rgb(52, 64, 84);">Отложено · 1</span></span>
    </div>
    <div style="display: flex; gap: 8px;">
      <label style="flex-grow: 1; height: 46px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0px 12px; border-radius: 12px; border: 1px solid rgb(229, 231, 235); background: rgb(249, 250, 251);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input type="text" placeholder="Товар или штрихкод" aria-label="Поиск товара" style="border: 0px; outline: 0px; background: transparent; font-family: inherit; font-size: 14px; width: 100%;">
      </label>
      <button type="button" aria-label="Сканировать камерой" style="width: 46px; height: 46px; border-radius: 12px; border: 0px; background: rgb(11, 42, 60); color: rgb(255, 214, 0); display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path><path d="M8 9v6M12 9v6M16 9v6"></path></svg></button>
    </div>
    <div style="display: flex; gap: 6px; overflow: hidden;"><button type="button" class="chip on">Избранное</button><button type="button" class="chip">Весовые</button><button type="button" class="chip">Напитки</button><button type="button" class="chip">Сладости</button></div>
  </header>

  <main style="flex-grow: 1; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden;">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0px, 1fr)); gap: 8px;">
      <button type="button" class="prod"><span style="height: 56px; border-radius: 10px; background: rgb(255, 244, 194); display: flex; align-items: center; justify-content: center; font-weight: 800; color: rgb(11, 42, 60);">Мк</span><span style="font-size: 11px; font-weight: 600; line-height: 14px; height: 28px; overflow: hidden;">Макароны «Макфа» 450г</span><b style="font-size: 13px; color: rgb(11, 42, 60);">85 сом</b></button>
      <button type="button" class="prod"><span style="height: 56px; border-radius: 10px; background: rgb(253, 232, 232); display: flex; align-items: center; justify-content: center; font-weight: 800; color: rgb(11, 42, 60);">Кк</span><span style="font-size: 11px; font-weight: 600; line-height: 14px; height: 28px; overflow: hidden;">Кока-Кола (ПЭТ) 2л</span><b style="font-size: 13px; color: rgb(11, 42, 60);">170 сом</b></button>
      <button type="button" class="prod"><span style="height: 56px; border-radius: 10px; background: rgb(241, 232, 253); display: flex; align-items: center; justify-content: center; font-weight: 800; color: rgb(11, 42, 60);">Ms</span><span style="font-size: 11px; font-weight: 600; line-height: 14px; height: 28px; overflow: hidden;">Mars</span><b style="font-size: 13px; color: rgb(11, 42, 60);">39 сом</b></button>
    </div>

    <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; padding-top: 4px;"><span>В чеке</span><span style="color: rgb(102, 112, 133); font-weight: 500;">2 позиции</span></div>
    <div class="line">
      <span class="ph" style="background: rgb(255, 244, 194);">Мк</span>
      <span style="flex-grow: 1; min-width: 0px; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Макароны «Макфа» спагетти 450г</span><span style="font-size: 12px; color: rgb(102, 112, 133);">85 × 2</span><b style="font-size: 14px; color: rgb(11, 42, 60);">170 сом</b></span>
      <span style="display: flex; align-items: center; gap: 6px;"><button type="button" class="st" aria-label="Меньше" style="border: 1px solid rgb(208, 213, 221); background: rgb(255, 255, 255);">−</button><b style="min-width: 16px; text-align: center;">2</b><button type="button" class="st" aria-label="Больше" style="border: 0px; background: rgb(11, 42, 60); color: rgb(255, 255, 255);">+</button></span>
    </div>
    <div class="line">
      <span class="ph" style="background: rgb(241, 232, 253);">Ms</span>
      <span style="flex-grow: 1; min-width: 0px; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 13px; font-weight: 600;">Mars</span><span style="font-size: 12px; color: rgb(102, 112, 133);">39 × 1</span><b style="font-size: 14px; color: rgb(11, 42, 60);">39 сом</b></span>
      <span style="display: flex; align-items: center; gap: 6px;"><button type="button" class="st" aria-label="Меньше" style="border: 1px solid rgb(208, 213, 221); background: rgb(255, 255, 255);">−</button><b style="min-width: 16px; text-align: center;">1</b><button type="button" class="st" aria-label="Больше" style="border: 0px; background: rgb(11, 42, 60); color: rgb(255, 255, 255);">+</button></span>
    </div>
    <span style="font-size: 12px; color: rgb(152, 162, 179); text-align: center;">Смахните строку влево, чтобы убрать</span>
  </main>

  <div style="padding: 0px 16px 12px; display: flex; gap: 8px;">
    <button type="button" aria-label="Отложить чек" style="width: 56px; height: 56px; border-radius: 16px; border: 1px solid rgb(229, 231, 235); background: rgb(255, 255, 255); color: rgb(52, 64, 84); display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></button>
    <button type="button" style="flex-grow: 1; height: 56px; border-radius: 16px; border: 0px; background: rgb(255, 214, 0); color: rgb(11, 42, 60); font-family: inherit; font-size: 17px; font-weight: 800; box-shadow: rgba(255, 214, 0, 0.35) 0px 8px 20px;">Оплатить 209 сом</button>
  </div>

  <nav class="nav" aria-label="Разделы кассира">
    <a href="#" class="on"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 4h2l2.5 11h11L21 7H6.5"></path><circle cx="9" cy="19.5" r="1.5"></circle><circle cx="17" cy="19.5" r="1.5"></circle></svg></span>Продажа</a>
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path><path d="M8 9v6M12 9v6M16 9v6"></path></svg></span>Сканер</a>
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg></span>Чеки</a>
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg></span>Склад</a>
  </nav></div></div></div>



</body></html>
