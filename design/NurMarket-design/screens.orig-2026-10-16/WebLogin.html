<!doctype html>
<html lang="ru"><head><style>
    .sc-placeholder{background:color-mix(in srgb,currentColor 8%,transparent);
      border:1px solid color-mix(in srgb,currentColor 50%,transparent);
      border-radius:2px;box-sizing:border-box;overflow:hidden}
    @keyframes sc-shine{0%{background-position:100% 50%}100%{background-position:0% 50%}}
    html.sc-dc-streaming .sc-placeholder,
    html.sc-dc-streaming .sc-interp.sc-missing{position:relative;
      background:color-mix(in srgb,currentColor 5%,transparent);
      border-color:transparent}
    html.sc-dc-streaming .sc-placeholder::before,
    html.sc-dc-streaming .sc-interp.sc-missing::before{content:'';
      position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(90deg,rgba(217,119,87,0) 25%,rgba(247,225,211,.95) 37%,rgba(217,119,87,0) 63%);
      background-size:400% 100%;animation:sc-shine 1.4s ease infinite}
    html.sc-dc-streaming .sc-placeholder:nth-child(n+9 of .sc-placeholder)::before,
    html.sc-dc-streaming .sc-interp.sc-missing:nth-child(n+9 of .sc-interp.sc-missing)::before{animation:none;
      background:color-mix(in srgb,currentColor 8%,transparent)}
    .sc-placeholder-error{padding:4px 8px;font:11px/1.4 ui-monospace,monospace;
      color:color-mix(in srgb,currentColor 70%,transparent);word-break:break-word}
    .sc-interp.sc-missing{display:inline-block;width:2em;height:1em;overflow:hidden;
      vertical-align:text-bottom;background:rgba(255,255,255,.3);border:1px solid rgba(0,0,0,.5);
      border-radius:2px;box-sizing:border-box;color:transparent;
      user-select:none}
    .sc-interp.sc-unresolved{font-family:ui-monospace,monospace;font-size:.85em;
      color:color-mix(in srgb,currentColor 50%,transparent);
      background:color-mix(in srgb,currentColor 10%,transparent);border-radius:3px;
      padding:0 3px}
    .sc-host.sc-has-error{position:relative}
    .sc-logic-error{position:absolute;top:8px;left:8px;z-index:2147483647;max-width:60ch;
      padding:6px 10px;background:#b00020;color:#fff;font:12px/1.4 ui-monospace,monospace;
      border-radius:4px;white-space:pre-wrap;pointer-events:none}
    /* Mirrors PRINT_BASELINE_CSS in apps/web deck-stage-export.ts — keep both
       in sync until dc-runtime regains a build step. */
    @media print {
      @page { margin: 0.5cm; }
      figure, table { break-inside: avoid; }
      #dc-root, #dc-root > .sc-host { height: auto; }
      *, *::before, *::after {
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
        backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
        animation-delay: -99s !important; animation-duration: .001s !important;
        animation-iteration-count: 1 !important; animation-fill-mode: both !important;
        animation-play-state: running !important; transition-duration: 0s !important;
      }
    }
  </style>
<meta charset="utf-8">
<title>Вход в веб NurMarket</title>
<style>x-dc{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.lbl{font-size:12px;font-weight:700;color:#667085}
.in{height:50px;box-sizing:border-box;border-radius:12px;border:1px solid #D0D5DD;padding:0 14px;font-family:inherit;font-size:15px;width:100%;background:#FFFFFF}
.chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:12px;font-weight:600;color:#344054}
.chip.on{border:0;background:#0B2A3C;color:#FFFFFF;font-weight:700}
.pt{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:#D0D5DD;line-height:20px}
.pt b{color:#FFFFFF}
.dot{width:28px;height:28px;border-radius:8px;background:rgba(255,214,0,.16);color:#FFD600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
</style></head>
<body>
<div id="dc-root"><div class="sc-host" data-sc-name="WebLogin"><div style="min-height: 900px; box-sizing: border-box; background: rgb(244, 245, 247); font-family: Montserrat, system-ui, sans-serif; color: rgb(17, 24, 39); display: flex; flex-wrap: wrap;">
  <section style="flex: 1 1 420px; background: rgb(11, 42, 60); color: rgb(255, 255, 255); padding: 48px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px;">
    <div style="display: flex; align-items: center; gap: 12px;"><span style="width: 48px; height: 48px; border-radius: 14px; background: rgb(255, 214, 0); color: rgb(11, 42, 60); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px;">N</span><b style="font-size: 22px;">NurMarket</b></div>
    <h1 style="margin: 0px; font-size: 40px; line-height: 48px; font-weight: 800; max-width: 520px;">Магазин в браузере — с любого компьютера</h1>
    <div style="display: flex; flex-direction: column; gap: 16px; max-width: 480px;">
      <div class="pt"><span class="dot"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span><span><b>Веб-касса</b> — продавать без установки, сканер работает как клавиатура</span></div>
      <div class="pt"><span class="dot"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span><span><b>Админка</b> — товары, отчёты, сотрудники, сайт</span></div>
      <div class="pt"><span class="dot"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span><span><b>Те же данные</b>, что на кассе и в телефоне — один аккаунт NurCRM</span></div>
    </div>
  </section>

  <section style="flex: 1 1 420px; padding: 48px 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: center;">
    <form style="width: 100%; max-width: 420px; background: rgb(255, 255, 255); border-radius: 24px; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; box-shadow: rgba(11, 42, 60, 0.12) 0px 24px 60px;">
      <b style="font-size: 24px; font-weight: 800;">Вход</b>
      <span style="font-size: 14px; color: rgb(102, 112, 133); margin-top: -8px;">Тот же логин, что в кассе</span>
      <label class="lbl" for="lg">Логин или телефон</label>
      <input id="lg" class="in" type="text" placeholder="[логин]">
      <label class="lbl" for="pw">Пароль</label>
      <input id="pw" class="in" type="password" value="password">
      <div style="display: flex; justify-content: space-between; align-items: center;"><label style="display: flex; align-items: center; gap: 8px; font-size: 13px;"><input type="checkbox" checked="" style="width: 18px; height: 18px; accent-color: rgb(11, 42, 60);">Запомнить</label><a href="#" style="font-size: 13px; font-weight: 700;">Забыли пароль?</a></div>
      <button type="button" style="height: 52px; border-radius: 14px; border: 0px; background: rgb(255, 214, 0); color: rgb(11, 42, 60); font-family: inherit; font-size: 16px; font-weight: 800;">Войти</button>
      <button type="button" style="height: 48px; border-radius: 14px; border: 1.5px solid rgb(208, 213, 221); background: rgb(255, 255, 255); color: rgb(52, 64, 84); font-family: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><path d="M14 14h3v3h-3z"></path></svg>Войти по QR с телефона</button>
      <div style="display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; padding-top: 4px;"><button type="button" class="chip on">Рус</button><button type="button" class="chip">Кыр</button><button type="button" class="chip">Eng</button><button type="button" class="chip">Tür</button><button type="button" class="chip">O'zb</button></div>
    </form>
  </section></div></div></div>



</body></html>
