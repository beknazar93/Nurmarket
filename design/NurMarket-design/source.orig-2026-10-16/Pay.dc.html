<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Оплата — панель справа</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; font-family: Montserrat, system-ui, sans-serif; color: #111827">
  <dc-import name="Main" hint-size="1440px,900px"></dc-import>
  <div style="position: absolute; inset: 0; background: rgba(11,42,60,0.45)"></div>

  <!-- Панель оплаты -->
  <section aria-label="Оплата чека" style="position: absolute; top: 0; right: 0; width: 520px; height: 900px; box-sizing: border-box; background: #FFFFFF; box-shadow: -12px 0 40px rgba(11,42,60,0.25); display: flex; flex-direction: column">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 22px 24px 16px; border-bottom: 1px solid #EAECF0">
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 20px; font-weight: 800">Оплата чека</span><span style="font-size: 13px; color: #667085">Чек №1740 · 3 позиции</span></div>
      <button type="button" aria-label="Закрыть" style="width: 40px; height: 40px; border-radius: 12px; border: 1px solid #E5E7EB; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#344054" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </header>

    <div style="flex-grow: 1; overflow: hidden; padding: 20px 24px; display: flex; flex-direction: column; gap: 18px">
      <div style="border-radius: 16px; background: #0B2A3C; color: #FFFFFF; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center">
        <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #C7D2DB">К оплате</span><span style="font-size: 34px; font-weight: 800; color: #FFD600">290 сом</span></span>
        <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 13px; color: #C7D2DB"><span>Сдача</span><span style="font-size: 22px; font-weight: 800; color: #FFFFFF">210 сом</span></span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 12px; font-weight: 700; color: #667085; letter-spacing: 0.04em">СПОСОБ ОПЛАТЫ</span>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
          <button type="button" style="height: 76px; border-radius: 14px; border: 2px solid #0B2A3C; background: #FFF7CC; color: #0B2A3C; font-family: inherit; font-size: 13px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2.5"></circle></svg>Наличные</button>
          <button type="button" style="height: 76px; border-radius: 14px; border: 1px solid #E5E7EB; background: #FFFFFF; color: #344054; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path></svg>Карта / перевод</button>
          <button type="button" style="height: 76px; border-radius: 14px; border: 1px solid #E5E7EB; background: #FFFFFF; color: #344054; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><path d="M14 14h3v3M21 14v7h-7"></path></svg>QR-код</button>
          <button type="button" style="height: 76px; border-radius: 14px; border: 1px solid #E5E7EB; background: #FFFFFF; color: #344054; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>В долг</button>
          <button type="button" style="height: 76px; border-radius: 14px; border: 1px solid #E5E7EB; background: #FFFFFF; color: #344054; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 7h11l-3-3M17 17H6l3 3"></path></svg>Смешанная</button>
          <button type="button" style="height: 76px; border-radius: 14px; border: 1px solid #E5E7EB; background: #FFFFFF; color: #344054; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 2 15 8l6 1-4.5 4.5L17.5 20 12 17l-5.5 3 1-6.5L3 9l6-1z"></path></svg>Бонусы</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="cashGot" style="font-size: 12px; font-weight: 700; color: #667085; letter-spacing: 0.04em">ПОЛУЧЕНО НАЛИЧНЫМИ</label>
        <input id="cashGot" type="text" value="500" style="height: 56px; box-sizing: border-box; border-radius: 12px; border: 2px solid #0B2A3C; padding: 0 16px; font-family: inherit; font-size: 24px; font-weight: 800; color: #0B2A3C">
        <div style="display: flex; gap: 8px">
          <button type="button" style="flex-grow: 1; height: 40px; border-radius: 10px; border: 1px solid #E5E7EB; background: #F9FAFB; font-family: inherit; font-size: 14px; font-weight: 700; color: #0B2A3C">Без сдачи</button>
          <button type="button" style="flex-grow: 1; height: 40px; border-radius: 10px; border: 1px solid #E5E7EB; background: #F9FAFB; font-family: inherit; font-size: 14px; font-weight: 700; color: #0B2A3C">300</button>
          <button type="button" style="flex-grow: 1; height: 40px; border-radius: 10px; border: 1px solid #0B2A3C; background: #FFF7CC; font-family: inherit; font-size: 14px; font-weight: 700; color: #0B2A3C">500</button>
          <button type="button" style="flex-grow: 1; height: 40px; border-radius: 10px; border: 1px solid #E5E7EB; background: #F9FAFB; font-family: inherit; font-size: 14px; font-weight: 700; color: #0B2A3C">1000</button>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
          <button type="button" style="height: 52px; border-radius: 12px; border: 0; background: #F2F4F7; font-family: inherit; font-size: 20px; font-weight: 700; color: #0B2A3C">{{k}}</button>
        </sc-for>
      </div>

      <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; color: #344054"><input type="checkbox" checked="" style="width: 18px; height: 18px; accent-color: #0B2A3C">Напечатать чек</label>
    </div>

    <footer style="display: flex; gap: 12px; padding: 16px 24px 22px; border-top: 1px solid #EAECF0; background: #FFFFFF">
      <button type="button" style="width: 140px; height: 56px; border-radius: 14px; border: 1.5px solid #D0D5DD; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; color: #344054">Отмена</button>
      <button type="button" style="flex-grow: 1; height: 56px; border-radius: 14px; border: 0; background: #FFD600; font-family: inherit; font-size: 17px; font-weight: 800; color: #0B2A3C; display: flex; align-items: center; justify-content: center; gap: 10px">Оплатить 290 сом<span style="font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: rgba(11,42,60,0.12)">Enter</span></button>
    </footer>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { keys: ['1', '2', '3', '4', '5', '6', '7', '8', '9', '00', '0', '⌫'] };
  }
}
</script>
</body>
</html>
