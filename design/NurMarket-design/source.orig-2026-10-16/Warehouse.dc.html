<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Склад</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827">
  <dc-import name="OwnerNav" group="goods" active="Склад" hint-size="308px,900px"></dc-import>
  <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="font-size: 24px; font-weight: 800; flex-grow: 1">Склад</span>
      <button type="button" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1.5px solid #D0D5DD; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #344054">Массовая загрузка</button>
      <button type="button" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: #FFD600; font-family: inherit; font-size: 14px; font-weight: 800; color: #0B2A3C">+ Новый товар</button>
    </div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <sc-for list="{{zones}}" as="z" hint-placeholder-count="6">
        <sc-if value="{{z.active}}" hint-placeholder-val="{{false}}"><button type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: #0B2A3C; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700">{{z.name}} · {{z.n}}</button></sc-if>
        <sc-if value="{{z.idle}}" hint-placeholder-val="{{true}}"><button type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #344054; font-family: inherit; font-size: 13px; font-weight: 600">{{z.name}} · {{z.n}}</button></sc-if>
      </sc-for>
      <button type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px dashed #98A2B3; background: transparent; color: #475467; font-family: inherit; font-size: 13px; font-weight: 600">Склады…</button>
    </div>
    <div role="tablist" style="display: flex; gap: 24px; border-bottom: 1px solid #E5E7EB">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="7">
        <sc-if value="{{t.active}}" hint-placeholder-val="{{false}}"><button type="button" role="tab" aria-selected="true" style="border: 0; background: transparent; padding: 10px 0; border-bottom: 3px solid #FFD600; font-family: inherit; font-size: 14px; font-weight: 800; color: #0B2A3C">{{t.name}}</button></sc-if>
        <sc-if value="{{t.idle}}" hint-placeholder-val="{{true}}"><button type="button" role="tab" aria-selected="false" style="border: 0; background: transparent; padding: 10px 0; font-family: inherit; font-size: 14px; font-weight: 600; color: #667085">{{t.name}}</button></sc-if>
      </sc-for>
    </div>
    <div style="display: flex; gap: 10px; flex-wrap: wrap">
      <sc-for list="{{kpis}}" as="k" hint-placeholder-count="6">
        <button type="button" style="display: flex; align-items: baseline; gap: 8px; height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid #E5E7EB; background: #FFFFFF; font-family: inherit"><span style="font-size: 12px; color: #667085; font-weight: 600">{{k.label}}</span><span style="font-size: 15px; font-weight: 800; color: {{k.color}}">{{k.value}}</span></button>
      </sc-for>
    </div>
    <div style="display: flex; gap: 10px; align-items: center">
      <label style="flex-grow: 1; display: flex; align-items: center; gap: 10px; height: 44px; box-sizing: border-box; padding: 0 14px; background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 12px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
        <input type="text" placeholder="Название, код или штрихкод (можно сканером)" style="border: 0; outline: 0; flex-grow: 1; font-family: inherit; font-size: 14px; background: transparent"></label>
      <button type="button" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #E5E7EB; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; color: #344054">Все единицы ▾</button>
      <button type="button" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #E5E7EB; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; color: #344054">Наличие: все ▾</button>
    </div>
    <div style="flex-grow: 1; min-height: 0; display: flex; gap: 14px">
      <section style="flex-grow: 1; min-width: 0; background: #FFFFFF; border-radius: 16px; box-shadow: 0 1px 2px rgba(16,24,40,0.05); overflow: hidden; display: flex; flex-direction: column">
        <div style="display: grid; grid-template-columns: 3fr 1.2fr 1fr 1fr 1fr 0.9fr; gap: 12px; padding: 12px 16px; background: #F9FAFB; font-size: 12px; font-weight: 700; color: #667085"><span>Товар</span><span>Код</span><span>Цена</span><span>Закупка</span><span>Остаток</span><span></span></div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
          <div style="display: grid; grid-template-columns: 3fr 1.2fr 1fr 1fr 1fr 0.9fr; gap: 12px; align-items: center; padding: 10px 16px; border-top: 1px solid #F2F4F7; background: {{r.bg}}">
            <span style="display: flex; align-items: center; gap: 10px; min-width: 0"><span style="width: 36px; height: 36px; border-radius: 8px; background: {{r.tint}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: #0B2A3C; flex-shrink: 0">{{r.mono}}</span><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span><span style="font-size: 11px; color: #667085">{{r.cat}}</span></span></span>
            <span style="font-size: 12px; color: #475467">{{r.code}}</span>
            <span style="font-size: 13px; font-weight: 700">{{r.price}}</span>
            <span style="font-size: 13px; color: #475467">{{r.cost}}</span>
            <span><span style="padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: {{r.stockBg}}; color: {{r.stockFg}}">{{r.stock}}</span></span>
            <span style="display: flex; gap: 6px; justify-content: flex-end"><button type="button" style="height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid #E5E7EB; background: #FFFFFF; font-family: inherit; font-size: 12px; font-weight: 700; color: #0B2A3C">Изменить</button><button type="button" aria-label="Ещё" style="width: 32px; height: 32px; border-radius: 8px; border: 1px solid #E5E7EB; background: #FFFFFF; font-size: 14px">⋯</button></span>
          </div>
        </sc-for>
        <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-top: 1px solid #F2F4F7; font-size: 12px; color: #667085"><span>Показано 1–9 из 307</span><span style="display: flex; gap: 6px"><button type="button" style="height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid #E5E7EB; background: #FFFFFF; font-family: inherit; font-size: 12px">‹ Назад</button><button type="button" style="height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid #E5E7EB; background: #FFFFFF; font-family: inherit; font-size: 12px">Вперёд ›</button></span></div>
      </section>
      <aside aria-label="Выбранный товар" style="width: 300px; flex-shrink: 0; background: #FFFFFF; border-radius: 16px; box-shadow: 0 1px 2px rgba(16,24,40,0.05); padding: 16px; display: flex; flex-direction: column; gap: 12px">
        <span style="height: 120px; border-radius: 12px; background: #FFF4C2; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: #0B2A3C">ММ</span>
        <span style="font-size: 15px; font-weight: 800">Макароны «Макфа» спагетти 450г</span>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center">
          <span style="border-radius: 10px; background: #F9FAFB; padding: 8px 4px; display: flex; flex-direction: column"><span style="font-size: 11px; color: #667085">Остаток</span><span style="font-size: 15px; font-weight: 800">50 шт</span></span>
          <span style="border-radius: 10px; background: #F9FAFB; padding: 8px 4px; display: flex; flex-direction: column"><span style="font-size: 11px; color: #667085">В день</span><span style="font-size: 15px; font-weight: 800">[N]</span></span>
          <span style="border-radius: 10px; background: #F9FAFB; padding: 8px 4px; display: flex; flex-direction: column"><span style="font-size: 11px; color: #667085">Хватит</span><span style="font-size: 15px; font-weight: 800">[N] дн.</span></span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #475467">
          <span style="font-size: 12px; font-weight: 700; color: #667085">ИСТОРИЯ</span>
          <span style="display: flex; justify-content: space-between"><span>[дата] · Приёмка</span><span style="color: #0E7A3A; font-weight: 700">+[кол-во]</span></span>
          <span style="display: flex; justify-content: space-between"><span>[дата] · Продажи</span><span style="color: #B42318; font-weight: 700">−[кол-во]</span></span>
          <span style="display: flex; justify-content: space-between"><span>[дата] · Списание</span><span style="color: #B42318; font-weight: 700">−[кол-во]</span></span>
        </div>
        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
          <button type="button" style="height: 44px; border-radius: 12px; border: 0; background: #FFD600; font-family: inherit; font-size: 14px; font-weight: 800; color: #0B2A3C">± Изменить остаток</button>
          <button type="button" style="height: 44px; border-radius: 12px; border: 0; background: #0B2A3C; font-family: inherit; font-size: 14px; font-weight: 700; color: #FFFFFF">В приёмку</button>
        </div>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const zones = [['Все склады', 307], ['Продукты', 22], ['Одежда и обувь', 0], ['Услуги', 1], ['Аренда и прокат', 4], ['Без склада', 280]]
      .map(([name, n], i) => ({ name, n, active: i === 0, idle: i !== 0 }));
    const tabs = ['Товары', 'Обзор', 'Приёмка', 'Ревизия', 'Списание', 'Перемещение', 'Журнал']
      .map((name, i) => ({ name, active: i === 0, idle: i !== 0 }));
    const kpis = [
      { label: 'Товаров', value: '307', color: '#0B2A3C' },
      { label: 'По закупке', value: '20,96 млн', color: '#0B2A3C' },
      { label: 'По продаже', value: '32,19 млн', color: '#0B2A3C' },
      { label: 'Заканчивается', value: '143', color: '#B54708' },
      { label: 'Нет в наличии', value: '6', color: '#B42318' },
      { label: 'Срок годности', value: '3', color: '#B42318' }
    ];
    const tints = ['#FFF4C2', '#FDE8E8', '#E3F2FD', '#E7F6EC', '#F1E8FD', '#FFEBD6'];
    const data = [
      ['Макароны «Макфа» спагетти 450г', 'Бакалея', '0166', '85 сом', '68 сом', 50],
      ['Aos Extra pover 450гр бальзам', 'Парфюм · Aos', '0109', '50 сом', '35 сом', 0],
      ['Патроны для степлера', 'Канцтовары', '0099', '35 сом', '28 сом', 1162],
      ['Кока-Кола (ПЭТ) 2л', 'Напитки', '0350', '170 сом', '—', 1],
      ['моюн эти', 'Молочное', '0313', '800 сом', '650 сом', 96],
      ['MR PROPER Универсал Лимон 400г', 'Химия', '0345', '191 сом', '158,71 сом', 11],
      ['MR PROPER Д/ПоловСтен Океан 500мл', 'Химия', '0344', '157 сом', '130,53 сом', 5],
      ['Вафли «Лесной орех» 220г', 'Сладости', '0162', '114 сом', '95 сом', 7],
      ['Sprite Мохито', 'Напитки', '0078', '80 сом', '40 сом', 49985]
    ];
    const rows = data.map(([name, cat, code, price, cost, q], i) => ({
      name, cat, code, price, cost, tint: tints[i % tints.length],
      mono: name.replace(/[«»"]/g, '').split(' ').slice(0, 2).map((w) => w[0]).join('').toUpperCase(),
      stock: q.toLocaleString('ru-RU') + ' шт',
      stockBg: q <= 0 ? '#FDE8E8' : q < 10 ? '#FEF3E2' : '#E7F6EC',
      stockFg: q <= 0 ? '#B42318' : q < 10 ? '#B54708' : '#0E7A3A',
      bg: i === 0 ? '#FFFBEA' : '#FFFFFF'
    }));
    return { zones, tabs, kpis, rows };
  }
}
</script>
</body>
</html>
