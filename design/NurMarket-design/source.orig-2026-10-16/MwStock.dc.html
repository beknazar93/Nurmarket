<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Веб в телефоне — товары и склад</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.hb{width:44px;height:44px;border-radius:12px;border:0;background:#F2F4F7;color:#0B2A3C;display:flex;align-items:center;justify-content:center}
.chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:12px;font-weight:600;color:#344054;white-space:nowrap}
.chip.on{border:0;background:#0B2A3C;color:#FFFFFF}
.it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column">
  <header style="height: 60px; flex-shrink: 0; background: #FFFFFF; border-bottom: 1px solid #EAECF0; display: flex; align-items: center; gap: 10px; padding: 0 12px">
    <button type="button" class="hb" aria-label="Открыть меню"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
    <b style="font-size: 16px; flex-grow: 1">Товары и склад</b>
    <button type="button" class="hb" aria-label="Новый товар" style="background: #FFD600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
  </header>
  <div style="padding: 10px 16px 6px; display: flex; flex-direction: column; gap: 8px">
    <label style="height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 12px; border: 1px solid #E5E7EB; background: #FFFFFF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input type="text" placeholder="Название или штрихкод" aria-label="Поиск товара" style="border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 14px; width: 100%"></label>
    <div style="display: flex; gap: 6px; overflow: hidden"><button type="button" class="chip on">Все склады</button><button type="button" class="chip">Продукты</button><button type="button" class="chip">Одежда</button><button type="button" class="chip">Мало</button></div>
  </div>
  <div style="margin: 4px 16px 6px; padding: 10px 12px; border-radius: 12px; background: #FFF7CC; display: flex; align-items: center; gap: 10px; font-size: 13px; color: #0B2A3C"><b style="flex-grow: 1">Выбрано 2</b><a href="#" style="font-weight: 700">Цена</a><a href="#" style="font-weight: 700">Ценники</a><a href="#" style="font-weight: 700">Ещё</a></div>
  <main style="flex-grow: 1; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div class="it" style="box-shadow: {{r.ring}}">
        <span style="width: 44px; height: 44px; border-radius: 12px; background: {{r.tint}}; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #0B2A3C; flex-shrink: 0">{{r.mono}}</span>
        <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span><span style="font-size: 12px; color: #667085">{{r.zone}} · закупка [цена]</span></span>
        <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px"><b style="font-size: 14px; color: #0B2A3C">{{r.price}}</b><span style="font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: {{r.sbg}}; color: {{r.sfg}}">{{r.stock}}</span></span>
      </div>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = { sbg: '#E7F6EC', sfg: '#0E7A3A' };
    const low = { sbg: '#FEF3E2', sfg: '#B54708' };
    const r = (name, mono, tint, zone, price, stock, s, sel) => Object.assign({ name, mono, tint, zone, price, stock, ring: sel ? 'inset 0 0 0 2px #0B2A3C' : 'none' }, s);
    return {
      rows: [
        r('Макароны «Макфа» спагетти 450г', 'Мк', '#FFF4C2', 'Продукты', '85 сом', '49 шт', ok, true),
        r('Кока-Кола (ПЭТ) 2л', 'Кк', '#FDE8E8', 'Продукты', '170 сом', '[N] шт', low, true),
        r('Mars', 'Ms', '#F1E8FD', 'Продукты', '39 сом', '[N] шт', ok),
        r('Сок Gracio яблочный 1л', 'Сг', '#FFEBD6', 'Продукты', '[цена]', '2 шт', low),
        r('Патроны для Степлера', 'Пс', '#E3F2FD', 'Продукты', '35 сом', '1160 шт', ok),
        r('Aos Extra pover 450гр бальзам', 'Ao', '#E7F6EC', 'Продукты', '50 сом', '65 шт', ok)
      ]
    };
  }
}
</script>
</body>
</html>
