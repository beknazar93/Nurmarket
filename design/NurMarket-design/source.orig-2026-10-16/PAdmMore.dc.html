<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Администратор — всё управление</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#FFFFFF;border-top:1px solid #EAECF0;padding:8px 4px 14px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:#667085;text-decoration:none;padding:6px 0}
.nav a.on{color:#0B2A3C;font-weight:800}
.nav a.on span{background:#FFD600}
.nav span{width:44px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.g{font-size:11px;font-weight:800;color:#667085;letter-spacing:.04em;padding:4px 4px 0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.it{border:0;border-radius:14px;background:#FFFFFF;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:inherit;font-size:11px;font-weight:700;color:#0B2A3C;position:relative;min-height:70px;justify-content:center}
.bd{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:9px;background:#C0362C;color:#FFFFFF;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;box-sizing:border-box}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column">
  <header style="padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 10px">
    <b style="font-size: 20px; font-weight: 800">Управление магазином</b>
    <label style="height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 12px; border: 1px solid #E5E7EB; background: #FFFFFF">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input type="text" placeholder="Найти раздел" aria-label="Найти раздел" style="border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 14px; width: 100%">
    </label>
  </header>

  <main style="flex-grow: 1; padding: 0 16px 12px; display: flex; flex-direction: column; gap: 6px; overflow: hidden">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
      <span class="g">{{g.name}}</span>
      <div class="grid">
        <sc-for list="{{g.items}}" as="i" hint-placeholder-count="3">
          <button type="button" class="it">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.icon}}"></path></svg>{{i.name}}
            <sc-if value="{{i.badge}}" hint-placeholder-val="{{false}}"><span class="bd">{{i.badge}}</span></sc-if>
          </button>
        </sc-for>
      </div>
    </sc-for>
  </main>

  <nav class="nav" aria-label="Разделы администратора">
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21H3z"></path></svg></span>Главная</a>
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 4h2l2.5 11h11L21 7H6.5"></path><circle cx="9" cy="19.5" r="1.5"></circle><circle cx="17" cy="19.5" r="1.5"></circle></svg></span>Продажа</a>
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg></span>Товары</a>
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span>Отчёты</a>
    <a href="#" class="on"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg></span>Ещё</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const I = {
      box: 'M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5',
      plus: 'M12 5v14M5 12h14',
      truck: 'M2 7h12v9H2zM14 10h4l3 3v3h-7M6 19a2 2 0 1 0 0-.01M17 19a2 2 0 1 0 0-.01',
      clock: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M12 7v5l3 2',
      ret: 'M9 14 4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3',
      user: 'M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8M4 21a8 8 0 0 1 16 0',
      key: 'M15 7a4 4 0 1 0-3.5 6L5 19.5V22h3v-2h2v-2h2l1.5-1.5A4 4 0 0 0 15 7',
      chart: 'M4 20V10M10 20V4M16 20v-7M22 20H2',
      coin: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M9 9h4.5a2 2 0 0 1 0 4H9h5a2 2 0 0 1 0 4H9V7',
      globe: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M3 12h18M12 3a14 14 0 0 1 0 18',
      send: 'M21 4 3 11l6 2 2 6 3-4 5 4z',
      home: 'M3 21h18M5 21V8l7-5 7 5v13',
      gear: 'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6M4 12h2M18 12h2M12 4v2M12 18v2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4'
    };
    const i = (name, icon, badge) => ({ name, icon, badge: badge || '' });
    return {
      groups: [
        { name: 'ТОВАРЫ', items: [i('Склад', I.box), i('Приёмка', I.plus), i('Пополнение', I.truck, '[N]')] },
        { name: 'ПРОДАЖИ', items: [i('Все чеки', I.chart), i('Возвраты', I.ret), i('Долги', I.coin, '[N]'), i('Клиенты', I.user), i('Прокат', I.clock)] },
        { name: 'ДЕНЬГИ', items: [i('Прибыль', I.chart), i('Смены', I.clock), i('Зарплата', I.coin)] },
        { name: 'САЙТ И БОТ', items: [i('Витрина', I.globe), i('Заказы', I.box, '[N]'), i('Telegram', I.send)] },
        { name: 'УПРАВЛЕНИЕ', items: [i('Сотрудники', I.key), i('Филиалы', I.home), i('Настройки', I.gear)] }
      ]
    };
  }
}
</script>
</body>
</html>
