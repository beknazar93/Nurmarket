<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Заказ поставщику</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.ln{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#FFFFFF}
.st{width:34px;height:34px;border-radius:17px;font-family:inherit;font-size:18px;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column">
  <header style="padding: 18px 16px 10px; display: flex; align-items: center; gap: 12px">
    <button type="button" aria-label="Назад" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #E5E7EB; background: #FFFFFF; color: #344054; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <span style="display: flex; flex-direction: column; flex-grow: 1"><b style="font-size: 18px; font-weight: 800">Заказ поставщику</b><span style="font-size: 12px; color: #667085">Количество — по продажам за 4 недели</span></span>
  </header>
  <main style="flex-grow: 1; padding: 0 16px 12px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
    <button type="button" style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 14px; border: 1px solid #E5E7EB; background: #FFFFFF; font-family: inherit; text-align: left"><span style="width: 38px; height: 38px; border-radius: 12px; background: #E7EEF3; color: #0B2A3C; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px">[П]</span><span style="flex-grow: 1; display: flex; flex-direction: column"><b style="font-size: 14px">[поставщик]</b><span style="font-size: 12px; color: #667085">WhatsApp · [телефон]</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <div class="ln">
        <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</b><span style="font-size: 12px; color: {{r.c}}; font-weight: 600">{{r.left}}</span></span>
        <span style="display: flex; align-items: center; gap: 6px"><button type="button" class="st" aria-label="Меньше" style="border: 1px solid #D0D5DD; background: #FFFFFF">−</button><b style="min-width: 28px; text-align: center">[N]</b><button type="button" class="st" aria-label="Больше" style="border: 0; background: #0B2A3C; color: #FFFFFF">+</button></span>
      </div>
    </sc-for>
    <button type="button" style="height: 44px; border-radius: 12px; border: 1.5px dashed #D0D5DD; background: transparent; font-family: inherit; font-size: 13px; font-weight: 700; color: #344054">+ Добавить товар</button>
  </main>
  <div style="padding: 10px 16px 22px; display: flex; flex-direction: column; gap: 8px; background: #FFFFFF; border-top: 1px solid #EAECF0">
    <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #475467">4 товара · примерно</span><b style="font-size: 18px; color: #0B2A3C">[сумма]</b></div>
    <button type="button" style="height: 54px; border-radius: 16px; border: 0; background: #FFD600; color: #0B2A3C; font-family: inherit; font-size: 16px; font-weight: 800">Отправить в WhatsApp</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const r = (name, left, c) => ({ name, left, c });
    return {
      rows: [
        r('Кока-Кола (ПЭТ) 2л', 'осталось [N] шт · на 1 день', '#B42318'),
        r('Mars', 'осталось [N] шт · на [N] дня', '#B54708'),
        r('Сок Gracio яблочный 1л', 'осталось 2 шт', '#B54708'),
        r('Салфетки', 'осталось [N] шт', '#B54708')
      ]
    };
  }
}
</script>
</body>
</html>
