<style>

.shelf{position:absolute;left:0;right:0;height:10px;background:#5B4636;border-radius:2px}
.box{position:absolute;border-radius:6px}
.det{position:absolute;border:2.5px solid;border-radius:8px}
.lab{position:absolute;left:-2px;top:-24px;font-size:10px;font-weight:800;padding:3px 6px;border-radius:6px;white-space:nowrap}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A1620; font-family: Montserrat, system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column">
  <header style="padding: 18px 16px 10px; display: flex; align-items: center; gap: 10px">

      <button type="button" class="seg" style="background: transparent; color: #D0D5DD">Этикетки</button>
    </span>
  </header>

  <div style="flex-grow: 1; position: relative; margin: 6px 12px; border-radius: 20px; background: #2A231C; overflow: hidden">
    <div style="position: absolute; left: 14px; right: 14px; top: 40px; height: 200px">
      <span class="box" style="left: 6px; bottom: 10px; width: 54px; height: 150px; background: #B91C1C"></span>
      <span class="box" style="left: 66px; bottom: 10px; width: 54px; height: 150px; background: #B91C1C"></span>
      <span class="box" style="left: 140px; bottom: 10px; width: 60px; height: 120px; background: #F59E0B"></span>

      <span class="box" style="left: 280px; bottom: 10px; width: 56px; height: 96px; background: #4ADE80"></span>
      <span class="shelf" style="bottom: 0"></span>
      <span class="det" style="left: 2px; bottom: 6px; width: 122px; height: 158px; border-color: #4ADE80"><span class="lab" style="background: #4ADE80; color: #0A1620">Кока-Кола 2л · ×2</span></span>
      <span class="det" style="left: 136px; bottom: 6px; width: 134px; height: 128px; border-color: #FFD600"><span class="lab" style="background: #FFD600; color: #0A1620">Новый · ×2</span></span>
      <span class="det" style="left: 276px; bottom: 6px; width: 64px; height: 104px; border-color: #FFD600"><span class="lab" style="background: #FFD600; color: #0A1620">Новый</span></span>

    <div style="position: absolute; left: 14px; right: 14px; top: 290px; height: 160px">

      <span class="box" style="left: 98px; bottom: 10px; width: 40px; height: 70px; background: #7C2D12"></span>
      <span class="box" style="left: 160px; bottom: 10px; width: 80px; height: 110px; background: #FDE68A"></span>
      <span class="shelf" style="bottom: 0"></span>
      <span class="det" style="left: 2px; bottom: 6px; width: 140px; height: 78px; border-color: #4ADE80"><span class="lab" style="background: #4ADE80; color: #0A1620">Mars · ×3</span></span>
      <span class="det" style="left: 156px; bottom: 6px; width: 88px; height: 118px; border-color: #4ADE80"><span class="lab" style="background: #4ADE80; color: #0A1620">Макфа 450г</span></span>
    </div>
    <span style="position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 12px; color: #D0D5DD">Держите телефон ровно — камера ищет товары и ценники</span>
  </div>

  <div style="padding: 10px 16px 0; display: flex; gap: 8px; justify-content: center">
    <span style="font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: rgba(74,222,128,.16); color: #4ADE80">Есть в базе · 3</span>

  </div>

  <div style="padding: 14px 24px 26px; display: flex; align-items: center; justify-content: space-between">

  </div>
</div>
