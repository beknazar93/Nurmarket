<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Веб в телефоне — чеки и смены</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.hb{width:44px;height:44px;border-radius:12px;border:0;background:#F2F4F7;color:#0B2A3C;display:flex;align-items:center;justify-content:center}
.seg{flex-grow:1;height:38px;border-radius:10px;border:0;font-family:inherit;font-size:13px;font-weight:700}
.chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:12px;font-weight:600;color:#344054;white-space:nowrap}
.ck{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:#FFFFFF;border:0;font-family:inherit;text-align:left;width:100%}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column">
  <header style="height: 60px; flex-shrink: 0; background: #FFFFFF; border-bottom: 1px solid #EAECF0; display: flex; align-items: center; gap: 10px; padding: 0 12px">
    <button type="button" class="hb" aria-label="Открыть меню"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
    <b style="font-size: 16px; flex-grow: 1">Чеки и смены</b>
  </header>
  <div style="padding: 10px 16px 6px; display: flex; flex-direction: column; gap: 8px">
    <span style="display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: #E4E7EC"><button type="button" class="seg" style="background: #FFFFFF; color: #0B2A3C">Чеки</button><button type="button" class="seg" style="background: transparent; color: #475467">Смены</button></span>
    <div style="display: flex; gap: 6px; overflow: hidden"><button type="button" class="chip">Сегодня ▾</button><button type="button" class="chip">Устройство ▾</button><button type="button" class="chip">Кассир ▾</button><button type="button" class="chip">Оплата ▾</button></div>
  </div>
  <main style="flex-grow: 1; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <button type="button" class="ck">
        <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 14px">Чек [№] · [время]</b><span style="font-size: 12px; color: #667085">{{r.where}} · {{r.pay}}</span></span>
        <b style="font-size: 15px; color: {{r.c}}">{{r.sum}}</b>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#98A2B3" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const r = (where, pay, sum, ret) => ({ where, pay, sum, c: ret ? '#B42318' : '#0B2A3C' });
    return {
      rows: [
        r('Телефон · Кассир Тест', 'наличные', '209 сом'),
        r('Касса на компьютере', 'карта', '170 сом'),
        r('Веб-касса', 'QR', '117 сом'),
        r('Сайт-витрина', 'карта', '340 сом'),
        r('Касса на компьютере', 'в долг', '85 сом'),
        r('Телефон · Кассир Тест', 'возврат', '−39 сом', true)
      ]
    };
  }
}
</script>
</body>
</html>
