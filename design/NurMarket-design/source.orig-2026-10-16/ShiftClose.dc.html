<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Касса — закрытие смены</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; font-family: Montserrat, system-ui, sans-serif; color: #111827">
  <dc-import name="Main" hint-size="1440px,900px"></dc-import>
  <div style="position: absolute; inset: 0; background: rgba(11,42,60,0.45)"></div>
  <section aria-label="Закрытие смены" style="position: absolute; top: 0; right: 0; width: 520px; height: 900px; box-sizing: border-box; background: #FFFFFF; box-shadow: -12px 0 40px rgba(11,42,60,0.25); display: flex; flex-direction: column">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 22px 24px 16px; border-bottom: 1px solid #EAECF0">
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 20px; font-weight: 800">Закрытие смены</span><span style="font-size: 13px; color: #667085">Открыта 10.10.2026 в 14:41 · Nur Test</span></span>
      <button type="button" aria-label="Закрыть" style="width: 40px; height: 40px; border-radius: 12px; border: 1px solid #E5E7EB; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#344054" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </header>
    <div style="flex-grow: 1; overflow: hidden; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <span style="border-radius: 14px; background: #0B2A3C; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #C7D2DB">Выручка за смену</span><span style="font-size: 24px; font-weight: 800; color: #FFD600">4 300 сом</span><span style="font-size: 12px; color: #C7D2DB">47 чеков</span></span>
        <span style="border-radius: 14px; background: #F9FAFB; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #667085">Должно быть в кассе</span><span style="font-size: 24px; font-weight: 800; color: #0B2A3C">2 265 сом</span><span style="font-size: 12px; color: #667085">наличными</span></span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; font-size: 14px">
        <span style="display: flex; justify-content: space-between"><span style="color: #475467">В начале смены</span><span style="font-weight: 700">0 сом</span></span>
        <span style="display: flex; justify-content: space-between"><span style="color: #475467">Продажи наличными</span><span style="font-weight: 700">+2 265 сом</span></span>
        <span style="display: flex; justify-content: space-between"><span style="color: #475467">Безналичные</span><span style="font-weight: 700">2 035 сом</span></span>
        <span style="display: flex; justify-content: space-between"><span style="color: #475467">Возвраты</span><span style="font-weight: 700">0 сом</span></span>
        <span style="display: flex; justify-content: space-between"><span style="color: #475467">Внесения / изъятия</span><span style="font-weight: 700">0 сом</span></span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="factCash" style="font-size: 12px; font-weight: 700; color: #667085; letter-spacing: 0.04em">ФАКТИЧЕСКИ В КАССЕ — ПЕРЕСЧИТАЙТЕ</label>
        <input id="factCash" type="text" value="2 265" style="height: 56px; box-sizing: border-box; border-radius: 12px; border: 2px solid #0B2A3C; padding: 0 16px; font-family: inherit; font-size: 24px; font-weight: 800; color: #0B2A3C">
        <span style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px; background: #E7F6EC; color: #0E7A3A; font-size: 13px; font-weight: 700"><span style="width: 8px; height: 8px; border-radius: 4px; background: #16A34A"></span>Сходится — расхождения нет</span>
      </div>
      <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; color: #344054"><input type="checkbox" checked="" style="width: 18px; height: 18px; accent-color: #0B2A3C">Напечатать отчёт смены</label>
      <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; color: #344054"><input type="checkbox" checked="" style="width: 18px; height: 18px; accent-color: #0B2A3C">Отправить сводку владельцу в Telegram</label>
    </div>
    <footer style="display: flex; gap: 12px; padding: 16px 24px 22px; border-top: 1px solid #EAECF0">
      <button type="button" style="width: 140px; height: 56px; border-radius: 14px; border: 1.5px solid #D0D5DD; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; color: #344054">Отмена</button>
      <button type="button" style="flex-grow: 1; height: 56px; border-radius: 14px; border: 0; background: #FFD600; font-family: inherit; font-size: 17px; font-weight: 800; color: #0B2A3C">Закрыть смену</button>
    </footer>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
