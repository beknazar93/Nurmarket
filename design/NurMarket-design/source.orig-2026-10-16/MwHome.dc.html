<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Веб в телефоне — сводка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.hb{width:44px;height:44px;border-radius:12px;border:0;background:#F2F4F7;color:#0B2A3C;display:flex;align-items:center;justify-content:center}
.kpi{background:#FFFFFF;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px}
.kpi span{font-size:11px;color:#667085;font-weight:600}
.kpi b{font-size:18px;font-weight:800;color:#0B2A3C}
.chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:12px;font-weight:600;color:#344054;white-space:nowrap}
.chip.on{border:0;background:#0B2A3C;color:#FFFFFF}
.ck{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #F2F4F7;font-size:13px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column">
  <header style="height: 60px; flex-shrink: 0; background: #FFFFFF; border-bottom: 1px solid #EAECF0; display: flex; align-items: center; gap: 10px; padding: 0 12px">
    <button type="button" class="hb" aria-label="Открыть меню"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
    <b style="font-size: 16px; flex-grow: 1">Сводка</b>
    <button type="button" class="hb" aria-label="Поиск"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>
  </header>
  <main style="flex-grow: 1; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <div style="display: flex; gap: 6px; overflow: hidden"><button type="button" class="chip on">Сегодня</button><button type="button" class="chip">Вчера</button><button type="button" class="chip">Неделя</button><button type="button" class="chip">Все филиалы ▾</button></div>
    <section style="border-radius: 18px; background: #0B2A3C; color: #FFFFFF; padding: 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #C7D2DB">Выручка</span><b style="font-size: 28px; color: #FFD600">[сумма]</b><span style="font-size: 12px; color: #C7D2DB">Прибыль [сумма] · чеков [N]</span></section>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div class="kpi"><span>В кассах сейчас</span><b>[сумма]</b></div>
      <div class="kpi"><span>Средний чек</span><b>[сумма]</b></div>
    </div>
    <section style="background: #FFFFFF; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
      <b style="font-size: 14px">Продажи по часам</b>
      <div style="height: 90px; display: flex; align-items: flex-end; gap: 5px"><sc-for list="{{bars}}" as="h" hint-placeholder-count="10"><span style="flex-grow: 1; height: {{h}}; border-radius: 4px 4px 1px 1px; background: #E7EEF3"></span></sc-for></div>
    </section>
    <section style="background: #FFFFFF; border-radius: 16px; padding: 4px 14px">
      <div class="ck"><span>Телефон · Кассир Тест</span><b>209 сом</b></div>
      <div class="ck"><span>Касса на компьютере</span><b>170 сом</b></div>
      <div class="ck" style="border: 0"><span>Веб-касса</span><b>117 сом</b></div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { bars: ['30%', '50%', '65%', '45%', '80%', '95%', '70%', '55%', '75%', '40%'] }; }
}
</script>
</body>
</html>
