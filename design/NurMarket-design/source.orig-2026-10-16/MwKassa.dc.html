<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Веб в телефоне — веб-касса</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.hb{width:44px;height:44px;border-radius:12px;border:0;background:#F2F4F7;color:#0B2A3C;display:flex;align-items:center;justify-content:center}
.chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:12px;font-weight:600;color:#344054;white-space:nowrap}
.chip.on{border:0;background:#0B2A3C;color:#FFFFFF}
.p{border:0;text-align:left;background:#FFFFFF;border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px;font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column">
  <header style="height: 60px; flex-shrink: 0; background: #FFFFFF; border-bottom: 1px solid #EAECF0; display: flex; align-items: center; gap: 10px; padding: 0 12px">
    <button type="button" class="hb" aria-label="Открыть меню"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
    <span style="flex-grow: 1; display: flex; flex-direction: column"><b style="font-size: 16px">Веб-касса</b><span style="font-size: 11px; color: #0E7A3A; font-weight: 700">смена открыта</span></span>
  </header>
  <div style="padding: 10px 16px 6px; display: flex; flex-direction: column; gap: 8px">
    <label style="height: 46px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 12px; border: 1px solid #E5E7EB; background: #FFFFFF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input type="text" placeholder="Товар или штрихкод" aria-label="Поиск товара" style="border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 14px; width: 100%"></label>
    <div style="display: flex; gap: 6px; overflow: hidden"><button type="button" class="chip on">Все</button><button type="button" class="chip">Избранное</button><button type="button" class="chip">Весовые</button><button type="button" class="chip">Напитки</button></div>
  </div>
  <main style="flex-grow: 1; padding: 4px 16px 10px; overflow: hidden">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{products}}" as="p" hint-placeholder-count="6">
        <button type="button" class="p">
          <span style="height: 76px; border-radius: 12px; background: {{p.tint}}; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #0B2A3C; position: relative">{{p.mono}}<sc-if value="{{p.qty}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 6px; right: 6px; min-width: 22px; height: 22px; border-radius: 11px; background: #0B2A3C; color: #FFFFFF; font-size: 11px; display: flex; align-items: center; justify-content: center">{{p.qty}}</span></sc-if></span>
          <span style="font-size: 12px; font-weight: 600; line-height: 16px; height: 32px; overflow: hidden">{{p.name}}</span>
          <span style="display: flex; justify-content: space-between; align-items: center"><b style="font-size: 14px; color: #0B2A3C">{{p.price}}</b><span style="width: 28px; height: 28px; border-radius: 14px; background: #FFD600; color: #0B2A3C; display: flex; align-items: center; justify-content: center; font-weight: 700">+</span></span>
        </button>
      </sc-for>
    </div>
  </main>
  <button type="button" style="margin: 0 12px 18px; height: 60px; border-radius: 18px; border: 0; background: #0B2A3C; color: #FFFFFF; font-family: inherit; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 18px; box-shadow: 0 10px 24px rgba(11,42,60,.3)">
    <span style="flex-grow: 1; display: flex; flex-direction: column; align-items: flex-start"><span style="font-size: 12px; color: #C7D2DB">Чек · 2 позиции</span><b style="font-size: 17px">209 сом</b></span>
    <span style="height: 44px; padding: 0 18px; border-radius: 12px; background: #FFD600; color: #0B2A3C; display: flex; align-items: center; font-size: 15px; font-weight: 800">Оплатить</span>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const p = (name, mono, tint, price, qty) => ({ name, mono, tint, price, qty: qty || '' });
    return {
      products: [
        p('Макароны «Макфа» спагетти 450г', 'Мк', '#FFF4C2', '85 сом', '2'),
        p('Кока-Кола (ПЭТ) 2л', 'Кк', '#FDE8E8', '170 сом'),
        p('Mars', 'Ms', '#F1E8FD', '39 сом', '1'),
        p('Патроны для Степлера', 'Пс', '#E3F2FD', '35 сом'),
        p('Aos Extra pover 450гр', 'Ao', '#E7F6EC', '50 сом'),
        p('Адыгене 1л', 'Ад', '#FFEBD6', '50 сом')
      ]
    };
  }
}
</script>
</body>
</html>
