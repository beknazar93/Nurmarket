<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Веб-касса в браузере</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.chip{height:40px;padding:0 16px;border-radius:20px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:13px;font-weight:600;color:#344054}
.chip.on{border:0;background:#0B2A3C;color:#FFFFFF}
.p{border:0;text-align:left;background:#FFFFFF;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;font-family:inherit;box-shadow:0 1px 2px rgba(16,24,40,.06),0 4px 12px rgba(11,42,60,.06)}
.st{font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;display:flex;align-items:center;gap:6px}
.line{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:#F9FAFB}
.sb{width:30px;height:30px;border-radius:15px;font-size:16px;font-family:inherit}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E5E7EB; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
    <span style="display: flex; align-items: center; gap: 10px; flex-grow: 1"><span style="width: 40px; height: 40px; border-radius: 10px; background: #0B2A3C; color: #FFD600; display: flex; align-items: center; justify-content: center; font-weight: 800">N</span><span style="display: flex; flex-direction: column"><b style="font-size: 15px">NBS · Веб-касса</b><span style="font-size: 12px; color: #667085">Работает в браузере, без установки</span></span></span>
    <span class="st" style="background: #E7F6EC; color: #0E7A3A"><span style="width: 8px; height: 8px; border-radius: 4px; background: #16A34A"></span>Смена открыта</span>
    <span class="st" style="background: #F2F4F7; color: #344054"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 9v6M12 9v6M16 9v6M4 5h16v14H4z"></path></svg>USB-сканер подключён</span>
    <span class="st" style="background: #F2F4F7; color: #344054"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4V11h16v7h-2M6 14h12v7H6z"></path></svg>Принтер чеков</span>
    <span style="width: 40px; height: 40px; border-radius: 20px; background: #0B2A3C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">КТ</span>
  </header>

  <div style="flex-grow: 1; display: flex; flex-wrap: wrap">
    <main style="flex: 1 1 560px; min-width: 0; padding: 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
        <label style="flex: 1 1 320px; display: flex; align-items: center; gap: 10px; height: 48px; box-sizing: border-box; padding: 0 16px; background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 12px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 5v14M7 5v14M11 5v14M15 5v14M19 5v14"></path></svg>
          <input type="text" placeholder="Сканируйте штрихкод или введите название…" aria-label="Поиск товара" style="border: 0; outline: 0; flex-grow: 1; font-family: inherit; font-size: 14px; background: transparent">
          <span style="font-size: 12px; color: #98A2B3; border: 1px solid #E5E7EB; border-radius: 6px; padding: 2px 6px">F2</span>
        </label>
        <span style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" class="chip on">Все</button><button type="button" class="chip">Избранное</button><button type="button" class="chip">Весовые</button><button type="button" class="chip">Напитки</button></span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px">
        <sc-for list="{{products}}" as="p" hint-placeholder-count="8">
          <button type="button" class="p">
            <span style="height: 92px; border-radius: 12px; background: {{p.tint}}; display: flex; align-items: center; justify-content: center; color: #0B2A3C; font-size: 20px; font-weight: 800">{{p.mono}}</span>
            <span style="font-size: 13px; font-weight: 600; line-height: 18px; height: 36px; overflow: hidden">{{p.name}}</span>
            <span style="display: flex; justify-content: space-between; align-items: center"><b style="font-size: 15px; color: #0B2A3C">{{p.price}}</b><span style="width: 28px; height: 28px; border-radius: 14px; background: #FFD600; color: #0B2A3C; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700">+</span></span>
          </button>
        </sc-for>
      </div>
    </main>

    <section style="flex: 1 1 340px; max-width: 420px; background: #FFFFFF; border-left: 1px solid #E5E7EB; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; gap: 8px; align-items: center"><span style="padding: 8px 14px; border-radius: 10px; background: #0B2A3C; color: #FFFFFF; font-size: 13px; font-weight: 700">Чек [№]</span><button type="button" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #E5E7EB; background: #F9FAFB; font-family: inherit; font-size: 13px; color: #475467">Клиент — выбрать</button></div>
      <div class="line"><span style="width: 44px; height: 44px; border-radius: 10px; background: #FFF4C2; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #0B2A3C">Мк</span><span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Макароны «Макфа» спагетти 450г</span><b style="font-size: 14px; color: #0B2A3C">170 сом</b></span><span style="display: flex; align-items: center; gap: 6px"><button type="button" class="sb" aria-label="Меньше" style="border: 1px solid #D0D5DD; background: #FFFFFF">−</button><b>2</b><button type="button" class="sb" aria-label="Больше" style="border: 0; background: #0B2A3C; color: #FFFFFF">+</button></span></div>
      <div class="line"><span style="width: 44px; height: 44px; border-radius: 10px; background: #F1E8FD; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #0B2A3C">Ms</span><span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 600">Mars</span><b style="font-size: 14px; color: #0B2A3C">39 сом</b></span><span style="display: flex; align-items: center; gap: 6px"><button type="button" class="sb" aria-label="Меньше" style="border: 1px solid #D0D5DD; background: #FFFFFF">−</button><b>1</b><button type="button" class="sb" aria-label="Больше" style="border: 0; background: #0B2A3C; color: #FFFFFF">+</button></span></div>
      <div style="margin-top: auto; border-top: 1px dashed #D0D5DD; padding-top: 12px; display: flex; justify-content: space-between; align-items: baseline"><b style="font-size: 15px">Итого</b><b style="font-size: 28px; font-weight: 800; color: #0B2A3C">209 сом</b></div>
      <button type="button" style="height: 60px; border-radius: 14px; border: 0; background: #FFD600; color: #0B2A3C; font-family: inherit; font-size: 18px; font-weight: 800; box-shadow: 0 8px 20px rgba(255,214,0,.35)">Оплатить · F12</button>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const p = (name, mono, tint, price) => ({ name, mono, tint, price });
    return {
      products: [
        p('Макароны «Макфа» спагетти 450г', 'Мк', '#FFF4C2', '85 сом'),
        p('Кока-Кола (ПЭТ) 2л', 'Кк', '#FDE8E8', '170 сом'),
        p('Mars', 'Ms', '#F1E8FD', '39 сом'),
        p('Патроны для Степлера', 'Пс', '#E3F2FD', '35 сом'),
        p('Aos Extra pover 450гр бальзам', 'Ao', '#E7F6EC', '50 сом'),
        p('Адыгене 1л', 'Ад', '#FFEBD6', '50 сом'),
        p('Арахис соенний', 'Ар', '#FFF4C2', '60 сом'),
        p('Араванский', 'Ав', '#E3F2FD', '208 сом')
      ]
    };
  }
}
</script>
</body>
</html>
