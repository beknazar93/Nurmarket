<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сканер камерой</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.rb{width:44px;height:44px;border-radius:22px;border:0;background:rgba(255,255,255,.14);color:#FFFFFF;display:flex;align-items:center;justify-content:center}
.seg{flex-grow:1;height:36px;border-radius:10px;border:0;font-family:inherit;font-size:12px;font-weight:700}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A1620; font-family: Montserrat, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column; position: relative">
  <header style="padding: 18px 16px; display: flex; align-items: center; gap: 10px; color: #FFFFFF">
    <button type="button" class="rb" aria-label="Закрыть сканер"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    <span style="flex-grow: 1; display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(255,255,255,.1)">
      <button type="button" class="seg" style="background: #FFD600; color: #0B2A3C">В чек</button>
      <button type="button" class="seg" style="background: transparent; color: #D0D5DD">Узнать цену</button>
      <button type="button" class="seg" style="background: transparent; color: #D0D5DD">Приёмка</button>
    </span>
    <button type="button" class="rb" aria-label="Фонарик"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg></button>
  </header>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px">
    <div style="width: 270px; height: 170px; position: relative; border-radius: 18px; box-shadow: 0 0 0 999px rgba(0,0,0,.35)">
      <span style="position: absolute; left: 0; top: 0; width: 36px; height: 36px; border-left: 4px solid #FFD600; border-top: 4px solid #FFD600; border-top-left-radius: 18px"></span>
      <span style="position: absolute; right: 0; top: 0; width: 36px; height: 36px; border-right: 4px solid #FFD600; border-top: 4px solid #FFD600; border-top-right-radius: 18px"></span>
      <span style="position: absolute; left: 0; bottom: 0; width: 36px; height: 36px; border-left: 4px solid #FFD600; border-bottom: 4px solid #FFD600; border-bottom-left-radius: 18px"></span>
      <span style="position: absolute; right: 0; bottom: 0; width: 36px; height: 36px; border-right: 4px solid #FFD600; border-bottom: 4px solid #FFD600; border-bottom-right-radius: 18px"></span>
      <span style="position: absolute; left: 24px; right: 24px; top: 84px; height: 2px; background: #FFD600; box-shadow: 0 0 12px #FFD600"></span>
    </div>
    <span style="font-size: 13px; color: #C7D2DB">Наведите на штрихкод — товар добавится сам</span>
  </div>

  <section style="background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 14px 18px 22px; display: flex; flex-direction: column; gap: 12px">
    <span style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #D0D5DD"></span>
    <div style="display: flex; gap: 12px; align-items: center">
      <span style="width: 56px; height: 56px; border-radius: 14px; background: #FFF4C2; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #0B2A3C">Мк</span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 15px">Макароны «Макфа» спагетти 450г</b><span style="font-size: 12px; color: #667085">4702154000047 · на складе 48 шт.</span></span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <b style="font-size: 24px; font-weight: 800; color: #0B2A3C">85 сом</b>
      <span style="display: flex; align-items: center; gap: 10px"><button type="button" aria-label="Меньше" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid #D0D5DD; background: #FFFFFF; font-size: 20px; font-family: inherit">−</button><b style="font-size: 18px; min-width: 20px; text-align: center">1</b><button type="button" aria-label="Больше" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: #0B2A3C; color: #FFFFFF; font-size: 20px; font-family: inherit">+</button></span>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #344054"><input type="checkbox" checked="" style="width: 20px; height: 20px; accent-color: #0B2A3C">Сканировать подряд, без подтверждения</label>
    <div style="display: flex; gap: 8px">
      <button type="button" style="height: 52px; padding: 0 16px; border-radius: 14px; border: 1.5px solid #D0D5DD; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #344054">Чек · 2</button>
      <button type="button" style="flex-grow: 1; height: 52px; border-radius: 14px; border: 0; background: #FFD600; color: #0B2A3C; font-family: inherit; font-size: 16px; font-weight: 800">Добавить в чек</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
