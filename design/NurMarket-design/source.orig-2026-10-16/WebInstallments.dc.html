<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Рассрочки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.m{background:#FFFFFF;border-radius:20px;box-shadow:0 24px 60px rgba(11,42,60,.22);display:flex;flex-direction:column;overflow:hidden}
.mh{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #EAECF0}
.mt{flex-grow:1;display:flex;flex-direction:column;gap:2px}
.mt b{font-size:16px;font-weight:800}
.mt span{font-size:12px;color:#667085}
.x{width:34px;height:34px;border-radius:10px;border:1px solid #E5E7EB;background:#FFFFFF;font-size:14px;color:#344054;font-family:inherit}
.mb{padding:14px 20px;display:flex;flex-direction:column;gap:8px}
.mf{display:flex;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid #EAECF0;background:#FCFCFD}
.tot{flex-grow:1;font-size:12px;color:#475467}
.tot b{font-size:14px;color:#0B2A3C}
.b2{height:42px;padding:0 14px;border-radius:12px;border:1.5px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:13px;font-weight:700;color:#344054}
.b1{height:42px;padding:0 16px;border-radius:12px;border:0;background:#FFD600;font-family:inherit;font-size:13px;font-weight:800;color:#0B2A3C}
.bd{height:42px;padding:0 16px;border-radius:12px;border:0;background:#C0362C;font-family:inherit;font-size:13px;font-weight:800;color:#FFFFFF}
.lbl{font-size:11px;font-weight:700;color:#667085;letter-spacing:.03em}
.in{height:42px;box-sizing:border-box;border-radius:10px;border:1px solid #D0D5DD;padding:0 12px;font-family:inherit;font-size:14px;width:100%;background:#FFFFFF}
.big{height:52px;font-size:20px;font-weight:800;border:2px solid #0B2A3C}
.chip{height:34px;padding:0 10px;border-radius:17px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:12px;font-weight:600;color:#344054;white-space:nowrap}
.chip.on{border:0;background:#0B2A3C;color:#FFFFFF;font-weight:700}
.sg{display:flex;gap:4px;padding:4px;border-radius:12px;background:#E4E7EC}
.seg{flex-grow:1;height:40px;border-radius:10px;border:0;font-family:inherit;font-size:13px;font-weight:700;background:transparent;color:#475467}
.seg.on{background:#FFFFFF;color:#0B2A3C;box-shadow:0 1px 2px rgba(16,24,40,.08)}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#F9FAFB;font-size:13px}
.rl{display:flex;justify-content:space-between;font-size:13px;padding:5px 0}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
.card{background:#FFFFFF;border:1px solid #E5E7EB;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.kpi{background:#FFFFFF;border:1px solid #E5E7EB;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi span{font-size:12px;font-weight:600;color:#667085}
.kpi b{font-size:22px;font-weight:800;color:#0B2A3C}
.nv{width:44px;height:44px;border-radius:14px;border:1px solid #E5E7EB;background:#FFFFFF;color:#344054;display:flex;align-items:center;justify-content:center}
.pc{background:#FFFFFF;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.cta{height:56px;border-radius:16px;border:0;background:#FFD600;color:#0B2A3C;font-family:inherit;font-size:17px;font-weight:800;width:100%}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827; display: flex; flex-wrap: wrap">
  <div style="flex: 1 1 240px; max-width: 260px; display: flex"><dc-import name="WebNav" active="Рассрочки" hint-size="260px,900px"></dc-import></div>
  <main style="flex: 999 1 560px; min-width: 0; padding: 22px 28px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
      <span style="display: flex; flex-direction: column; flex-grow: 1"><b style="font-size: 24px; font-weight: 800">Рассрочки</b><span style="font-size: 13px; color: #667085">Договоры клиентов, платежи и просрочки</span></span>
      <button type="button" class="b2">Настройки рассрочки</button>
      <button type="button" class="b1">+ Новая рассрочка</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px">
      <div class="kpi"><span>Клиенты должны по рассрочкам</span><b>[сумма]</b></div>
      <div class="kpi"><span>Ждём в этом месяце</span><b>[сумма]</b></div>
      <div class="kpi"><span>Просрочено</span><b style="color: #B42318">[сумма]</b></div>
      <div class="kpi"><span>Доход от наценки</span><b style="color: #0E7A3A">[сумма]</b></div>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px"><button type="button" class="chip on">Активные · [N]</button><button type="button" class="chip">Платёж на этой неделе</button><button type="button" class="chip">Просрочены · [N]</button><button type="button" class="chip">Погашены</button><button type="button" class="chip">Расторгнуты</button></div>
    <section style="background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 16px; overflow: hidden">
      <div style="overflow-x: auto"><div style="min-width: 820px">
        <div style="display: grid; grid-template-columns: 1.4fr 1.4fr 1fr 1.6fr 1.1fr 1fr; gap: 8px; padding: 12px 14px; font-size: 12px; font-weight: 700; color: #667085; border-bottom: 1px solid #EAECF0"><span>Клиент</span><span>Товар</span><span>Сумма</span><span>Оплачено</span><span>Следующий платёж</span><span>Статус</span></div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
          <div style="display: grid; grid-template-columns: 1.4fr 1.4fr 1fr 1.6fr 1.1fr 1fr; gap: 8px; padding: 12px 14px; font-size: 13px; align-items: center; border-bottom: 1px solid #F2F4F7">
            <b style="font-weight: 600">[Клиент]</b><span>{{r.item}}</span><b style="color: #0B2A3C">{{r.sum}}</b>
            <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #475467">{{r.paid}}</span><span style="height: 6px; border-radius: 3px; background: #E4E7EC; overflow: hidden"><span style="display: block; height: 6px; width: {{r.w}}; background: {{r.bar}}"></span></span></span>
            <span>{{r.next}}</span>
            <span class="tag" style="justify-self: start; background: {{r.sbg}}; color: {{r.sfg}}">{{r.st}}</span>
          </div>
        </sc-for>
      </div></div>
    </section>

  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = { st: 'платит', sbg: '#E7F6EC', sfg: '#0E7A3A', bar: '#16A34A' };
    const late = { st: 'просрочка', sbg: '#FDE2E1', sfg: '#B42318', bar: '#C0362C' };
    const soon = { st: 'платёж скоро', sbg: '#FEF3E2', sfg: '#B54708', bar: '#F79009' };
    const done = { st: 'погашена', sbg: '#F2F4F7', sfg: '#475467', bar: '#98A2B3' };
    const r = (item, sum, paid, w, next, s) => Object.assign({ item, sum, paid, w, next }, s);
    return {
      rows: [
        r('Телефон [модель]', '52 400', '2 из 6 · 24 140', '46%', '7 070 · [дата]', late),
        r('[товар]', '[сумма]', '4 из 9', '44%', '[сумма] · завтра', soon),
        r('[товар]', '[сумма]', '1 из 3', '33%', '[сумма] · [дата]', ok),
        r('[товар]', '[сумма]', '10 из 12', '83%', '[сумма] · [дата]', ok),
        r('[товар]', '[сумма]', '6 из 6', '100%', '—', done)
      ]
    };
  }
}
</script>
</body>
</html>
