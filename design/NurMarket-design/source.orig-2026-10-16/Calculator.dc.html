<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Калькуляция — валюта</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827">
  <dc-import name="OwnerNav" group="goods" active="Калькуляция" hint-size="308px,900px"></dc-import>
  <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 22px 24px; display: flex; flex-direction: column; gap: 16px">
    <span style="font-size: 24px; font-weight: 800">Калькуляция</span>
    <div role="tablist" style="display: flex; gap: 6px; background: #FFFFFF; border-radius: 14px; padding: 5px; align-self: flex-start; border: 1px solid #E5E7EB">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
        <sc-if value="{{t.active}}" hint-placeholder-val="{{false}}"><button type="button" role="tab" aria-selected="true" style="height: 38px; padding: 0 16px; border-radius: 10px; border: 0; background: #FFD600; font-family: inherit; font-size: 13px; font-weight: 800; color: #0B2A3C">{{t.name}}</button></sc-if>
        <sc-if value="{{t.idle}}" hint-placeholder-val="{{true}}"><button type="button" role="tab" aria-selected="false" style="height: 38px; padding: 0 16px; border-radius: 10px; border: 0; background: transparent; font-family: inherit; font-size: 13px; font-weight: 600; color: #475467">{{t.name}}</button></sc-if>
      </sc-for>
    </div>
    <div style="flex-grow: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
      <section style="background: #FFFFFF; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
        <span style="font-size: 16px; font-weight: 800">Конвертер валют</span>
        <label for="amt" style="font-size: 13px; font-weight: 600; color: #344054">Сумма</label>
        <input id="amt" type="text" value="100" style="height: 52px; box-sizing: border-box; border-radius: 12px; border: 2px solid #0B2A3C; padding: 0 14px; font-family: inherit; font-size: 22px; font-weight: 800">
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <sc-for list="{{cur}}" as="c" hint-placeholder-count="7">
            <sc-if value="{{c.active}}" hint-placeholder-val="{{false}}"><button type="button" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 0; background: #0B2A3C; color: #FFFFFF; font-family: inherit; font-size: 12px; font-weight: 800">{{c.name}}</button></sc-if>
            <sc-if value="{{c.idle}}" hint-placeholder-val="{{true}}"><button type="button" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #344054; font-family: inherit; font-size: 12px; font-weight: 600">{{c.name}}</button></sc-if>
          </sc-for>
        </div>
        <div style="border-radius: 14px; background: #0B2A3C; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center"><span style="font-size: 14px; color: #C7D2DB">Кыргызский сом</span><span style="font-size: 26px; font-weight: 800; color: #FFD600">1 306,65 сом</span></div>
        <sc-for list="{{conv}}" as="v" hint-placeholder-count="5">
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-radius: 12px; background: #F9FAFB"><span style="font-size: 14px; color: #475467">{{v.name}}</span><span style="font-size: 16px; font-weight: 800">{{v.value}}</span></div>
        </sc-for>
        <button type="button" style="margin-top: auto; height: 46px; border-radius: 12px; border: 1.5px solid #0B2A3C; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #0B2A3C">Перенести 1 306,65 сом закупкой в «Цену и наценку»</button>
      </section>
      <section style="background: #FFFFFF; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
        <span style="font-size: 16px; font-weight: 800">Ваш курс к сому</span>
        <span style="font-size: 13px; color: #667085">Впишите, почём покупаете валюту, или подставьте курс Нацбанка. Курс общий с приёмкой на складе.</span>
        <button type="button" style="height: 46px; border-radius: 12px; border: 0; background: #FFD600; font-family: inherit; font-size: 14px; font-weight: 800; color: #0B2A3C">⟳ Автоподставить курс (Нацбанк КР)</button>
        <sc-for list="{{rates}}" as="r" hint-placeholder-count="6">
          <label style="display: flex; align-items: center; gap: 12px; padding: 6px 0">
            <span style="flex-grow: 1; font-size: 14px; font-weight: 600">1 {{r.code}} <span style="color: #667085; font-weight: 500">— {{r.name}}</span></span>
            <input type="text" value="{{r.rate}}" style="width: 130px; height: 42px; box-sizing: border-box; border-radius: 10px; border: 1px solid #D0D5DD; padding: 0 12px; text-align: right; font-family: inherit; font-size: 14px; font-weight: 700">
            <span style="font-size: 13px; color: #667085; width: 32px">сом</span>
          </label>
        </sc-for>
        <span style="margin-top: auto; font-size: 12px; color: #667085">Курс Нацбанка КР на 11.10.2026 · можно поправить под обменку или банк</span>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const tabs = ['Цена и наценка', 'Партия', 'Проверка цен', 'Безубыточность', 'Скидка и акция', 'Валюта'].map((name, i) => ({ name, active: i === 5, idle: i !== 5 }));
    const cur = ['сом', '$ USD', '€ EUR', '¥ CNY', '₸ KZT', '₽ RUB', 'UZS'].map((name, i) => ({ name, active: i === 3, idle: i !== 3 }));
    const conv = [
      { name: 'Доллар США', value: '14,94 USD' }, { name: 'Евро', value: '13,32 EUR' },
      { name: 'Казахстанский тенге', value: '6 780,75 KZT' }, { name: 'Российский рубль', value: '1 274,53 RUB' },
      { name: 'Узбекский сум', value: '177 052,85 UZS' }
    ];
    const rates = [
      { code: 'USD', name: 'Доллар США', rate: '87,45' }, { code: 'EUR', name: 'Евро', rate: '98,1276' },
      { code: 'CNY', name: 'Китайский юань', rate: '13,0665' }, { code: 'KZT', name: 'Казахстанский тенге', rate: '0,1927' },
      { code: 'RUB', name: 'Российский рубль', rate: '1,0252' }, { code: 'UZS', name: 'Узбекский сум', rate: '0,00738' }
    ];
    return { tabs, cur, conv, rates };
  }
}
</script>
</body>
</html>
