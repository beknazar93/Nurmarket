<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Филиалы — веб</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.br{background:#FFFFFF;border:1px solid #E5E7EB;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.m{display:flex;flex-direction:column;gap:2px}
.m span{font-size:11px;font-weight:600;color:#667085}
.m b{font-size:16px;font-weight:800;color:#0B2A3C}
.dev{display:flex;align-items:center;gap:8px;font-size:12px;color:#344054}
.b1{height:44px;padding:0 18px;border-radius:12px;border:0;background:#FFD600;font-family:inherit;font-size:14px;font-weight:800;color:#0B2A3C}
.b2{height:40px;padding:0 14px;border-radius:12px;border:1.5px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:13px;font-weight:700;color:#344054}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827; display: flex; flex-wrap: wrap">
  <div style="flex: 1 1 240px; max-width: 260px; display: flex"><dc-import name="WebNav" active="Филиалы" hint-size="260px,900px"></dc-import></div>
  <main style="flex: 999 1 560px; min-width: 0; padding: 22px 28px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
      <span style="display: flex; flex-direction: column; flex-grow: 1"><b style="font-size: 24px; font-weight: 800">Филиалы</b><span style="font-size: 13px; color: #667085">Каждый филиал — свои кассы, склад и сотрудники; товары и цены общие</span></span>
      <button type="button" class="b2" style="height: 44px">Перемещение товара</button>
      <button type="button" class="b1">+ Филиал</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px">
      <sc-for list="{{branches}}" as="b" hint-placeholder-count="3">
        <section class="br" style="border: {{b.border}}">
          <div style="display: flex; align-items: center; gap: 10px"><span style="width: 42px; height: 42px; border-radius: 12px; background: {{b.icbg}}; color: #0B2A3C; display: flex; align-items: center; justify-content: center; font-weight: 800">{{b.ini}}</span><span style="flex-grow: 1; display: flex; flex-direction: column"><b style="font-size: 16px">{{b.name}}</b><span style="font-size: 12px; color: #667085">[адрес]</span></span><span style="font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: {{b.sbg}}; color: {{b.sfg}}">{{b.state}}</span></div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; background: #F9FAFB; border-radius: 12px; padding: 12px">
            <span class="m"><span>Выручка сегодня</span><b>[сумма]</b></span>
            <span class="m"><span>В кассе</span><b>[сумма]</b></span>
            <span class="m"><span>Товаров</span><b>[N]</b></span>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 14px">
            <span class="dev"><span style="width: 8px; height: 8px; border-radius: 4px; background: #16A34A"></span>Касса · [N]</span>
            <span class="dev"><span style="width: 8px; height: 8px; border-radius: 4px; background: #16A34A"></span>Телефоны · [N]</span>
            <span class="dev"><span style="width: 8px; height: 8px; border-radius: 4px; background: #98A2B3"></span>Веб-касса</span>
          </div>
          <div style="display: flex; gap: 8px"><button type="button" class="b2" style="flex-grow: 1">Открыть</button><button type="button" class="b2" style="flex-grow: 1">Склад</button></div>
        </section>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const b = (ini, name, main, open) => ({ ini, name, border: main ? '2px solid #0B2A3C' : '1px solid #E5E7EB', icbg: main ? '#FFD600' : '#F2F4F7', state: open ? 'открыт' : 'закрыт', sbg: open ? '#E7F6EC' : '#F2F4F7', sfg: open ? '#0E7A3A' : '#475467' });
    return { branches: [b('N', 'NBS · главный', true, true), b('[Ф]', '[Филиал]', false, true), b('[Ф]', '[Филиал]', false, false)] };
  }
}
</script>
</body>
</html>
