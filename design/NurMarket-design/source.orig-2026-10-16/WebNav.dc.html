<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Меню веб-админки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
</style>
</helmet>
<nav aria-label="Разделы веб-админки" style="width: 100%; min-height: 900px; height: 100%; box-sizing: border-box; background: #0B2A3C; font-family: Montserrat, system-ui, sans-serif; padding: 20px 14px; display: flex; flex-direction: column; gap: 2px">
  <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 12px"><span style="width: 36px; height: 36px; border-radius: 10px; background: #FFD600; color: #0B2A3C; display: flex; align-items: center; justify-content: center; font-weight: 800">N</span><span style="display: flex; flex-direction: column"><b style="color: #FFFFFF; font-size: 15px">NurMarket</b><span style="font-size: 11px; color: #7D93A3">NBS · Администратор</span></span></div>
  <sc-for list="{{groups}}" as="g" hint-placeholder-count="7">
    <span style="font-size: 10.5px; font-weight: 800; color: #7D93A3; letter-spacing: .05em; padding: 12px 12px 4px">{{g.name}}</span>
    <sc-for list="{{g.items}}" as="i" hint-placeholder-count="3">
      <sc-if value="{{i.on}}" hint-placeholder-val="{{false}}">
        <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; background: #FFD600; color: #0B2A3C; text-decoration: none; font-size: 13.5px; font-weight: 800"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.icon}}"></path></svg><span style="flex-grow: 1">{{i.name}}</span></a>
      </sc-if>
      <sc-if value="{{i.off}}" hint-placeholder-val="{{true}}">
        <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; color: #C7D2DB; text-decoration: none; font-size: 13.5px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.icon}}"></path></svg><span style="flex-grow: 1">{{i.name}}</span><sc-if value="{{i.badge}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 999px; background: #C0362C; color: #FFFFFF">{{i.badge}}</span></sc-if></a>
      </sc-if>
    </sc-for>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"text","default":"Сводка"},"$preview":{"width":260,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'Сводка';
    const I = {
      home: 'M3 10.5 12 3l9 7.5V21H3z',
      ai: 'M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z',
      cart: 'M3 4h2l2.5 11h11L21 7H6.5',
      receipt: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6',
      check: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4M9 15l2 2 4-4',
      trash: 'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13',
      doc: 'M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7',
      card: 'M3 6h18v12H3zM3 10h18M7 15h4',
      gift: 'M4 10h16v10H4zM2 7h20v3H2zM12 7v13M12 7c-2-4-6-3-5 0M12 7c2-4 6-3 5 0',
      box: 'M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5',
      plus: 'M12 5v14M5 12h14',
      truck: 'M2 7h12v9H2zM14 10h4l3 3v3h-7',
      user: 'M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8M4 21a8 8 0 0 1 16 0',
      clock: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M12 7v5l3 2',
      bag: 'M5 8h14l-1 13H6zM9 8a3 3 0 0 1 6 0',
      globe: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M3 12h18M12 3a14 14 0 0 1 0 18',
      chart: 'M4 20V10M10 20V4M16 20v-7M22 20H2',
      key: 'M15 7a4 4 0 1 0-3.5 6L5 19.5V22h3v-2h2v-2h2l1.5-1.5A4 4 0 0 0 15 7',
      branch: 'M3 21h18M5 21V8l7-5 7 5v13',
      gear: 'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6M4 12h2M18 12h2M12 4v2M12 18v2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4'
    };
    const i = (name, icon, badge) => ({ name, icon, badge: badge || '', on: name === active, off: name !== active });
    return {
      groups: [
        { name: 'ГЛАВНАЯ', items: [i('Сводка', I.home), i('Нур Советник', I.ai), i('Задачи и календарь', I.check, '[N]')] },
        { name: 'ПРОДАЖА', items: [i('Веб-касса', I.cart), i('Чеки и смены', I.receipt), i('Платежи и банки', I.card, '1')] },
        { name: 'ТОВАРЫ', items: [i('Товары и склад', I.box), i('Закупки', I.cart, '[N]'), i('Приёмка', I.plus), i('Пополнение и сроки', I.truck), i('Накладные и документы', I.doc)] },
        { name: 'КЛИЕНТЫ', items: [i('Клиенты и долги', I.user, '[N]'), i('Рассрочки', I.receipt, '[N]'), i('Прокат', I.clock), i('Бонусы и сертификаты', I.gift)] },
        { name: 'САЙТ', items: [i('Заказы с сайта', I.bag, '[N]'), i('Сайт и бот', I.globe)] },
        { name: 'ОТЧЁТЫ', items: [i('Прибыль и отчёты', I.chart), i('Удалено из чека', I.trash), i('ЭСФ и ККМ', I.receipt, '1')] },
        { name: 'УПРАВЛЕНИЕ', items: [i('Сотрудники и зарплата', I.key), i('Филиалы', I.branch), i('Настройки и подписка', I.gear)] }
      ]
    };
  }
}
</script>
</body>
</html>
