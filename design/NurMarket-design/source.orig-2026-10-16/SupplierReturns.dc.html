<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Возвраты поставщикам</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827">
  <dc-import name="OwnerNav" group="goods" active="Возвраты поставщикам" hint-size="308px,900px"></dc-import>
  <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 22px 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 24px; font-weight: 800">Возвраты поставщикам</span><span style="font-size: 13px; color: #667085">Брак и пересорт — обратно поставщику, остаток уменьшится</span></span>
      <div role="group" aria-label="Период" style="display: flex; background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 12px; padding: 4px">
        <button type="button" style="height: 36px; padding: 0 14px; border-radius: 9px; border: 0; background: transparent; color: #475467; font-family: inherit; font-size: 13px; font-weight: 600">Неделя</button>
        <button type="button" style="height: 36px; padding: 0 14px; border-radius: 9px; border: 0; background: #0B2A3C; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700">Месяц</button>
        <button type="button" style="height: 36px; padding: 0 14px; border-radius: 9px; border: 0; background: transparent; color: #475467; font-family: inherit; font-size: 13px; font-weight: 600">Всё время</button>
      </div>
    </div>
    <div style="flex-grow: 1; min-height: 0; display: flex; gap: 14px">
      <section style="flex-grow: 1; min-width: 0; background: #FFFFFF; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">
        <div style="display: grid; grid-template-columns: 1fr 1.6fr 1fr 1fr 1fr; gap: 12px; padding: 12px 16px; background: #F9FAFB; font-size: 12px; font-weight: 700; color: #667085"><span>Документ</span><span>Поставщик</span><span>Дата</span><span style="text-align: right">Сумма</span><span>Статус</span></div>
        <sc-for list="{{docs}}" as="d" hint-placeholder-count="4">
          <div style="display: grid; grid-template-columns: 1fr 1.6fr 1fr 1fr 1fr; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid #F2F4F7"><span style="font-size: 13px; font-weight: 800; color: #0B2A3C">{{d.no}}</span><span style="font-size: 13px">[поставщик]</span><span style="font-size: 13px; color: #475467">[дата]</span><span style="text-align: right; font-size: 13px; font-weight: 800">[сумма]</span><span><span style="padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: {{d.bg}}; color: {{d.fg}}">{{d.status}}</span></span></div>
        </sc-for>
      </section>
      <aside aria-label="Новый возврат" style="width: 380px; flex-shrink: 0; background: #FFFFFF; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
        <span style="font-size: 16px; font-weight: 800">Новый возврат</span>
        <label for="supp" style="font-size: 13px; font-weight: 600; color: #344054">Поставщик</label>
        <button id="supp" type="button" style="height: 44px; border-radius: 12px; border: 1px solid #D0D5DD; background: #FFFFFF; font-family: inherit; font-size: 14px; text-align: left; padding: 0 14px; color: #0B2A3C; font-weight: 600">[поставщик] ▾</button>
        <label style="display: flex; align-items: center; gap: 10px; height: 44px; box-sizing: border-box; padding: 0 14px; border: 2px dashed #FFD600; border-radius: 12px"><input type="text" placeholder="Сканируйте товар" style="border: 0; outline: 0; flex-grow: 1; font-family: inherit; font-size: 14px"></label>
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 12px; background: #F9FAFB; font-size: 13px"><span>Aos Extra pover 450гр бальзам</span><span style="font-weight: 800">[кол-во] × 35 сом</span></div>
        <label for="why" style="font-size: 13px; font-weight: 600; color: #344054">Причина</label>
        <div id="why" style="display: flex; gap: 8px; flex-wrap: wrap">
          <button type="button" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 0; background: #0B2A3C; color: #FFFFFF; font-family: inherit; font-size: 12px; font-weight: 700">Брак</button>
          <button type="button" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #D0D5DD; background: #FFFFFF; font-family: inherit; font-size: 12px; font-weight: 600; color: #344054">Пересорт</button>
          <button type="button" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #D0D5DD; background: #FFFFFF; font-family: inherit; font-size: 12px; font-weight: 600; color: #344054">Истёк срок</button>
        </div>
        <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid #F2F4F7; padding-top: 12px"><span style="font-size: 14px; font-weight: 700">К возврату</span><span style="font-size: 22px; font-weight: 800; color: #0B2A3C">[сумма]</span></div>
        <button type="button" style="height: 48px; border-radius: 12px; border: 0; background: #FFD600; font-family: inherit; font-size: 14px; font-weight: 800; color: #0B2A3C">Оформить возврат</button>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { docs: [
      { no: '[ВП-номер]', status: 'Оформлен', bg: '#E7F6EC', fg: '#0E7A3A' },
      { no: '[ВП-номер]', status: 'Ждёт поставщика', bg: '#FEF3E2', fg: '#B54708' },
      { no: '[ВП-номер]', status: 'Оформлен', bg: '#E7F6EC', fg: '#0E7A3A' },
      { no: '[ВП-номер]', status: 'Отменён', bg: '#F2F4F7', fg: '#667085' }
    ] };
  }
}
</script>
</body>
</html>
