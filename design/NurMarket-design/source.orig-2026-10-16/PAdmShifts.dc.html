<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Смены и отчёт</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#FFFFFF;border-top:1px solid #EAECF0;padding:8px 4px 14px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:#667085;text-decoration:none;padding:6px 0}
.nav a.on{color:#0B2A3C;font-weight:800}
.nav a.on span{background:#FFD600}
.nav span{width:44px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:13px;font-weight:600;color:#344054}
.chip.on{border:0;background:#0B2A3C;color:#FFFFFF}
.pm{display:flex;flex-direction:column;gap:2px;flex-grow:1}
.pm span{font-size:11px;color:#C7D2DB}
.pm b{font-size:14px}
.sh{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:#FFFFFF;border:0;font-family:inherit;text-align:left;width:100%}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column">
  <header style="padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 10px">
    <b style="font-size: 20px; font-weight: 800">Отчёты</b>
    <div style="display: flex; gap: 6px"><button type="button" class="chip on">Сегодня</button><button type="button" class="chip">Вчера</button><button type="button" class="chip">Неделя</button><button type="button" class="chip">Месяц</button></div>
  </header>

  <main style="flex-grow: 1; padding: 0 16px 12px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
    <section style="border-radius: 20px; background: #0B2A3C; color: #FFFFFF; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #C7D2DB">Выручка</span><b style="font-size: 28px; font-weight: 800; color: #FFD600">[сумма]</b></span>
      <div style="display: flex; gap: 8px"><span class="pm"><span>Наличные</span><b>[сумма]</b></span><span class="pm"><span>Карта</span><b>[сумма]</b></span><span class="pm"><span>QR</span><b>[сумма]</b></span></div>
    </section>

    <span style="font-size: 12px; font-weight: 700; color: #667085">СМЕНЫ</span>
    <button type="button" class="sh"><span style="width: 40px; height: 40px; border-radius: 20px; background: #FFD600; color: #0B2A3C; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px">КТ</span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 14px">Кассир Тест · Касса 1</b><span style="font-size: 12px; color: #667085">с [время] · [N] чеков</span></span><span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px"><b style="font-size: 14px; color: #0B2A3C">[сумма]</b><span style="font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #E7F6EC; color: #0E7A3A">открыта</span></span></button>
    <button type="button" class="sh"><span style="width: 40px; height: 40px; border-radius: 20px; background: #F2F4F7; color: #0B2A3C; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px">[ИФ]</span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 14px">[Сотрудник] · Телефон</b><span style="font-size: 12px; color: #667085">[время]–[время] · [N] чеков</span></span><span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px"><b style="font-size: 14px; color: #0B2A3C">[сумма]</b><span style="font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #F2F4F7; color: #344054">закрыта</span></span></button>
    <button type="button" class="sh"><span style="width: 40px; height: 40px; border-radius: 20px; background: #F2F4F7; color: #0B2A3C; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px">[ИФ]</span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 14px">[Сотрудник] · Веб-касса</b><span style="font-size: 12px; color: #667085">[время]–[время] · [N] чеков</span></span><span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px"><b style="font-size: 14px; color: #0B2A3C">[сумма]</b><span style="font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #FDE2E1; color: #B42318">недостача</span></span></button>

    <button type="button" style="height: 48px; border-radius: 14px; border: 1.5px solid #D0D5DD; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #344054; margin-top: auto">Отправить отчёт в WhatsApp</button>
  </main>

  <nav class="nav" aria-label="Разделы администратора">
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21H3z"></path></svg></span>Главная</a>
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 4h2l2.5 11h11L21 7H6.5"></path><circle cx="9" cy="19.5" r="1.5"></circle><circle cx="17" cy="19.5" r="1.5"></circle></svg></span>Продажа</a>
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg></span>Товары</a>
    <a href="#" class="on"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span>Отчёты</a>
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg></span>Ещё</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
