<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Пополнение и сроки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827">
  <dc-import name="OwnerNav" group="goods" active="Пополнение и сроки" hint-size="308px,900px"></dc-import>
  <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 24px; font-weight: 800">Пополнение и сроки</span><span style="font-size: 13px; color: #667085">Что пора заказать — по скорости продаж за месяц</span></span>
      <button type="button" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1.5px solid #D0D5DD; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #344054">⟳ Обновить историю продаж</button>
    </div>
    <div style="display: flex; align-items: center; gap: 16px">
      <div role="tablist" style="display: flex; gap: 24px; border-bottom: 1px solid #E5E7EB; flex-grow: 1">
        <button type="button" role="tab" aria-selected="true" style="border: 0; background: transparent; padding: 10px 0; border-bottom: 3px solid #FFD600; font-family: inherit; font-size: 14px; font-weight: 800; color: #0B2A3C">Что заказать · 5</button>
        <button type="button" role="tab" aria-selected="false" style="border: 0; background: transparent; padding: 10px 0; font-family: inherit; font-size: 14px; font-weight: 600; color: #667085">Сроки годности · 3</button>
      </div>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #667085">Скорость за
        <button type="button" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #D0D5DD; background: #FFFFFF; font-family: inherit; font-size: 12px; font-weight: 600; color: #344054">Неделю</button>
        <button type="button" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 0; background: #0B2A3C; font-family: inherit; font-size: 12px; font-weight: 700; color: #FFFFFF">Месяц</button></span>
    </div>
    <section style="flex-grow: 1; min-height: 0; background: #FFFFFF; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">
      <div style="display: grid; grid-template-columns: 0.3fr 2.6fr 0.9fr 1fr 1.1fr 1.2fr; gap: 12px; padding: 12px 16px; background: #F9FAFB; font-size: 12px; font-weight: 700; color: #667085"><span></span><span>Товар</span><span>Остаток</span><span>Продаж в день</span><span>Хватит на</span><span>Заказать на 14 дн.</span></div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
        <label style="display: grid; grid-template-columns: 0.3fr 2.6fr 0.9fr 1fr 1.1fr 1.2fr; gap: 12px; align-items: center; padding: 11px 16px; border-top: 1px solid #F2F4F7">
          <input type="checkbox" checked="{{r.sel}}" aria-label="Выбрать" style="width: 18px; height: 18px; accent-color: #0B2A3C">
          <span style="font-size: 13px; font-weight: 700">{{r.name}}</span>
          <span style="font-size: 13px; color: #475467">{{r.stock}}</span>
          <span style="font-size: 13px; color: #475467">{{r.rate}}</span>
          <span><span style="padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: {{r.bg}}; color: {{r.fg}}">{{r.days}}</span></span>
          <span style="font-size: 14px; font-weight: 800; color: #0B2A3C">{{r.order}}</span>
        </label>
      </sc-for>
      <div style="margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid #EAECF0; background: #FCFCFD">
        <span style="flex-grow: 1; font-size: 13px; color: #475467">Выбрано 5 товаров · 391 шт · меньше 7 дней — красный, меньше 14 — жёлтый</span>
        <button type="button" style="height: 46px; padding: 0 18px; border-radius: 12px; border: 1.5px solid #D0D5DD; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #344054">Скачать список</button>
        <button type="button" style="height: 46px; padding: 0 20px; border-radius: 12px; border: 0; background: #FFD600; font-family: inherit; font-size: 14px; font-weight: 800; color: #0B2A3C">В заявку поставщику</button>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      ['Aos Extra pover 450гр бальзам', '0', '11,14', 0, '157'],
      ['Эссе манго', '8,75', '15,81', 0.6, '213'],
      ['Распиль', '1', '0,33', 3, '4'],
      ['Аренда бетон мешалка', '9', '1,6', 5.6, '14'],
      ['жумуртка', '10', '0,9', 11.1, '3'],
      ['какие то сигореты', '20', '1,23', 16.2, '—'],
      ['Энергетик «Gorilla» ассорти 0,45', '4', '0,2', 20, '—'],
      ['Чипсы «Пир» ассорти 75гр', '2', '0,07', 30, '—'],
      ['Адыгене 1л', '97', '2,67', 36.3, '—']
    ];
    const rows = data.map(([name, stock, rate, d, order]) => ({
      name, stock, rate, order, sel: order !== '—',
      days: String(d).replace('.', ',') + ' дн.',
      bg: d < 7 ? '#FDE8E8' : d < 14 ? '#FEF3E2' : '#E7F6EC',
      fg: d < 7 ? '#B42318' : d < 14 ? '#B54708' : '#0E7A3A'
    }));
    return { rows };
  }
}
</script>
</body>
</html>
