<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Прибыль и отчёты — веб</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.card{background:#FFFFFF;border:1px solid #E5E7EB;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.kpi{background:#FFFFFF;border:1px solid #E5E7EB;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi span{font-size:12px;font-weight:600;color:#667085}
.kpi b{font-size:22px;font-weight:800;color:#0B2A3C}
.tab{height:40px;padding:0 14px;border-radius:10px;border:0;background:transparent;font-family:inherit;font-size:13px;font-weight:700;color:#475467}
.tab.on{background:#FFFFFF;color:#0B2A3C;box-shadow:0 1px 2px rgba(16,24,40,.08)}
.dd{height:40px;padding:0 12px;border-radius:10px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:13px;font-weight:600;color:#344054}
.ab{display:grid;grid-template-columns:44px 1fr 1fr 1fr;gap:8px;padding:10px 0;border-bottom:1px solid #F2F4F7;font-size:13px;align-items:center}
.g{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827; display: flex; flex-wrap: wrap">
  <div style="flex: 1 1 240px; max-width: 260px; display: flex"><dc-import name="WebNav" active="Прибыль и отчёты" hint-size="260px,900px"></dc-import></div>
  <main style="flex: 999 1 560px; min-width: 0; padding: 22px 28px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
      <b style="font-size: 24px; font-weight: 800; flex-grow: 1">Прибыль и отчёты</b>
      <button type="button" class="dd">Этот месяц ▾</button><button type="button" class="dd">Все склады ▾</button><button type="button" class="dd">Excel</button>
    </div>
    <span style="display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 12px; background: #E4E7EC; align-self: flex-start"><button type="button" class="tab on">Прибыль</button><button type="button" class="tab">ABC-анализ</button><button type="button" class="tab">В убыток</button><button type="button" class="tab">По кассирам</button><button type="button" class="tab">Деньги в кассах</button></span>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px">
      <div class="kpi"><span>Выручка</span><b>[сумма]</b></div>
      <div class="kpi"><span>Себестоимость</span><b>[сумма]</b></div>
      <div class="kpi"><span>Расходы</span><b>[сумма]</b></div>
      <div class="kpi" style="background: #0B2A3C; border-color: #0B2A3C"><span style="color: #C7D2DB">Чистая прибыль</span><b style="color: #FFD600">[сумма]</b></div>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
      <section class="card" style="flex: 999 1 460px">
        <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px"><b style="font-size: 15px">Выручка и прибыль по дням</b><span style="display: flex; gap: 12px; font-size: 12px; color: #475467"><span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #CBD5E1"></span>Выручка</span><span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #0B2A3C"></span>Прибыль</span></span></div>
        <div style="height: 220px; display: flex; align-items: flex-end; gap: 6px">
          <sc-for list="{{bars}}" as="b" hint-placeholder-count="14"><span style="flex-grow: 1; height: {{b.r}}; border-radius: 4px 4px 0 0; background: #CBD5E1; display: flex; align-items: flex-end"><span style="width: 100%; height: {{b.p}}; border-radius: 4px 4px 0 0; background: #0B2A3C"></span></span></sc-for>
        </div>
        <span style="font-size: 12px; color: #98A2B3">Столбцы заполнятся данными магазина</span>
      </section>
      <section class="card" style="flex: 1 1 300px; max-width: 400px">
        <b style="font-size: 15px">ABC: что приносит деньги</b>
        <div class="ab" style="font-size: 12px; font-weight: 700; color: #667085"><span></span><span>Товаров</span><span>Выручки</span><span>Что делать</span></div>
        <div class="ab"><span class="g" style="background: #E7F6EC; color: #0E7A3A">A</span><span>[N]</span><span>80 %</span><span style="font-size: 12px">не допускать нуля</span></div>
        <div class="ab"><span class="g" style="background: #FFF7CC; color: #0B2A3C">B</span><span>[N]</span><span>15 %</span><span style="font-size: 12px">держать запас</span></div>
        <div class="ab"><span class="g" style="background: #F2F4F7; color: #475467">C</span><span>[N]</span><span>5 %</span><span style="font-size: 12px">меньше закупать</span></div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const r = [55, 70, 45, 80, 65, 90, 75, 60, 85, 50, 70, 95, 65, 80];
    return { bars: r.map((v) => ({ r: v + '%', p: Math.round(v * 0.32) + '%' })) };
  }
}
</script>
</body>
</html>
