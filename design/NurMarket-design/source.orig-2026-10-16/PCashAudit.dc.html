<!doctype html>

<head>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.row{display:grid;grid-template-columns:1fr 54px 64px;gap:8px;align-items:center;padding:10px 12px;border-radius:14px;background:#FFFFFF;font-size:13px}
.cnt{height:38px;box-sizing:border-box;border-radius:10px;border:2px solid #0B2A3C;font-family:inherit;font-size:15px;font-weight:800;text-align:center;width:100%}
.chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:12px;font-weight:600;color:#344054;white-space:nowrap}
.chip.on{border:0;background:#0B2A3C;color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column">
  <header style="padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 12px">
      <button type="button" aria-label="Назад" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #E5E7EB; background: #FFFFFF; color: #344054; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
      <span style="display: flex; flex-direction: column; flex-grow: 1"><b style="font-size: 18px; font-weight: 800">Ревизия · Напитки</b><span style="font-size: 12px; color: #667085">Проверено [N] из [N]</span></span>
      <button type="button" aria-label="Сканировать" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: #0B2A3C; color: #FFD600; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path><path d="M8 9v6M12 9v6M16 9v6"></path></svg></button>
    </div>
    <span style="height: 8px; border-radius: 4px; background: #E4E7EC; overflow: hidden"><span style="display: block; width: 40%; height: 8px; background: #FFD600"></span></span>
    <div style="display: flex; gap: 6px"><button type="button" class="chip on">Все</button><button type="button" class="chip">Не проверены</button><button type="button" class="chip">Расхождения</button></div>
  </header>

  <main style="flex-grow: 1; padding: 0 16px 12px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
    <div class="row" style="background: transparent; font-size: 11px; font-weight: 700; color: #667085; padding: 0 12px"><span>ТОВАР</span><span>В БАЗЕ</span><span>НАШЛИ</span></div>
    <div class="row"><span style="font-weight: 600">Кока-Кола (ПЭТ) 2л</span><span style="color: #475467">[N]</span><input class="cnt" type="text" placeholder="?" aria-label="Нашли, Кока-Кола"></div>
    <div class="row" style="border: 2px solid #FDE2E1"><span style="display: flex; flex-direction: column; gap: 2px"><b style="font-weight: 600">Сок Gracio яблочный 1л</b><span style="font-size: 11px; font-weight: 700; color: #B42318">не хватает 1</span></span><span style="color: #475467">2</span><input class="cnt" type="text" value="1" aria-label="Нашли, сок" style="border-color: #B42318"></div>
    <div class="row"><span style="display: flex; flex-direction: column; gap: 2px"><b style="font-weight: 600">Адыгене 1л</b><span style="font-size: 11px; font-weight: 700; color: #0E7A3A">совпало</span></span><span style="color: #475467">10</span><input class="cnt" type="text" value="10" aria-label="Нашли, Адыгене" style="border-color: #16A34A"></div>
    <div class="row"><span style="font-weight: 600">[товар]</span><span style="color: #475467">[N]</span><input class="cnt" type="text" placeholder="?" aria-label="Нашли"></div>
  </main>

  <div style="padding: 10px 16px 22px; display: flex; flex-direction: column; gap: 8px; background: #FFFFFF; border-top: 1px solid #EAECF0">
    <span style="font-size: 12px; color: #667085; text-align: center">Остатки поменяет администратор после проверки</span>
    <button type="button" style="height: 54px; border-radius: 16px; border: 0; background: #FFD600; color: #0B2A3C; font-family: inherit; font-size: 16px; font-weight: 800">Отправить администратору</button>
  </div>
</div>
</x-dc>
