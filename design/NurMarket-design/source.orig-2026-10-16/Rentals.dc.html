<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Прокат</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827">
  <dc-import name="OwnerNav" group="sales" active="Прокат" hint-size="308px,900px"></dc-import>
  <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 22px 24px; display: flex; flex-direction: column; gap: 16px">
    <span style="display: flex; flex-direction: column"><span style="font-size: 24px; font-weight: 800">Прокат</span><span style="font-size: 13px; color: #667085">Выдача и приём возврата — на кассе · здесь сроки и напоминания</span></span>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px">
      <button type="button" style="text-align: left; background: #FFFFFF; border-radius: 16px; border: 1px solid #E5E7EB; padding: 16px; font-family: inherit; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 600; color: #667085">Сейчас в прокате</span><span style="font-size: 26px; font-weight: 800; color: #0B2A3C">[N]</span></button>
      <button type="button" style="text-align: left; background: #FFFFFF; border-radius: 16px; border: 1px solid #E5E7EB; padding: 16px; font-family: inherit; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 600; color: #667085">Вернуть сегодня</span><span style="font-size: 26px; font-weight: 800; color: #0B2A3C">[N]</span></button>
      <button type="button" style="text-align: left; background: #FFFFFF; border-radius: 16px; border: 1px solid #E5E7EB; padding: 16px; font-family: inherit; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 600; color: #667085">Вернуть завтра</span><span style="font-size: 26px; font-weight: 800; color: #0B2A3C">[N]</span></button>
      <button type="button" style="text-align: left; background: #FFFFFF; border-radius: 16px; border: 2px solid #B42318; padding: 16px; font-family: inherit; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 600; color: #B42318">Просрочено</span><span style="font-size: 26px; font-weight: 800; color: #B42318">3</span></button>
    </div>
    <div style="display: flex; gap: 8px">
      <button type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: #0B2A3C; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700">Просрочено · 3</button>
      <button type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #344054; font-family: inherit; font-size: 13px; font-weight: 600">Все выдачи</button>
      <button type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #344054; font-family: inherit; font-size: 13px; font-weight: 600">Возвращены</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="3">
        <article style="background: #FFFFFF; border-radius: 16px; padding: 18px; box-shadow: 0 1px 2px rgba(16,24,40,0.05), 0 6px 16px rgba(11,42,60,0.06); display: flex; flex-direction: column; gap: 10px">
          <span style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 13px; font-weight: 800; color: #0B2A3C">№{{it.no}}</span><span style="padding: 4px 10px; border-radius: 999px; background: #FDE8E8; color: #B42318; font-size: 12px; font-weight: 700">Просрочено</span></span>
          <span style="font-size: 16px; font-weight: 800">{{it.item}}</span>
          <span style="font-size: 13px; color: #475467">Клиент: <span style="font-weight: 700; color: #111827">{{it.client}}</span></span>
          <span style="display: flex; justify-content: space-between; font-size: 13px; color: #475467"><span>Вернуть до</span><span style="font-weight: 700; color: #B42318">[дата]</span></span>
          <span style="display: flex; justify-content: space-between; font-size: 13px; color: #475467"><span>Штраф за просрочку</span><span style="font-weight: 700">[сумма]</span></span>
          <span style="display: flex; gap: 8px; margin-top: 4px"><button type="button" style="flex-grow: 1; height: 40px; border-radius: 10px; border: 1.5px solid #D0D5DD; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700; color: #344054">Продлить</button><button type="button" style="flex-grow: 1; height: 40px; border-radius: 10px; border: 0; background: #FFD600; font-family: inherit; font-size: 13px; font-weight: 800; color: #0B2A3C">Напомнить</button></span>
        </article>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { items: [
      { no: '22', item: 'Аренда бетон мешалка', client: 'Арслан' },
      { no: '24', item: 'Аренда бетон мешалка', client: 'ТЕСТ QR формат с пробелами' },
      { no: '21', item: 'Патроны для Степлера', client: 'Проверочный' }
    ] };
  }
}
</script>
</body>
</html>
