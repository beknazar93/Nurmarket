<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Телефон — оформить рассрочку</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.m{background:#FFFFFF;border-radius:20px;box-shadow:0 24px 60px rgba(11,42,60,.22);display:flex;flex-direction:column;overflow:hidden}
.mh{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #EAECF0}
.mt{flex-grow:1;display:flex;flex-direction:column;gap:2px}
.mt b{font-size:16px;font-weight:800}
.mt span{font-size:12px;color:#667085}
.x{width:34px;height:34px;border-radius:10px;border:1px solid #E5E7EB;background:#FFFFFF;font-size:14px;color:#344054;font-family:inherit}
.mb{padding:14px 20px;display:flex;flex-direction:column;gap:8px}
.mf{display:flex;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid #EAECF0;background:#FCFCFD}
.tot{flex-grow:1;font-size:12px;color:#475467}
.tot b{font-size:14px;color:#0B2A3C}
.b2{height:42px;padding:0 14px;border-radius:12px;border:1.5px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:13px;font-weight:700;color:#344054}
.b1{height:42px;padding:0 16px;border-radius:12px;border:0;background:#FFD600;font-family:inherit;font-size:13px;font-weight:800;color:#0B2A3C}
.bd{height:42px;padding:0 16px;border-radius:12px;border:0;background:#C0362C;font-family:inherit;font-size:13px;font-weight:800;color:#FFFFFF}
.lbl{font-size:11px;font-weight:700;color:#667085;letter-spacing:.03em}
.in{height:42px;box-sizing:border-box;border-radius:10px;border:1px solid #D0D5DD;padding:0 12px;font-family:inherit;font-size:14px;width:100%;background:#FFFFFF}
.big{height:52px;font-size:20px;font-weight:800;border:2px solid #0B2A3C}
.chip{height:34px;padding:0 10px;border-radius:17px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:12px;font-weight:600;color:#344054;white-space:nowrap}
.chip.on{border:0;background:#0B2A3C;color:#FFFFFF;font-weight:700}
.sg{display:flex;gap:4px;padding:4px;border-radius:12px;background:#E4E7EC}
.seg{flex-grow:1;height:40px;border-radius:10px;border:0;font-family:inherit;font-size:13px;font-weight:700;background:transparent;color:#475467}
.seg.on{background:#FFFFFF;color:#0B2A3C;box-shadow:0 1px 2px rgba(16,24,40,.08)}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#F9FAFB;font-size:13px}
.rl{display:flex;justify-content:space-between;font-size:13px;padding:5px 0}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
.card{background:#FFFFFF;border:1px solid #E5E7EB;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.kpi{background:#FFFFFF;border:1px solid #E5E7EB;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi span{font-size:12px;font-weight:600;color:#667085}
.kpi b{font-size:22px;font-weight:800;color:#0B2A3C}
.nv{width:44px;height:44px;border-radius:14px;border:1px solid #E5E7EB;background:#FFFFFF;color:#344054;display:flex;align-items:center;justify-content:center}
.pc{background:#FFFFFF;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.cta{height:56px;border-radius:16px;border:0;background:#FFD600;color:#0B2A3C;font-family:inherit;font-size:17px;font-weight:800;width:100%}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <header style="padding: 18px 16px 6px; display: flex; align-items: center; gap: 12px"><button type="button" class="nv" aria-label="Назад"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button><span style="display: flex; flex-direction: column; flex-grow: 1"><b style="font-size: 18px; font-weight: 800">Рассрочка</b><span style="font-size: 12px; color: #667085">Шаг 2 из 3 · срок и взнос</span></span></header>
  <div style="padding: 0 16px 8px; display: flex; gap: 4px"><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #0B2A3C"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #0B2A3C"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #E4E7EC"></span></div>
  <main style="padding: 4px 16px 12px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1">
    <div class="pc" style="flex-direction: row; align-items: center"><span style="flex-grow: 1; font-size: 13px"><b>Телефон [модель]</b><br><span style="color: #667085">[Клиент]</span></span><b style="color: #0B2A3C">50 000</b></div>
    <label class="lbl" for="v1">ПЕРВЫЙ ВЗНОС</label>
    <input id="v1" class="in big" type="text" value="10 000" style="height: 54px">
    <div style="display: flex; gap: 6px"><button type="button" class="chip on">20 %</button><button type="button" class="chip">30 %</button><button type="button" class="chip">50 %</button></div>
    <span class="lbl">СРОК</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" class="b2" style="height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center">3 мес<span style="font-size: 11px; color: #667085">13 330 / мес</span></button>
      <button type="button" class="b2" style="height: 60px; border: 2px solid #0B2A3C; background: #FFF7CC; color: #0B2A3C; display: flex; flex-direction: column; align-items: center; justify-content: center">6 мес<span style="font-size: 11px">7 070 / мес</span></button>
      <button type="button" class="b2" style="height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center">9 мес<span style="font-size: 11px; color: #667085">4 850 / мес</span></button>
      <button type="button" class="b2" style="height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center">12 мес<span style="font-size: 11px; color: #667085">3 740 / мес</span></button>
    </div>
    <div class="pc"><div class="rl"><span>Наценка за 6 мес</span><b>6 % · 2 400</b></div><div class="rl"><span>Всего клиент заплатит</span><b>52 400</b></div></div>
  </main>
  <div style="padding: 10px 16px 22px; background: #FFFFFF; border-top: 1px solid #EAECF0"><button type="button" class="cta">Дальше · график</button></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

</body>
</html>
