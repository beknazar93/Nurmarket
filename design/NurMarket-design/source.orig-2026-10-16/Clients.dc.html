<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Клиенты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827">
  <dc-import name="OwnerNav" group="clients" active="Клиенты" hint-size="308px,900px"></dc-import>
  <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="font-size: 24px; font-weight: 800; flex-grow: 1">Клиенты</span>
      <button type="button" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: #FFD600; font-family: inherit; font-size: 14px; font-weight: 800; color: #0B2A3C">+ Клиент</button>
    </div>
    <div style="display: flex; gap: 10px; align-items: center">
      <label style="flex-grow: 1; display: flex; align-items: center; gap: 10px; height: 44px; box-sizing: border-box; padding: 0 14px; background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 12px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
        <input type="text" placeholder="Имя, телефон или номер карты" style="border: 0; outline: 0; flex-grow: 1; font-family: inherit; font-size: 14px"></label>
      <button type="button" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #0B2A3C; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700">Все</button>
      <button type="button" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #344054; font-family: inherit; font-size: 13px; font-weight: 600">С долгом</button>
      <button type="button" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #344054; font-family: inherit; font-size: 13px; font-weight: 600">С приложением</button>
    </div>
    <div style="flex-grow: 1; min-height: 0; display: flex; gap: 14px">
      <section style="flex-grow: 1; min-width: 0; background: #FFFFFF; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">
        <div style="display: grid; grid-template-columns: 2fr 1.3fr 1fr 1fr 0.9fr; gap: 12px; padding: 12px 16px; background: #F9FAFB; font-size: 12px; font-weight: 700; color: #667085"><span>Клиент</span><span>Телефон</span><span style="text-align: right">Долг</span><span style="text-align: right">Баллы</span><span>Приложение</span></div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
          <div style="display: grid; grid-template-columns: 2fr 1.3fr 1fr 1fr 0.9fr; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid #F2F4F7; background: {{r.bg}}">
            <span style="display: flex; align-items: center; gap: 10px"><span style="width: 34px; height: 34px; border-radius: 17px; background: #F2F4F7; color: #0B2A3C; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800">{{r.ini}}</span><span style="font-size: 14px; font-weight: 700">{{r.name}}</span></span>
            <span style="font-size: 13px; color: {{r.phoneColor}}">{{r.phone}}</span>
            <span style="text-align: right; font-size: 13px; font-weight: 800; color: {{r.debtColor}}">{{r.debt}}</span>
            <span style="text-align: right; font-size: 13px; font-weight: 700">{{r.points}}</span>
            <span style="font-size: 12px; font-weight: 700; color: {{r.appColor}}">{{r.app}}</span>
          </div>
        </sc-for>
      </section>
      <aside aria-label="Карточка клиента" style="width: 320px; flex-shrink: 0; background: #FFFFFF; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
        <span style="display: flex; align-items: center; justify-content: space-between"><span style="font-size: 18px; font-weight: 800">Te</span><button type="button" aria-label="Ещё действия" style="width: 34px; height: 34px; border-radius: 10px; border: 1px solid #E5E7EB; background: #FFFFFF">⋯</button></span>
        <span style="font-size: 13px; color: #667085">тел. 909898789</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <span style="border-radius: 12px; background: #F9FAFB; padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #667085">Долг</span><span style="font-size: 16px; font-weight: 800; color: #B42318">221 507 сом</span></span>
          <span style="border-radius: 12px; background: #FFF7CC; padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #0B2A3C">Баллы</span><span style="font-size: 16px; font-weight: 800; color: #0B2A3C">[N]</span></span>
        </div>
        <span style="display: flex; justify-content: space-between; font-size: 13px; color: #475467; padding: 10px 12px; border-radius: 10px; background: #F9FAFB"><span>Приложение NurCRM</span><span style="font-weight: 700">[да, с дата / нет]</span></span>
        <span style="font-size: 12px; font-weight: 700; color: #667085">ПОКУПКИ</span>
        <span style="display: flex; justify-content: space-between; font-size: 13px"><span>Чеков</span><span style="font-weight: 700">6</span></span>
        <span style="display: flex; justify-content: space-between; font-size: 13px"><span>Обычно берёт</span><span style="font-weight: 700">[товары]</span></span>
        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
          <button type="button" style="height: 44px; border-radius: 12px; border: 0; background: #FFD600; font-family: inherit; font-size: 14px; font-weight: 800; color: #0B2A3C">Изменить</button>
          <button type="button" style="height: 44px; border-radius: 12px; border: 1.5px solid #D0D5DD; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #344054">Все покупки</button>
        </div>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      ['Te', 'тел. 909898789', '221 507 сом', '[N]', '[да/нет]'],
      ['Проверочный', 'тел. 123321', '137 811 сом', '[N]', '[да/нет]'],
      ['Умар', 'номер не указан', '[сумма]', '[N]', '[да/нет]'],
      ['[клиент]', 'тел. [номер]', '—', '[N]', '[да/нет]'],
      ['[клиент]', 'тел. [номер]', '—', '[N]', '[да/нет]'],
      ['[клиент]', 'тел. [номер]', '—', '[N]', '[да/нет]']
    ];
    const rows = data.map(([name, phone, debt, points, app], i) => ({
      name, phone, debt, points, app, ini: name.replace(/[\[\]]/g, '').slice(0, 2).toUpperCase(),
      phoneColor: phone.startsWith('номер') ? '#B54708' : '#475467',
      debtColor: debt === '—' ? '#98A2B3' : '#B42318', appColor: '#475467', bg: i === 0 ? '#FFFBEA' : '#FFFFFF'
    }));
    return { rows };
  }
}
</script>
</body>
</html>
