<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Окна закупки — заказ и выбор товаров</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.m{background:#FFFFFF;border-radius:20px;box-shadow:0 24px 60px rgba(11,42,60,.22);display:flex;flex-direction:column;overflow:hidden}
.mh{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #EAECF0}
.mt{flex-grow:1;display:flex;flex-direction:column;gap:2px}
.mt b{font-size:16px;font-weight:800}
.mt span{font-size:12px;color:#667085}
.x{width:34px;height:34px;border-radius:10px;border:1px solid #E5E7EB;background:#FFFFFF;font-size:14px;color:#344054;font-family:inherit}
.mb{padding:14px 20px;display:flex;flex-direction:column;gap:10px}
.mf{display:flex;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid #EAECF0;background:#FCFCFD}
.tot{flex-grow:1;font-size:12px;color:#475467}
.tot b{font-size:15px;color:#0B2A3C}
.b2{height:42px;padding:0 14px;border-radius:12px;border:1.5px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:13px;font-weight:700;color:#344054}
.b1{height:42px;padding:0 16px;border-radius:12px;border:0;background:#FFD600;font-family:inherit;font-size:13px;font-weight:800;color:#0B2A3C}
.lbl{font-size:11px;font-weight:700;color:#667085;letter-spacing:.03em}
.in{height:40px;box-sizing:border-box;border-radius:10px;border:1px solid #D0D5DD;padding:0 12px;font-family:inherit;font-size:14px;width:100%}
.chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:12px;font-weight:600;color:#344054}
.chip.on{border:0;background:#0B2A3C;color:#FFFFFF;font-weight:700}
.tr{display:grid;grid-template-columns:2fr .9fr .9fr 1fr .9fr 28px;gap:8px;padding:8px 0;border-bottom:1px solid #F2F4F7;font-size:13px;align-items:center}
.ci{height:34px;box-sizing:border-box;border-radius:8px;border:1px solid #D0D5DD;padding:0 8px;font-family:inherit;font-size:13px;font-weight:700;width:100%}
.pk{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-size:13px}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #DDE2E8; font-family: Montserrat, system-ui, sans-serif; color: #111827; padding: 30px; display: grid; grid-template-columns: 1.65fr 1fr; gap: 22px; align-items: start">

  <section class="m" role="dialog" aria-label="Новый заказ поставщику">
    <div class="mh"><div class="mt"><b>Заказ поставщику · черновик</b><span>Сохраняется сам · отправить можно в WhatsApp</span></div><button type="button" class="x" aria-label="Закрыть">✕</button></div>
    <div class="mb">
      <div style="display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px">
        <span style="display: flex; flex-direction: column; gap: 4px"><label class="lbl" for="su">ПОСТАВЩИК</label><input id="su" class="in" type="text" placeholder="[поставщик]"></span>
        <span style="display: flex; flex-direction: column; gap: 4px"><label class="lbl" for="dt">ПРИВЕЗТИ К</label><input id="dt" class="in" type="text" placeholder="[дата]"></span>
      </div>
      <span class="lbl">ОПЛАТА</span>
      <div style="display: flex; gap: 6px"><button type="button" class="chip">Сразу</button><button type="button" class="chip on">При получении</button><button type="button" class="chip">В долг до [дата]</button></div>
      <div class="tr" style="font-size: 11px; font-weight: 700; color: #667085"><span>ТОВАР</span><span>ОСТАЛОСЬ</span><span>ЗАКАЗАТЬ</span><span>ЗАКУПКА</span><span>СУММА</span><span></span></div>
      <sc-for list="{{lines}}" as="l" hint-placeholder-count="4">
        <div class="tr"><span style="font-weight: 600">{{l.name}}</span><span style="color: {{l.c}}; font-weight: 700">{{l.left}}</span><input class="ci" type="text" placeholder="[N]" aria-label="Заказать"><input class="ci" type="text" placeholder="[цена]" aria-label="Цена закупки"><span style="color: #475467">авто</span><button type="button" aria-label="Убрать" style="width: 28px; height: 28px; border: 0; background: transparent; color: #98A2B3; font-size: 14px">✕</button></div>
      </sc-for>
      <button type="button" class="b2" style="border-style: dashed; align-self: flex-start">+ Добавить товары</button>
    </div>
    <div class="mf"><span class="tot">4 позиции · <b>[сумма]</b></span><button type="button" class="b2">Сохранить черновик</button><button type="button" class="b1">Отправить поставщику</button></div>
  </section>

  <section class="m" role="dialog" aria-label="Выбор товаров">
    <div class="mh"><div class="mt"><b>Выбор товаров</b><span>Для заказа поставщику</span></div><button type="button" class="x" aria-label="Закрыть">✕</button></div>
    <div class="mb" style="gap: 8px">
      <input class="in" type="text" placeholder="Название или штрихкод" aria-label="Поиск товара">
      <div style="display: flex; gap: 6px"><button type="button" class="chip on">Заканчиваются</button><button type="button" class="chip">От поставщика</button><button type="button" class="chip">Все</button></div>
      <label class="pk" style="background: #FFF7CC"><input type="checkbox" checked="" style="width: 18px; height: 18px; accent-color: #0B2A3C"><span style="flex-grow: 1; font-weight: 600">Кока-Кола (ПЭТ) 2л</span><span style="font-size: 12px; color: #B42318; font-weight: 700">[N] шт</span></label>
      <label class="pk" style="background: #FFF7CC"><input type="checkbox" checked="" style="width: 18px; height: 18px; accent-color: #0B2A3C"><span style="flex-grow: 1; font-weight: 600">Mars</span><span style="font-size: 12px; color: #B54708; font-weight: 700">[N] шт</span></label>
      <label class="pk" style="background: #FFF7CC"><input type="checkbox" checked="" style="width: 18px; height: 18px; accent-color: #0B2A3C"><span style="flex-grow: 1; font-weight: 600">Сок Gracio яблочный 1л</span><span style="font-size: 12px; color: #B54708; font-weight: 700">2 шт</span></label>
      <label class="pk"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #0B2A3C"><span style="flex-grow: 1; font-weight: 600">Салфетки</span><span style="font-size: 12px; color: #667085">[N] шт</span></label>
      <label class="pk"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #0B2A3C"><span style="flex-grow: 1; font-weight: 600">Макароны «Макфа» 450г</span><span style="font-size: 12px; color: #667085">49 шт</span></label>
    </div>
    <div class="mf"><span class="tot">Выбрано <b>3</b></span><button type="button" class="b2">Отмена</button><button type="button" class="b1">Добавить 3</button></div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const l = (name, left, c) => ({ name, left, c });
    return { lines: [l('Кока-Кола (ПЭТ) 2л', '[N] шт', '#B42318'), l('Mars', '[N] шт', '#B54708'), l('Сок Gracio яблочный 1л', '2 шт', '#B54708'), l('Салфетки', '[N] шт', '#475467')] };
  }
}
</script>
</body>
</html>
