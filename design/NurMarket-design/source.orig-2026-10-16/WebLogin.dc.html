<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход в веб NurMarket</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.lbl{font-size:12px;font-weight:700;color:#667085}
.in{height:50px;box-sizing:border-box;border-radius:12px;border:1px solid #D0D5DD;padding:0 14px;font-family:inherit;font-size:15px;width:100%;background:#FFFFFF}
.chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:12px;font-weight:600;color:#344054}
.chip.on{border:0;background:#0B2A3C;color:#FFFFFF;font-weight:700}
.pt{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:#D0D5DD;line-height:20px}
.pt b{color:#FFFFFF}
.dot{width:28px;height:28px;border-radius:8px;background:rgba(255,214,0,.16);color:#FFD600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827; display: flex; flex-wrap: wrap">
  <section style="flex: 1 1 420px; background: #0B2A3C; color: #FFFFFF; padding: 48px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; align-items: center; gap: 12px"><span style="width: 48px; height: 48px; border-radius: 14px; background: #FFD600; color: #0B2A3C; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px">N</span><b style="font-size: 22px">NurMarket</b></div>
    <h1 style="margin: 0; font-size: 40px; line-height: 48px; font-weight: 800; max-width: 520px">Магазин в браузере — с любого компьютера</h1>
    <div style="display: flex; flex-direction: column; gap: 16px; max-width: 480px">
      <div class="pt"><span class="dot"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span><span><b>Веб-касса</b> — продавать без установки, сканер работает как клавиатура</span></div>
      <div class="pt"><span class="dot"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span><span><b>Админка</b> — товары, отчёты, сотрудники, сайт</span></div>
      <div class="pt"><span class="dot"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span><span><b>Те же данные</b>, что на кассе и в телефоне — один аккаунт NurCRM</span></div>
    </div>
  </section>

  <section style="flex: 1 1 420px; padding: 48px 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
    <form style="width: 100%; max-width: 420px; background: #FFFFFF; border-radius: 24px; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 24px 60px rgba(11,42,60,.12)">
      <b style="font-size: 24px; font-weight: 800">Вход</b>
      <span style="font-size: 14px; color: #667085; margin-top: -8px">Тот же логин, что в кассе</span>
      <label class="lbl" for="lg">Логин или телефон</label>
      <input id="lg" class="in" type="text" placeholder="[логин]">
      <label class="lbl" for="pw">Пароль</label>
      <input id="pw" class="in" type="password" value="password">
      <div style="display: flex; justify-content: space-between; align-items: center"><label style="display: flex; align-items: center; gap: 8px; font-size: 13px"><input type="checkbox" checked="" style="width: 18px; height: 18px; accent-color: #0B2A3C">Запомнить</label><a href="#" style="font-size: 13px; font-weight: 700">Забыли пароль?</a></div>
      <button type="button" style="height: 52px; border-radius: 14px; border: 0; background: #FFD600; color: #0B2A3C; font-family: inherit; font-size: 16px; font-weight: 800">Войти</button>
      <button type="button" style="height: 48px; border-radius: 14px; border: 1.5px solid #D0D5DD; background: #FFFFFF; color: #344054; font-family: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><path d="M14 14h3v3h-3z"></path></svg>Войти по QR с телефона</button>
      <div style="display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; padding-top: 4px"><button type="button" class="chip on">Рус</button><button type="button" class="chip">Кыр</button><button type="button" class="chip">Eng</button><button type="button" class="chip">Tür</button><button type="button" class="chip">O'zb</button></div>
    </form>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
