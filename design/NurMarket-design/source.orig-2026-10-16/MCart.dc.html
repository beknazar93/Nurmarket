<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Модалки — чек</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.m{background:#FFFFFF;border-radius:20px;box-shadow:0 24px 60px rgba(11,42,60,.22);display:flex;flex-direction:column;overflow:hidden}
.mh{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid #EAECF0}
.mt{flex-grow:1;display:flex;flex-direction:column;gap:2px}
.mt b{font-size:17px;font-weight:800}
.mt span{font-size:12px;color:#667085}
.x{width:36px;height:36px;border-radius:10px;border:1px solid #E5E7EB;background:#FFFFFF;font-size:15px;color:#344054;font-family:inherit}
.mb{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.mf{display:flex;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid #EAECF0;background:#FCFCFD}
.hint{flex-grow:1;font-size:12px;color:#667085}
.tot{flex-grow:1;font-size:13px;color:#475467}
.tot b{font-size:18px;color:#0B2A3C}
.b2{height:44px;padding:0 16px;border-radius:12px;border:1.5px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:14px;font-weight:700;color:#344054}
.b1{height:44px;padding:0 18px;border-radius:12px;border:0;background:#FFD600;font-family:inherit;font-size:14px;font-weight:800;color:#0B2A3C}
.lbl{font-size:12px;font-weight:700;color:#667085;letter-spacing:.03em}
.in{height:46px;box-sizing:border-box;border-radius:12px;border:1px solid #D0D5DD;padding:0 14px;font-family:inherit;font-size:15px}
.inb{height:52px;box-sizing:border-box;border-radius:12px;border:2px solid #0B2A3C;padding:0 14px;font-family:inherit;font-size:22px;font-weight:800;color:#0B2A3C}
.chip{height:38px;padding:0 14px;border-radius:19px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:13px;font-weight:600;color:#344054}
.row{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.soft{border-radius:12px;background:#F9FAFB;padding:12px 14px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opt{height:56px;border-radius:12px;border:1px solid #E5E7EB;background:#FFFFFF;font-family:inherit;font-size:15px;font-weight:700;color:#344054}
.opt.on{border:2px solid #0B2A3C;background:#FFF7CC;color:#0B2A3C;font-weight:800}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #DDE2E8; font-family: Montserrat, system-ui, sans-serif; color: #111827; padding: 40px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; align-items: start">

  <section class="m" role="dialog" aria-label="Скидка на чек">
    <div class="mh"><div class="mt"><b>Скидка на чек</b><span>Чек №1740 · 290 сом</span></div><button type="button" class="x" aria-label="Закрыть">✕</button></div>
    <div class="mb">
      <div class="seg"><button type="button" class="opt on">5 %</button><button type="button" class="opt">10 %</button><button type="button" class="opt">15 %</button></div>
      <label class="lbl" for="c1">СВОЯ СКИДКА</label>
      <div style="display: flex; gap: 8px"><input id="c1" class="in" type="text" value="5" style="flex-grow: 1"><button type="button" class="chip" style="background: #0B2A3C; color: #FFFFFF; border: 0">%</button><button type="button" class="chip">сом</button></div>
    </div>
    <div class="mf"><span class="tot">Итого: <b>276 сом</b></span><button type="button" class="b2">Отмена</button><button type="button" class="b1">Применить</button></div>
  </section>

  <section class="m" role="dialog" aria-label="Весовой товар">
    <div class="mh"><div class="mt"><b>картошка</b><span>Весовой товар · 70 сом за кг</span></div><button type="button" class="x" aria-label="Закрыть">✕</button></div>
    <div class="mb">
      <div class="soft" style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 13px; color: #475467">С весов</span><span style="font-size: 30px; font-weight: 800; color: #0B2A3C">1,250 кг</span></div>
      <label class="lbl" for="c2">ИЛИ ВПИШИТЕ ВЕС</label>
      <input id="c2" class="in" type="text" placeholder="0,000 кг">
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #0E7A3A; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 4px; background: #16A34A"></span>Весы подключены · вес стабилен</span>
    </div>
    <div class="mf"><span class="tot">Сумма: <b>87,50 сом</b></span><button type="button" class="b2">Отмена</button><button type="button" class="b1">В чек</button></div>
  </section>

  <section class="m" role="dialog" aria-label="Штука или упаковка">
    <div class="mh"><div class="mt"><b>Как продать?</b><span>Энергетик «Gorilla» ассорти 0,45</span></div><button type="button" class="x" aria-label="Закрыть">✕</button></div>
    <div class="mb">
      <button type="button" class="opt on" style="height: 72px; text-align: left; padding: 0 16px; display: flex; justify-content: space-between; align-items: center"><span>Штука</span><span>95 сом</span></button>
      <button type="button" class="opt" style="height: 72px; text-align: left; padding: 0 16px; display: flex; justify-content: space-between; align-items: center"><span>Упаковка · [N] шт</span><span>[цена]</span></button>
      <span style="font-size: 12px; color: #667085">← → — выбрать · Enter — в чек</span>
    </div>
    <div class="mf"><span class="hint"></span><button type="button" class="b2">Отмена</button><button type="button" class="b1">В чек</button></div>
  </section>

  <section class="m" role="dialog" aria-label="Доп. услуга">
    <div class="mh"><div class="mt"><b>Доп. услуга</b><span>Строка без товара со склада</span></div><button type="button" class="x" aria-label="Закрыть">✕</button></div>
    <div class="mb">
      <label class="lbl" for="c4">ЧТО</label>
      <input id="c4" class="in" type="text" placeholder="Доставка, упаковка, сборка…">
      <div style="display: flex; gap: 6px; flex-wrap: wrap"><button type="button" class="chip">Доставка</button><button type="button" class="chip">Пакет</button><button type="button" class="chip">Подарочная упаковка</button></div>
      <label class="lbl" for="c5">СУММА</label>
      <input id="c5" class="inb" type="text" value="[сумма]">
    </div>
    <div class="mf"><span class="hint">Попадёт в чек отдельной строкой</span><button type="button" class="b2">Отмена</button><button type="button" class="b1">Добавить</button></div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
