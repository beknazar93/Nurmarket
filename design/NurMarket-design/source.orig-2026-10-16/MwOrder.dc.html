<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Веб в телефоне — заказ с сайта</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.hb{width:44px;height:44px;border-radius:12px;border:0;background:#F2F4F7;color:#0B2A3C;display:flex;align-items:center;justify-content:center}
.rl{display:flex;justify-content:space-between;font-size:13px;padding:6px 0}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:700}
.step i{width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column">
  <header style="height: 60px; flex-shrink: 0; background: #FFFFFF; border-bottom: 1px solid #EAECF0; display: flex; align-items: center; gap: 10px; padding: 0 12px">
    <button type="button" class="hb" aria-label="Назад к заказам"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <b style="font-size: 16px; flex-grow: 1">Заказ [№]</b>
    <span style="font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 999px; background: #FEF3E2; color: #B54708">новый</span>
  </header>
  <main style="flex-grow: 1; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; gap: 2px; background: #FFFFFF; border-radius: 16px; padding: 12px 6px">
      <span class="step" style="color: #0B2A3C"><i style="background: #FFD600">1</i>Принят</span>
      <span class="step" style="color: #98A2B3"><i style="background: #F2F4F7">2</i>Собран</span>
      <span class="step" style="color: #98A2B3"><i style="background: #F2F4F7">3</i>Оплачен</span>
      <span class="step" style="color: #98A2B3"><i style="background: #F2F4F7">4</i>Выдан</span>
    </div>
    <section style="background: #FFFFFF; border-radius: 16px; padding: 10px 14px">
      <div class="rl"><span>Кока-Кола (ПЭТ) 2л × 2</span><b>340</b></div>
      <div class="rl"><span>Mars × 1</span><b>39</b></div>
      <div class="rl" style="border-top: 1px dashed #D0D5DD; margin-top: 4px; padding-top: 10px; font-size: 16px"><b>Итого</b><b style="color: #0B2A3C">379 сом</b></div>
    </section>
    <section style="background: #FFFFFF; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 13px">
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="color: #667085; font-size: 12px">Покупатель</span><b>[Клиент] · [телефон]</b></span>
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="color: #667085; font-size: 12px">Доставка</span><b>[адрес]</b></span>
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="color: #667085; font-size: 12px">Комментарий</span><span>[комментарий покупателя]</span></span>
    </section>
    <button type="button" style="height: 46px; border-radius: 14px; border: 1.5px solid #D0D5DD; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #344054">Написать покупателю в WhatsApp</button>
  </main>
  <div style="padding: 10px 16px 22px; display: flex; gap: 8px; background: #FFFFFF; border-top: 1px solid #EAECF0">
    <button type="button" style="height: 54px; padding: 0 16px; border-radius: 16px; border: 1.5px solid #FDE2E1; background: #FFFFFF; color: #B42318; font-family: inherit; font-size: 14px; font-weight: 700">Отменить</button>
    <button type="button" style="flex-grow: 1; height: 54px; border-radius: 16px; border: 0; background: #FFD600; color: #0B2A3C; font-family: inherit; font-size: 16px; font-weight: 800">Принять заказ</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
