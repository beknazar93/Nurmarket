<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Умная камера — проверка и загрузка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.card{background:#FFFFFF;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:10px}
.ph{width:44px;height:44px;border-radius:12px;flex-shrink:0}
.in{height:38px;box-sizing:border-box;border-radius:10px;border:1px solid #D0D5DD;padding:0 10px;font-family:inherit;font-size:13px;font-weight:700;width:100%;background:#FFFFFF}
.lbl{font-size:10px;font-weight:700;color:#667085;letter-spacing:.03em}
.tag{font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px}
.ex{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column">
  <header style="padding: 18px 16px 10px; display: flex; align-items: center; gap: 12px">
    <button type="button" aria-label="Назад к камере" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #E5E7EB; background: #FFFFFF; color: #344054; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <span style="display: flex; flex-direction: column; flex-grow: 1"><b style="font-size: 17px; font-weight: 800">Проверьте товары</b><span style="font-size: 12px; color: #667085">2 новых · 3 пополнить остаток</span></span>
  </header>

  <main style="flex-grow: 1; padding: 0 16px 10px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 8px; border-radius: 12px; background: #FFF7CC; padding: 8px 12px; font-size: 12px; color: #0B2A3C"><b>Наценка 30 %</b><span style="flex-grow: 1">· цена округляется до 5 сом</span><a href="#" style="font-weight: 700">Изменить</a></div>

    <span class="lbl">НОВЫЕ ТОВАРЫ</span>
    <section class="card">
      <div class="top"><span class="ph" style="background: #F59E0B"></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 13px">Сок Gracio яблочный 1л</b><span style="font-size: 11px; color: #667085">Штрихкод найден на этикетке</span></span><span class="tag" style="background: #E7F6EC; color: #0E7A3A">точно</span></div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
        <span style="display: flex; flex-direction: column; gap: 3px"><label class="lbl" for="b1">ЗАКУПКА</label><input id="b1" class="in" type="text" placeholder="[цена]"></span>
        <span style="display: flex; flex-direction: column; gap: 3px"><label class="lbl" for="s1">ПРОДАЖА</label><input id="s1" class="in" type="text" placeholder="авто"></span>
        <span style="display: flex; flex-direction: column; gap: 3px"><label class="lbl" for="q1">КОЛ-ВО</label><input id="q1" class="in" type="text" value="2"></span>
      </div>
    </section>
    <section class="card" style="border: 2px solid #FFD600">
      <div class="top"><span class="ph" style="background: #4ADE80"></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><label class="lbl" for="n2">НАЗВАНИЕ</label><input id="n2" class="in" type="text" placeholder="Камера не уверена — впишите"></span><span class="tag" style="background: #FEF3E2; color: #B54708">уточнить</span></div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
        <span style="display: flex; flex-direction: column; gap: 3px"><label class="lbl" for="b2">ЗАКУПКА</label><input id="b2" class="in" type="text" placeholder="[цена]"></span>
        <span style="display: flex; flex-direction: column; gap: 3px"><label class="lbl" for="s2">ПРОДАЖА</label><input id="s2" class="in" type="text" placeholder="авто"></span>
        <span style="display: flex; flex-direction: column; gap: 3px"><label class="lbl" for="q2">КОЛ-ВО</label><input id="q2" class="in" type="text" value="1"></span>
      </div>
    </section>

    <span class="lbl" style="padding-top: 4px">УЖЕ ЕСТЬ — ДОБАВИТЬ К ОСТАТКУ</span>
    <div class="ex"><span class="ph" style="width: 36px; height: 36px; background: #B91C1C"></span><span style="flex-grow: 1; font-size: 13px; font-weight: 600">Кока-Кола (ПЭТ) 2л</span><b style="font-size: 13px; color: #0E7A3A">+2</b></div>
    <div class="ex"><span class="ph" style="width: 36px; height: 36px; background: #7C2D12"></span><span style="flex-grow: 1; font-size: 13px; font-weight: 600">Mars</span><b style="font-size: 13px; color: #0E7A3A">+3</b></div>
    <div class="ex"><span class="ph" style="width: 36px; height: 36px; background: #FDE68A"></span><span style="flex-grow: 1; font-size: 13px; font-weight: 600">Макароны «Макфа» спагетти 450г</span><b style="font-size: 13px; color: #0E7A3A">+1</b></div>
    <label style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: #344054; padding-top: 2px"><input type="checkbox" checked="" style="width: 20px; height: 20px; accent-color: #0B2A3C">Поставить новым товарам фото с полки</label>
  </main>

  <div style="padding: 10px 16px 22px; display: flex; gap: 8px; background: #FFFFFF; border-top: 1px solid #EAECF0">
    <button type="button" style="height: 56px; padding: 0 16px; border-radius: 16px; border: 1.5px solid #D0D5DD; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #344054">Ещё снимок</button>
    <button type="button" style="flex-grow: 1; height: 56px; border-radius: 16px; border: 0; background: #FFD600; color: #0B2A3C; font-family: inherit; font-size: 16px; font-weight: 800">Загрузить 5 товаров</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
