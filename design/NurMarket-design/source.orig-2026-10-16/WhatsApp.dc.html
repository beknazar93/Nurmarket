<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WhatsApp</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827">
  <dc-import name="OwnerNav" group="clients" active="WhatsApp" hint-size="308px,900px"></dc-import>
  <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 24px; font-weight: 800">WhatsApp</span><span style="font-size: 13px; color: #667085">Напоминания и рассылки клиентам с вашего номера</span></span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #0E7A3A"><span style="width: 8px; height: 8px; border-radius: 4px; background: #16A34A"></span>Подключён · [номер]</span>
    </div>
    <div style="flex-grow: 1; min-height: 0; display: flex; gap: 14px">
      <section style="width: 380px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 15px; font-weight: 800">Шаблоны</span>
        <sc-for list="{{tpl}}" as="t" hint-placeholder-count="4">
          <button type="button" style="text-align: left; background: #FFFFFF; border-radius: 14px; border: {{t.border}}; padding: 14px; font-family: inherit; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; font-weight: 800">{{t.name}}</span><span style="font-size: 12px; color: #667085; line-height: 17px">{{t.text}}</span></button>
        </sc-for>
        <button type="button" style="height: 42px; border-radius: 12px; border: 1px dashed #98A2B3; background: transparent; font-family: inherit; font-size: 13px; font-weight: 700; color: #475467">+ Свой шаблон</button>
      </section>
      <section style="flex-grow: 1; min-width: 0; background: #FFFFFF; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
        <span style="font-size: 16px; font-weight: 800">Напоминание о долге</span>
        <label for="waText" style="font-size: 13px; font-weight: 600; color: #344054">Текст</label>
        <textarea id="waText" style="height: 120px; box-sizing: border-box; border-radius: 12px; border: 1px solid #D0D5DD; padding: 12px; font-family: inherit; font-size: 14px; line-height: 21px; resize: none">Здравствуйте, {имя}! Напоминаем о долге в магазине NBS: {сумма} сом. Оплатить можно на кассе или переводом. Спасибо!</textarea>
        <span style="font-size: 12px; color: #667085">{имя} и {сумма} подставятся для каждого клиента</span>
        <span style="font-size: 13px; font-weight: 700; color: #344054; margin-top: 6px">Кому</span>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <button type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: #0B2A3C; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700">Должники с номером · [N]</button>
          <button type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #344054; font-family: inherit; font-size: 13px; font-weight: 600">Долг старше 30 дней · [N]</button>
          <button type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #344054; font-family: inherit; font-size: 13px; font-weight: 600">Выбрать вручную</button>
        </div>
        <div style="margin-top: auto; display: flex; align-items: center; gap: 12px; border-top: 1px solid #F2F4F7; padding-top: 14px">
          <span style="flex-grow: 1; font-size: 13px; color: #667085">Без номера: 1 клиент (Умар) — не получит</span>
          <button type="button" style="height: 46px; padding: 0 18px; border-radius: 12px; border: 1.5px solid #D0D5DD; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #344054">Пробное себе</button>
          <button type="button" style="height: 46px; padding: 0 20px; border-radius: 12px; border: 0; background: #FFD600; font-family: inherit; font-size: 14px; font-weight: 800; color: #0B2A3C">Отправить [N] клиентам</button>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { tpl: [
      { name: 'Напоминание о долге', text: 'Имя и сумма долга подставятся сами', border: '2px solid #0B2A3C' },
      { name: 'Срок проката', text: 'Что и до какого дня вернуть, штраф за просрочку', border: '1px solid #E5E7EB' },
      { name: 'Заказ готов', text: 'Номер заказа и где забрать', border: '1px solid #E5E7EB' },
      { name: 'Акция', text: 'Свой текст для всех клиентов', border: '1px solid #E5E7EB' }
    ] };
  }
}
</script>
</body>
</html>
