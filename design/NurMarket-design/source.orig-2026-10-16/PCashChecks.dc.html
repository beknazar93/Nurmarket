<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Чеки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#FFFFFF;border-top:1px solid #EAECF0;padding:8px 6px 14px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#667085;text-decoration:none;padding:6px 0}
.nav a.on{color:#0B2A3C;font-weight:800}
.nav a.on span{background:#FFD600}
.nav span{width:44px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.seg{flex-grow:1;height:38px;border-radius:10px;border:0;font-family:inherit;font-size:13px;font-weight:700}
.ck{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:#FFFFFF;border:0;font-family:inherit;text-align:left;width:100%}
.mi{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column">
  <header style="padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 10px">
    <b style="font-size: 20px; font-weight: 800">Мои чеки</b>
    <span style="display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: #E4E7EC">
      <button type="button" class="seg" style="background: #FFFFFF; color: #0B2A3C; box-shadow: 0 1px 2px rgba(16,24,40,.08)">Эта смена</button>
      <button type="button" class="seg" style="background: transparent; color: #475467">Отложенные · 1</button>
    </span>
    <label style="height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 12px; border: 1px solid #E5E7EB; background: #FFFFFF">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input type="text" placeholder="Номер чека или товар" aria-label="Поиск чека" style="border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 14px; width: 100%">
    </label>
  </header>

  <main style="flex-grow: 1; padding: 0 16px 12px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
    <span style="font-size: 12px; font-weight: 700; color: #667085">СЕГОДНЯ</span>
    <sc-for list="{{checks}}" as="c" hint-placeholder-count="6">
      <button type="button" class="ck">
        <span class="mi" style="background: {{c.bg}}; color: {{c.fg}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg></span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><b style="font-size: 14px">Чек {{c.no}}</b><span style="font-size: 12px; color: #667085; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.items}}</span></span>
        <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px"><b style="font-size: 15px; color: #0B2A3C">{{c.sum}}</b><span style="font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: {{c.sbg}}; color: {{c.sfg}}">{{c.state}}</span></span>
      </button>
    </sc-for>
  </main>

  <nav class="nav" aria-label="Разделы кассира">
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 4h2l2.5 11h11L21 7H6.5"></path><circle cx="9" cy="19.5" r="1.5"></circle><circle cx="17" cy="19.5" r="1.5"></circle></svg></span>Продажа</a>
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path><path d="M8 9v6M12 9v6M16 9v6"></path></svg></span>Сканер</a>
    <a href="#" class="on"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg></span>Чеки</a>
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg></span>Склад</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cash = 'M2 6h20v12H2zM12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5';
    const card = 'M2 5h20v14H2zM2 10h20';
    const qr = 'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3z';
    const ok = { state: 'отправлен', sbg: '#E7F6EC', sfg: '#0E7A3A' };
    const wait = { state: 'ждёт связи', sbg: '#FEF3E2', sfg: '#B54708' };
    const ret = { state: 'возврат', sbg: '#FDE2E1', sfg: '#B42318' };
    const c = (no, items, sum, icon, bg, fg, st) => Object.assign({ no, items, sum, icon, bg, fg }, st);
    return {
      checks: [
        c('[№]', 'Макароны «Макфа» × 2, Mars', '209 сом', cash, '#FFF7CC', '#0B2A3C', wait),
        c('[№]', 'Кока-Кола (ПЭТ) 2л', '170 сом', card, '#E7EEF3', '#0B2A3C', ok),
        c('[№]', 'Mars × 3', '117 сом', qr, '#F2F4F7', '#344054', ok),
        c('[№]', 'Макароны «Макфа» спагетти 450г', '85 сом', cash, '#FFF7CC', '#0B2A3C', ok),
        c('[№]', 'Кока-Кола (ПЭТ) 2л × 2', '340 сом', card, '#E7EEF3', '#0B2A3C', ok),
        c('[№]', 'Mars', '−39 сом', cash, '#FDE2E1', '#B42318', ret)
      ]
    };
  }
}
</script>
</body>
</html>
