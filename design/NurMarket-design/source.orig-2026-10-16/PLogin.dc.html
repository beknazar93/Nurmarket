<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход и выбор магазина</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.lbl{font-size:12px;font-weight:700;color:#667085}
.in{height:52px;box-sizing:border-box;border-radius:14px;border:1px solid #D0D5DD;padding:0 14px;font-family:inherit;font-size:15px;width:100%;background:#FFFFFF}
.shop{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid #E5E7EB;background:#FFFFFF;font-family:inherit;text-align:left;width:100%}
.shop.on{border:2px solid #0B2A3C;background:#FFF7CC}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column">
  <section style="background: #0B2A3C; color: #FFFFFF; padding: 40px 24px 28px; border-radius: 0 0 28px 28px; display: flex; flex-direction: column; gap: 10px">
    <span style="width: 52px; height: 52px; border-radius: 16px; background: #FFD600; color: #0B2A3C; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 24px">N</span>
    <b style="font-size: 24px; font-weight: 800">NurMarket</b>
    <span style="font-size: 13px; color: #C7D2DB">Тот же вход, что на кассе и в вебе</span>
  </section>
  <main style="flex-grow: 1; padding: 20px; display: flex; flex-direction: column; gap: 10px">
    <label class="lbl" for="l1">Логин или телефон</label>
    <input id="l1" class="in" type="text" placeholder="[логин]">
    <label class="lbl" for="l2">Пароль или код кассира</label>
    <input id="l2" class="in" type="password" value="password">
    <span class="lbl" style="padding-top: 6px">МАГАЗИН</span>
    <button type="button" class="shop on"><span style="width: 36px; height: 36px; border-radius: 10px; background: #0B2A3C; color: #FFD600; display: flex; align-items: center; justify-content: center; font-weight: 800">N</span><span style="flex-grow: 1; display: flex; flex-direction: column"><b style="font-size: 14px">NBS · главный</b><span style="font-size: 12px; color: #667085">Кассир</span></span></button>
    <button type="button" class="shop"><span style="width: 36px; height: 36px; border-radius: 10px; background: #F2F4F7; color: #0B2A3C; display: flex; align-items: center; justify-content: center; font-weight: 800">Ф</span><span style="flex-grow: 1; display: flex; flex-direction: column"><b style="font-size: 14px">[Филиал]</b><span style="font-size: 12px; color: #667085">Кассир</span></span></button>
  </main>
  <div style="padding: 0 20px 26px; display: flex; flex-direction: column; gap: 10px">
    <button type="button" style="height: 56px; border-radius: 16px; border: 0; background: #FFD600; color: #0B2A3C; font-family: inherit; font-size: 17px; font-weight: 800">Войти</button>
    <button type="button" style="height: 48px; border-radius: 14px; border: 1.5px solid #D0D5DD; background: #FFFFFF; color: #344054; font-family: inherit; font-size: 14px; font-weight: 700">Войти по QR с экрана кассы</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
