<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сайт и бот — веб</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.card{background:#FFFFFF;border:1px solid #E5E7EB;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pill{height:34px;padding:0 12px;border-radius:17px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:12px;font-weight:700;color:#344054}
.pill.on{border:0;background:#0B2A3C;color:#FFFFFF}
.th{border:1px solid #E5E7EB;border-radius:14px;overflow:hidden;background:#FFFFFF;font-family:inherit;padding:0;text-align:left;display:flex;flex-direction:column}
.th.on{border:2px solid #0B2A3C}
.b1{height:44px;padding:0 18px;border-radius:12px;border:0;background:#FFD600;font-family:inherit;font-size:14px;font-weight:800;color:#0B2A3C}
.b2{height:44px;padding:0 14px;border-radius:12px;border:1.5px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:13px;font-weight:700;color:#344054}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827; display: flex; flex-wrap: wrap">
  <div style="flex: 1 1 240px; max-width: 260px; display: flex"><dc-import name="WebNav" active="Сайт и бот" hint-size="260px,900px"></dc-import></div>
  <main style="flex: 999 1 560px; min-width: 0; padding: 22px 28px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
      <span style="display: flex; flex-direction: column; flex-grow: 1"><b style="font-size: 24px; font-weight: 800">Сайт и бот</b><span style="font-size: 13px; color: #667085">Витрина: market.nurcrm.kg · есть неопубликованные изменения</span></span>
      <button type="button" class="b2">Смотреть сайт</button>
      <button type="button" class="b1">Опубликовать</button>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
      <section class="card" style="flex: 999 1 520px">
        <b style="font-size: 16px">Тема сайта</b>
        <div style="display: flex; flex-wrap: wrap; gap: 6px"><button type="button" class="pill">Все</button><button type="button" class="pill on">Одежда и обувь</button><button type="button" class="pill">Продукты</button><button type="button" class="pill">Профессиональные</button><button type="button" class="pill">Для любого магазина</button></div>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px">
          <sc-for list="{{themes}}" as="t" hint-placeholder-count="4">
            <button type="button" class="th" style="border: {{t.border}}">
              <span style="height: 92px; background: {{t.bg}}; display: flex; flex-direction: column; gap: 6px; padding: 8px; box-sizing: border-box">
                <span style="height: 12px; border-radius: 3px; background: {{t.header}}"></span>
                <span style="flex-grow: 1; border-radius: 4px; background: {{t.hero}}"></span>
                <span style="display: flex; gap: 4px"><span style="flex-grow: 1; height: 14px; border-radius: 3px; background: {{t.accent}}"></span><span style="flex-grow: 1; height: 14px; border-radius: 3px; background: {{t.accent}}"></span><span style="flex-grow: 1; height: 14px; border-radius: 3px; background: {{t.accent}}"></span></span>
              </span>
              <span style="padding: 8px 10px; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 13px">{{t.name}}</b><span style="font-size: 11px; color: #667085">{{t.note}}</span></span>
            </button>
          </sc-for>
        </div>
      </section>

      <aside style="flex: 1 1 300px; max-width: 380px; display: flex; flex-direction: column; gap: 12px">
        <section class="card">
          <div style="display: flex; align-items: center; gap: 10px"><span style="width: 40px; height: 40px; border-radius: 12px; background: #E3F2FD; color: #1D4ED8; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4 3 11l6 2 2 6 3-4 5 4z"></path></svg></span><span style="flex-grow: 1; display: flex; flex-direction: column"><b style="font-size: 14px">Telegram-бот</b><span style="font-size: 12px; color: #0E7A3A; font-weight: 700">работает · отвечает ИИ</span></span></div>
          <span style="font-size: 13px; color: #475467; line-height: 19px">Покупатели спрашивают цену и наличие, бот отвечает и принимает заказ.</span>
          <button type="button" class="b2">Вопросы покупателей · [N]</button>
        </section>
        <section class="card">
          <div style="display: flex; align-items: center; gap: 10px"><span style="width: 40px; height: 40px; border-radius: 12px; background: #E7F6EC; color: #0E7A3A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l1.6-4.7A8.5 8.5 0 1 1 7.7 19.4z"></path></svg></span><span style="flex-grow: 1; display: flex; flex-direction: column"><b style="font-size: 14px">WhatsApp</b><span style="font-size: 12px; color: #667085">чеки и напоминания о долгах</span></span></div>
          <button type="button" class="b2">Шаблоны сообщений</button>
        </section>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const t = (name, note, bg, header, hero, accent, on) => ({ name, note, bg, header, hero, accent, border: on ? '2px solid #0B2A3C' : '1px solid #E5E7EB' });
    return {
      themes: [
        t('Ателье', 'выбрана', '#FAF6F1', '#FAF6F1', '#E8D5C8', '#9A4A2F', true),
        t('Стритвир', 'тёмная', '#0E0E10', '#18181B', '#3A4A10', '#C6F432'),
        t('Детский', 'пастель', '#FFF8F0', '#FFFFFF', '#F7D4DD', '#C2255C'),
        t('Бутик', 'чёрно-белая', '#FFFFFF', '#FFFFFF', '#E5E0D8', '#111111')
      ]
    };
  }
}
</script>
</body>
</html>
