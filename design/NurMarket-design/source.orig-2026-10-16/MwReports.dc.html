<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Веб в телефоне — отчёты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.hb{width:44px;height:44px;border-radius:12px;border:0;background:#F2F4F7;color:#0B2A3C;display:flex;align-items:center;justify-content:center}
.chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:12px;font-weight:600;color:#344054;white-space:nowrap}
.chip.on{border:0;background:#0B2A3C;color:#FFFFFF}
.kpi{background:#FFFFFF;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.kpi span{font-size:11px;color:#667085;font-weight:600}
.kpi b{font-size:17px;font-weight:800;color:#0B2A3C}
.ab{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #F2F4F7;font-size:13px}
.g{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column">
  <header style="height: 60px; flex-shrink: 0; background: #FFFFFF; border-bottom: 1px solid #EAECF0; display: flex; align-items: center; gap: 10px; padding: 0 12px">
    <button type="button" class="hb" aria-label="Открыть меню"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
    <b style="font-size: 16px; flex-grow: 1">Прибыль и отчёты</b>
    <button type="button" class="hb" aria-label="Скачать Excel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"></path></svg></button>
  </header>
  <main style="flex-grow: 1; padding: 10px 16px 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
    <div style="display: flex; gap: 6px; overflow: hidden"><button type="button" class="chip on">Прибыль</button><button type="button" class="chip">ABC</button><button type="button" class="chip">В убыток</button><button type="button" class="chip">Кассиры</button></div>
    <div style="display: flex; gap: 6px; overflow: hidden"><button type="button" class="chip">Сегодня</button><button type="button" class="chip on">Месяц</button><button type="button" class="chip">Свой период</button></div>
    <section style="border-radius: 18px; background: #0B2A3C; color: #FFFFFF; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #C7D2DB">Чистая прибыль</span><b style="font-size: 26px; color: #FFD600">[сумма]</b></section>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <div class="kpi"><span>Выручка</span><b>[сумма]</b></div>
      <div class="kpi"><span>Себест.</span><b>[сумма]</b></div>
      <div class="kpi"><span>Расходы</span><b>[сумма]</b></div>
    </div>
    <section style="background: #FFFFFF; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
      <b style="font-size: 14px">По дням</b>
      <div style="height: 100px; display: flex; align-items: flex-end; gap: 4px"><sc-for list="{{bars}}" as="b" hint-placeholder-count="10"><span style="flex-grow: 1; height: {{b.r}}; border-radius: 3px 3px 0 0; background: #CBD5E1; display: flex; align-items: flex-end"><span style="width: 100%; height: {{b.p}}; background: #0B2A3C; border-radius: 3px 3px 0 0"></span></span></sc-for></div>
    </section>
    <section style="background: #FFFFFF; border-radius: 16px; padding: 6px 14px">
      <div class="ab"><span class="g" style="background: #E7F6EC; color: #0E7A3A">A</span><span style="flex-grow: 1">[N] товаров</span><b>80 % выручки</b></div>
      <div class="ab"><span class="g" style="background: #FFF7CC; color: #0B2A3C">B</span><span style="flex-grow: 1">[N] товаров</span><b>15 %</b></div>
      <div class="ab" style="border: 0"><span class="g" style="background: #F2F4F7; color: #475467">C</span><span style="flex-grow: 1">[N] товаров</span><b>5 %</b></div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const r = [55, 70, 45, 80, 65, 90, 75, 60, 85, 95];
    return { bars: r.map((v) => ({ r: v + '%', p: Math.round(v * 0.32) + '%' })) };
  }
}
</script>
</body>
</html>
