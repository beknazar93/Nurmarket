<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Касса — удаление из чека: причина, PIN, контроль</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.m{background:#FFFFFF;border-radius:20px;box-shadow:0 24px 60px rgba(11,42,60,.22);display:flex;flex-direction:column;overflow:hidden}
.mh{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #EAECF0}
.mt{flex-grow:1;display:flex;flex-direction:column;gap:2px}
.mt b{font-size:16px;font-weight:800}
.mt span{font-size:12px;color:#667085}
.x{width:34px;height:34px;border-radius:10px;border:1px solid #E5E7EB;background:#FFFFFF;font-size:14px;color:#344054;font-family:inherit}
.mb{padding:14px 20px;display:flex;flex-direction:column;gap:8px}
.mf{display:flex;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid #EAECF0;background:#FCFCFD}
.tot{flex-grow:1;font-size:12px;color:#475467}
.tot b{font-size:14px;color:#0B2A3C}
.b2{height:42px;padding:0 14px;border-radius:12px;border:1.5px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:13px;font-weight:700;color:#344054}
.b1{height:42px;padding:0 16px;border-radius:12px;border:0;background:#FFD600;font-family:inherit;font-size:13px;font-weight:800;color:#0B2A3C}
.bd{height:42px;padding:0 16px;border-radius:12px;border:0;background:#C0362C;font-family:inherit;font-size:13px;font-weight:800;color:#FFFFFF}
.lbl{font-size:11px;font-weight:700;color:#667085;letter-spacing:.03em}
.in{height:42px;box-sizing:border-box;border-radius:10px;border:1px solid #D0D5DD;padding:0 12px;font-family:inherit;font-size:14px;width:100%;background:#FFFFFF}
.big{height:52px;font-size:20px;font-weight:800;border:2px solid #0B2A3C}
.chip{height:34px;padding:0 10px;border-radius:17px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:12px;font-weight:600;color:#344054;white-space:nowrap}
.chip.on{border:0;background:#0B2A3C;color:#FFFFFF;font-weight:700}
.sg{display:flex;gap:4px;padding:4px;border-radius:12px;background:#E4E7EC}
.seg{flex-grow:1;height:40px;border-radius:10px;border:0;font-family:inherit;font-size:13px;font-weight:700;background:transparent;color:#475467}
.seg.on{background:#FFFFFF;color:#0B2A3C;box-shadow:0 1px 2px rgba(16,24,40,.08)}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#F9FAFB;font-size:13px}
.rl{display:flex;justify-content:space-between;font-size:13px;padding:5px 0}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
.card{background:#FFFFFF;border:1px solid #E5E7EB;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.kpi{background:#FFFFFF;border:1px solid #E5E7EB;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi span{font-size:12px;font-weight:600;color:#667085}
.kpi b{font-size:22px;font-weight:800;color:#0B2A3C}
.nv{width:44px;height:44px;border-radius:14px;border:1px solid #E5E7EB;background:#FFFFFF;color:#344054;display:flex;align-items:center;justify-content:center}
.pc{background:#FFFFFF;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.cta{height:56px;border-radius:16px;border:0;background:#FFD600;color:#0B2A3C;font-family:inherit;font-size:17px;font-weight:800;width:100%}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #DDE2E8; font-family: Montserrat, system-ui, sans-serif; color: #111827; padding: 30px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; align-items: start">

  <section class="m" role="dialog" aria-label="Убрать из чека">
    <div class="mh"><div class="mt"><b>Убрать из чека?</b><span>Сигареты [марка] · 2 шт · 560</span></div><button type="button" class="x" aria-label="Закрыть">✕</button></div>
    <div class="mb">
      <span class="lbl">ПРИЧИНА — ПОПАДЁТ В ОТЧЁТ</span>
      <button type="button" class="chip on" style="height: 44px; border-radius: 12px; text-align: left; padding: 0 14px">Покупатель передумал</button>
      <button type="button" class="chip" style="height: 44px; border-radius: 12px; text-align: left; padding: 0 14px">Ошибка сканирования</button>
      <button type="button" class="chip" style="height: 44px; border-radius: 12px; text-align: left; padding: 0 14px">Не хватило денег</button>
      <button type="button" class="chip" style="height: 44px; border-radius: 12px; text-align: left; padding: 0 14px">Брак или просрочка</button>
      <input class="in" type="text" placeholder="Другое — напишите" aria-label="Другая причина">
      <div class="sg"><button type="button" class="seg on" style="height: 36px">Всю строку</button><button type="button" class="seg" style="height: 36px">Только 1 шт</button></div>
    </div>
    <div class="mf"><button type="button" class="b2">Оставить</button><span class="tot"></span><button type="button" class="bd">Убрать</button></div>
  </section>

  <section class="m" role="dialog" aria-label="Подтверждение администратора">
    <div class="mh"><div class="mt"><b>Нужен PIN администратора</b><span>Удаление после пречека</span></div><button type="button" class="x" aria-label="Закрыть">✕</button></div>
    <div class="mb">
      <div class="row" style="background: #FEF3E2"><span style="flex-grow: 1">Чек уже распечатан как пречек — удаление увидит владелец</span></div>
      <div style="display: flex; justify-content: center; gap: 12px; padding: 8px 0"><span style="width: 14px; height: 14px; border-radius: 50%; background: #0B2A3C"></span><span style="width: 14px; height: 14px; border-radius: 50%; background: #0B2A3C"></span><span style="width: 14px; height: 14px; border-radius: 50%; border: 2px solid #D0D5DD; box-sizing: border-box"></span><span style="width: 14px; height: 14px; border-radius: 50%; border: 2px solid #D0D5DD; box-sizing: border-box"></span></div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px"><button type="button" class="b2" style="height: 46px; font-size: 18px">1</button><button type="button" class="b2" style="height: 46px; font-size: 18px">2</button><button type="button" class="b2" style="height: 46px; font-size: 18px">3</button><button type="button" class="b2" style="height: 46px; font-size: 18px">4</button><button type="button" class="b2" style="height: 46px; font-size: 18px">5</button><button type="button" class="b2" style="height: 46px; font-size: 18px">6</button><button type="button" class="b2" style="height: 46px; font-size: 18px">7</button><button type="button" class="b2" style="height: 46px; font-size: 18px">8</button><button type="button" class="b2" style="height: 46px; font-size: 18px">9</button><button type="button" class="b2" style="height: 46px; font-size: 18px">⌫</button><button type="button" class="b2" style="height: 46px; font-size: 18px">0</button><button type="button" class="b2" style="height: 46px; font-size: 18px">OK</button></div>
      <button type="button" class="b2" style="display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"></path></svg>Запросить с телефона админа</button>
    </div>
  </section>

  <section class="m" role="dialog" aria-label="Контроль удалений">
    <div class="mh"><div class="mt"><b>Контроль удалений</b><span>Настройки → Касса · для всех касс</span></div><button type="button" class="x" aria-label="Закрыть">✕</button></div>
    <div class="mb">
      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px"><input type="checkbox" checked="" style="width: 18px; height: 18px; accent-color: #0B2A3C">Спрашивать причину удаления</label>
      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px"><input type="checkbox" checked="" style="width: 18px; height: 18px; accent-color: #0B2A3C">PIN админа после пречека</label>
      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px"><input type="checkbox" checked="" style="width: 18px; height: 18px; accent-color: #0B2A3C">PIN админа, если удаляют больше чем на</label>
      <input class="in" type="text" value="1 000" aria-label="Сумма для PIN" style="margin-left: 26px; width: calc(100% - 26px)">
      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px"><input type="checkbox" checked="" style="width: 18px; height: 18px; accent-color: #0B2A3C">PIN на «Очистить чек» и отмену чека</label>
      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px"><input type="checkbox" checked="" style="width: 18px; height: 18px; accent-color: #0B2A3C">Сообщать мне в Telegram, если за смену больше</label>
      <input class="in" type="text" value="10 удалений" aria-label="Порог удалений" style="margin-left: 26px; width: calc(100% - 26px)">
      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px"><input type="checkbox" checked="" style="width: 18px; height: 18px; accent-color: #0B2A3C">Удалённое — строкой в отчёте смены</label>
    </div>
    <div class="mf"><button type="button" class="b2">Отмена</button><span class="tot"></span><button type="button" class="b1">Сохранить</button></div>
  </section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>

</body>
</html>
