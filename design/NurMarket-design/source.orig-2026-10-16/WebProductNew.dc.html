<!doctype html>
<html lang="ru">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.m{background:#FFFFFF;border-radius:20px;box-shadow:0 24px 60px rgba(11,42,60,.22);display:flex;flex-direction:column;overflow:hidden}
.mh{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #EAECF0}
.mt{flex-grow:1;display:flex;flex-direction:column;gap:2px}
.mt b{font-size:16px;font-weight:800}
.mt span{font-size:12px;color:#667085}
.x{width:34px;height:34px;border-radius:10px;border:1px solid #E5E7EB;background:#FFFFFF;font-size:14px;color:#344054;font-family:inherit}
.mb{padding:14px 20px;display:flex;flex-direction:column;gap:8px}
.mf{display:flex;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid #EAECF0;background:#FCFCFD}
.tot{flex-grow:1;font-size:12px;color:#475467}
.tot b{font-size:14px;color:#0B2A3C}
.b2{height:42px;padding:0 14px;border-radius:12px;border:1.5px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:13px;font-weight:700;color:#344054}
.b1{height:42px;padding:0 16px;border-radius:12px;border:0;background:#FFD600;font-family:inherit;font-size:13px;font-weight:800;color:#0B2A3C}
.bd{height:42px;padding:0 16px;border-radius:12px;border:0;background:#C0362C;font-family:inherit;font-size:13px;font-weight:800;color:#FFFFFF}
.lbl{font-size:11px;font-weight:700;color:#667085;letter-spacing:.03em}
.in{height:42px;box-sizing:border-box;border-radius:10px;border:1px solid #D0D5DD;padding:0 12px;font-family:inherit;font-size:14px;width:100%;background:#FFFFFF}
.big{height:52px;font-size:20px;font-weight:800;border:2px solid #0B2A3C}
.chip{height:34px;padding:0 10px;border-radius:17px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:12px;font-weight:600;color:#344054;white-space:nowrap}
.chip.on{border:0;background:#0B2A3C;color:#FFFFFF;font-weight:700}
.sg{display:flex;gap:4px;padding:4px;border-radius:12px;background:#E4E7EC}
.seg{flex-grow:1;height:40px;border-radius:10px;border:0;font-family:inherit;font-size:13px;font-weight:700;background:transparent;color:#475467}
.seg.on{background:#FFFFFF;color:#0B2A3C;box-shadow:0 1px 2px rgba(16,24,40,.08)}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#F9FAFB;font-size:13px}
.rl{display:flex;justify-content:space-between;font-size:13px;padding:5px 0}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
.card{background:#FFFFFF;border:1px solid #E5E7EB;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.kpi{background:#FFFFFF;border:1px solid #E5E7EB;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi span{font-size:12px;font-weight:600;color:#667085}
.kpi b{font-size:22px;font-weight:800;color:#0B2A3C}
.nv{width:44px;height:44px;border-radius:14px;border:1px solid #E5E7EB;background:#FFFFFF;color:#344054;display:flex;align-items:center;justify-content:center}
.pc{background:#FFFFFF;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.cta{height:56px;border-radius:16px;border:0;background:#FFD600;color:#0B2A3C;font-family:inherit;font-size:17px;font-weight:800;width:100%}
</style>

<div style="min-height: 900px; box-sizing: border-box; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827; display: flex; flex-wrap: wrap">
  <div style="flex: 1 1 240px; max-width: 260px; display: flex"><dc-import name="WebNav" active="Товары и склад" hint-size="260px,900px"></dc-import></div>
  <main style="flex: 999 1 560px; min-width: 0; padding: 22px 28px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">

    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
      <span style="display: flex; flex-direction: column; flex-grow: 1"><b style="font-size: 24px; font-weight: 800">Новый товар</b><span style="font-size: 13px; color: #667085">Товары и склад › новый · сохранится на всех кассах, телефонах и на сайте</span></span>
      <button type="button" class="b2">Отмена</button><button type="button" class="b1">Сохранить товар</button>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
      <section class="card" style="flex: 999 1 520px">
        <div style="display: flex; gap: 8px; flex-wrap: wrap"><input class="in" type="text" placeholder="Штрихкод или название — найдём в интернете" aria-label="Поиск товара в интернете" style="flex: 1 1 260px; height: 48px"><button type="button" class="b1" style="height: 48px; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>Найти в интернете</button></div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px">
          <span style="display: flex; flex-direction: column; gap: 4px"><label class="lbl" for="w1">НАЗВАНИЕ</label><input id="w1" class="in" type="text" value="Сок Gracio яблочный 1л"></span>
          <span style="display: flex; flex-direction: column; gap: 4px"><label class="lbl" for="w2">ШТРИХКОД</label><input id="w2" class="in" type="text" value="4870001234567"></span>
          <span style="display: flex; flex-direction: column; gap: 4px"><label class="lbl" for="w3">КАТЕГОРИЯ</label><input id="w3" class="in" type="text" value="Напитки"></span>
          <span style="display: flex; flex-direction: column; gap: 4px"><label class="lbl" for="w4">СКЛАД</label><input id="w4" class="in" type="text" value="Продукты"></span>
          <span style="display: flex; flex-direction: column; gap: 4px"><label class="lbl" for="w5">ЗАКУПКА</label><input id="w5" class="in" type="text" placeholder="[цена]"></span>
          <span style="display: flex; flex-direction: column; gap: 4px"><label class="lbl" for="w6">ЦЕНА ПРОДАЖИ</label><input id="w6" class="in" type="text" placeholder="авто +30 %" style="border: 2px solid #0B2A3C"></span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px"><label class="lbl" for="w7">ОПИСАНИЕ</label><span style="display: flex; gap: 6px"><button type="button" class="chip" style="display: flex; align-items: center; gap: 4px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path></svg>Написать с Нур Советником</button><button type="button" class="chip">На кыргызском</button></span></div>
        <textarea id="w7" style="min-height: 120px; box-sizing: border-box; border-radius: 10px; border: 1px solid #D0D5DD; padding: 12px; font-family: inherit; font-size: 14px; line-height: 21px; resize: vertical">Яблочный сок прямого отжима, 1 литр. Без добавления сахара. Хранить при температуре до +25 °C, после вскрытия — в холодильнике до 3 дней.</textarea>
        <label style="display: flex; align-items: center; gap: 8px; font-size: 13px"><input type="checkbox" checked="" style="width: 18px; height: 18px; accent-color: #0B2A3C">Показывать на сайте-витрине и в Telegram-боте</label>
      </section>
      <aside class="card" style="flex: 1 1 300px; max-width: 380px">
        <b style="font-size: 15px">Фото</b>
        <div style="border: 2px dashed #D0D5DD; border-radius: 14px; padding: 18px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center"><b style="font-size: 13px">Перетащите фото сюда</b><span style="font-size: 12px; color: #667085">или вставьте из буфера · Ctrl+V</span></div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><span style="height: 90px; border-radius: 10px; background: #FFEBD6; border: 2px solid #0B2A3C"></span><span style="height: 90px; border-radius: 10px; background: #FFF4C2"></span><span style="height: 90px; border-radius: 10px; background: #F2F4F7"></span></div>
        <button type="button" class="b2" style="display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>Подобрать фото в интернете</button>
        <span class="lbl" style="padding-top: 6px">НАЙДЕНО В ИНТЕРНЕТЕ</span>
        <div class="row" style="background: #FFF7CC"><span style="flex-grow: 1"><b>Сок Gracio яблочный 1л</b><br><span style="font-size: 11px; color: #667085">[сайт] · штрихкод совпал</span></span><button type="button" class="chip on">Взять</button></div>
        <div class="row"><span style="flex-grow: 1"><b>Gracio Apple Juice 1L</b><br><span style="font-size: 11px; color: #667085">[сайт] · похожее</span></span><button type="button" class="chip">Взять</button></div>
      </aside>
    </div>

  </main>
</div>
