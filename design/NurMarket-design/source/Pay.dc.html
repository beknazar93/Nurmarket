<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Оплата — панель справа</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; font-family: Montserrat, system-ui, sans-serif; color: #111827">
  <!-- 16.10.2026: панель 440 px справа, чек сдвинут влево и остаётся виден; затемнены только шапка и каталог -->
  <dc-import name="Main" mode="pay" hint-size="1440px,900px"></dc-import>
  <div style="position: absolute; left: 0; top: 0; width: 1000px; height: 72px; background: rgba(11,42,60,0.45)"></div>
  <div style="position: absolute; left: 0; top: 72px; width: 600px; height: 828px; background: rgba(11,42,60,0.45)"></div>

  <!-- Панель оплаты -->
  <section aria-label="Оплата чека" style="position: absolute; top: 0; right: 0; width: 440px; height: 900px; box-sizing: border-box; background: #FFFFFF; box-shadow: -12px 0 40px rgba(11,42,60,0.25); display: flex; flex-direction: column">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid #EAECF0">
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 19px; font-weight: 800">Оплата чека</span><span style="font-size: 13px; color: #475467">Чек № 1710 · 5 позиций · 10 шт</span></div>
      <button type="button" aria-label="Закрыть · Esc" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E5E7EB; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#344054" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </header>

    <div style="flex-grow: 1; overflow: hidden; padding: 14px 20px; display: flex; flex-direction: column; gap: 12px">
      <div style="border-radius: 16px; background: #0B2A3C; color: #FFFFFF; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center">
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #C7D2DB">К оплате</span><span style="font-size: 30px; font-weight: 800; color: #FFD600">650 сом</span></span>
        <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 13px; color: #C7D2DB"><span>Сдача</span><span style="font-size: 22px; font-weight: 800; color: #FFFFFF">350 сом</span></span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #475467; letter-spacing: 0.04em"><span>СПОСОБ ОПЛАТЫ</span><span style="font-weight: 600; letter-spacing: 0">← → ↑ ↓ — выбрать</span></span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <button type="button" style="height: 48px; border-radius: 12px; border: 2px solid #0B2A3C; background: #FFF7CC; color: #0B2A3C; font-family: inherit; font-size: 13.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2.5"></circle></svg>Наличные</button>
          <button type="button" style="height: 48px; border-radius: 12px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #344054; font-family: inherit; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path></svg>Карта / QR</button>
          <button type="button" style="height: 48px; border-radius: 12px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #344054; font-family: inherit; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>В долг<span style="font-size: 11px; font-weight: 600; color: #475467">· нужен клиент</span></button>
          <button type="button" style="height: 48px; border-radius: 12px; border: 1px solid #D0D5DD; background: #FFFFFF; color: #344054; font-family: inherit; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 7h11l-3-3M17 17H6l3 3"></path></svg>Смешанная</button>
        </div>
      </div>

      <button type="button" style="height: 44px; flex-shrink: 0; border-radius: 12px; border: 1px solid #E5E7EB; background: #F9FAFB; color: #475467; font-family: inherit; font-size: 13px; font-weight: 600; text-align: left; padding: 0 12px; display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Клиент — выбрать<span style="margin-left: auto; color: #667085; font-weight: 500">бонусы, сертификат</span></button>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="cashGot" style="font-size: 12px; font-weight: 700; color: #475467; letter-spacing: 0.04em">ПОЛУЧЕНО НАЛИЧНЫМИ</label>
        <input id="cashGot" type="text" value="1 000" style="height: 52px; box-sizing: border-box; border-radius: 12px; border: 2px solid #FFD600; outline: 2px solid #0B2A3C; outline-offset: 0; padding: 0 16px; font-family: inherit; font-size: 24px; font-weight: 800; color: #0B2A3C">
        <div style="display: flex; gap: 8px">
          <button type="button" style="flex-grow: 1; height: 44px; border-radius: 10px; border: 1px solid #E5E7EB; background: #F9FAFB; font-family: inherit; font-size: 14px; font-weight: 700; color: #0B2A3C">Без сдачи</button>
          <button type="button" style="flex-grow: 1; height: 44px; border-radius: 10px; border: 1px solid #E5E7EB; background: #F9FAFB; font-family: inherit; font-size: 14px; font-weight: 700; color: #0B2A3C">700</button>
          <button type="button" style="flex-grow: 1; height: 44px; border-radius: 10px; border: 2px solid #0B2A3C; background: #FFF7CC; font-family: inherit; font-size: 14px; font-weight: 700; color: #0B2A3C">1 000</button>
          <button type="button" style="flex-grow: 1; height: 44px; border-radius: 10px; border: 1px solid #E5E7EB; background: #F9FAFB; font-family: inherit; font-size: 14px; font-weight: 700; color: #0B2A3C">5 000</button>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
          <button type="button" style="height: 44px; border-radius: 10px; border: 0; background: #F2F4F7; font-family: inherit; font-size: 18px; font-weight: 700; color: #0B2A3C">{{k}}</button>
        </sc-for>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
        <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; font-weight: 500; color: #344054"><input type="checkbox" checked="" style="width: 20px; height: 20px; accent-color: #0B2A3C">Напечатать чек</label>
        <button type="button" style="height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #E5E7EB; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; color: #344054">Консультант: —</button>
      </div>
    </div>

    <footer style="display: flex; gap: 10px; padding: 14px 20px 18px; border-top: 1px solid #EAECF0; background: #FFFFFF">
      <button type="button" style="width: 120px; height: 56px; border-radius: 14px; border: 1.5px solid #D0D5DD; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; color: #344054">Отмена</button>
      <button type="button" style="flex-grow: 1; height: 56px; border-radius: 14px; border: 0; background: #FFD600; font-family: inherit; font-size: 17px; font-weight: 800; color: #0B2A3C; display: flex; align-items: center; justify-content: center; gap: 10px">Оплатить 650 сом<span style="font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: rgba(11,42,60,0.12)">Enter</span></button>
    </footer>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { keys: ['1', '2', '3', '4', '5', '6', '7', '8', '9', '00', '0', '⌫'] };
  }
}
</script>
</body>
</html>
