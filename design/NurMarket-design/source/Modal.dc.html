<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Модалка — единый вид</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; font-family: Montserrat, system-ui, sans-serif; color: #111827">
  <dc-import name="Main" hint-size="1440px,900px"></dc-import>
  <div style="position: absolute; inset: 0; background: rgba(11,42,60,0.45)"></div>

  <section role="dialog" aria-labelledby="dlgTitle" style="position: absolute; left: 400px; top: 190px; width: 640px; box-sizing: border-box; background: #FFFFFF; border-radius: 20px; box-shadow: 0 24px 60px rgba(11,42,60,0.30); display: flex; flex-direction: column; overflow: hidden">
    <header style="display: flex; align-items: center; gap: 14px; padding: 20px 24px; border-bottom: 1px solid #EAECF0">
      <span style="width: 44px; height: 44px; border-radius: 12px; background: #FEF3E2; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B54708" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20z"></path><path d="M12 10v4M12 17h.01"></path></svg></span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span id="dlgTitle" style="font-size: 18px; font-weight: 800">Товар закончился на складе</span><span style="font-size: 13px; color: #667085">Остаток 0 — продажа уйдёт в «Некорректные чеки»</span></span>
      <button type="button" aria-label="Закрыть" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E5E7EB; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#344054" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </header>

    <div style="padding: 20px 24px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 14px; background: #F9FAFB">
        <span role="img" aria-label="Фото товара" style="width: 56px; height: 56px; border-radius: 12px; background: #EEF0F3; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#98A2B3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="m21 17-5-5-9 8"></path></svg></span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">Aos Extra power 450г бальзам</span><span style="font-size: 13px; color: #667085">Штрихкод 4604049095438 · 50 сом</span></span>
        <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span style="font-size: 12px; color: #667085">На складе</span><span style="font-size: 18px; font-weight: 800; color: #C0362C">0 шт</span></span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 12px; font-weight: 700; color: #667085; letter-spacing: 0.04em">ЕСТЬ ПОХОЖИЕ В НАЛИЧИИ</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <button type="button" style="text-align: left; border-radius: 12px; border: 1px solid #E5E7EB; background: #FFFFFF; padding: 12px; font-family: inherit; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; font-weight: 700; color: #111827">MR PROPER Универсал Лимон 400г</span><span style="font-size: 12px; color: #667085">191 сом · 11 шт</span></button>
          <button type="button" style="text-align: left; border-radius: 12px; border: 1px solid #E5E7EB; background: #FFFFFF; padding: 12px; font-family: inherit; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; font-weight: 700; color: #111827">Хоз. мыло</span><span style="font-size: 12px; color: #667085">25 сом · 96 шт</span></button>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px">
        <label for="qtyMissing" style="font-size: 14px; font-weight: 600; color: #344054">Количество</label>
        <span style="display: flex; align-items: center; gap: 8px">
          <button type="button" aria-label="Меньше" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #D0D5DD; background: #FFFFFF; font-size: 18px; font-family: inherit">−</button>
          <input id="qtyMissing" type="text" value="1" style="width: 64px; height: 44px; box-sizing: border-box; text-align: center; border-radius: 10px; border: 1px solid #D0D5DD; font-family: inherit; font-size: 15px; font-weight: 700">
          <button type="button" aria-label="Больше" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #0B2A3C; color: #FFFFFF; font-size: 18px; font-family: inherit">+</button>
        </span>
      </div>
    </div>

    <footer style="display: flex; align-items: center; gap: 12px; padding: 16px 24px; border-top: 1px solid #EAECF0; background: #FCFCFD">
      <span style="flex-grow: 1; font-size: 13px; color: #667085">Enter — продать · Esc — отмена</span>
      <button type="button" style="height: 48px; padding: 0 22px; border-radius: 12px; border: 1.5px solid #D0D5DD; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #344054">Отмена</button>
      <button type="button" style="height: 48px; padding: 0 22px; border-radius: 12px; border: 0; background: #FFD600; font-family: inherit; font-size: 14px; font-weight: 800; color: #0B2A3C">Продать всё равно</button>
    </footer>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
