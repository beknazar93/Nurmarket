<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ABC-анализ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827">
  <dc-import name="OwnerNav" group="reports" active="ABC-анализ" hint-size="308px,900px"></dc-import>
  <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 22px 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 24px; font-weight: 800">ABC-анализ</span><span style="font-size: 13px; color: #667085">Какие товары дают выручку, а какие только занимают полку</span></span>
      <!-- 2026-10-16: общий переключатель периода (у ABC его не было — срок расчёта был не виден) -->
      <span style="font-size: 13px; color: #667085; white-space: nowrap">01.10–12.10.2026</span>
      <div role="group" aria-label="Период" style="display: flex; background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 12px; padding: 4px">
        <button type="button" style="height: 36px; padding: 0 14px; border-radius: 9px; border: 0; background: transparent; color: #475467; font-family: inherit; font-size: 13px; font-weight: 600">Сегодня</button>
        <button type="button" style="height: 36px; padding: 0 14px; border-radius: 9px; border: 0; background: transparent; color: #475467; font-family: inherit; font-size: 13px; font-weight: 600">Вчера</button>
        <button type="button" style="height: 36px; padding: 0 14px; border-radius: 9px; border: 0; background: transparent; color: #475467; font-family: inherit; font-size: 13px; font-weight: 600">Неделя</button>
        <button type="button" style="height: 36px; padding: 0 14px; border-radius: 9px; border: 0; background: #0B2A3C; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700">Месяц</button>
        <button type="button" style="height: 36px; padding: 0 14px; border-radius: 9px; border: 0; background: transparent; color: #475467; font-family: inherit; font-size: 13px; font-weight: 600">Даты…</button>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <div role="group" aria-label="Срез" style="display: flex; background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 12px; padding: 4px">
        <button type="button" style="height: 36px; padding: 0 14px; border-radius: 9px; border: 0; background: #0B2A3C; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700">По выручке</button>
        <button type="button" style="height: 36px; padding: 0 14px; border-radius: 9px; border: 0; background: transparent; color: #475467; font-family: inherit; font-size: 13px; font-weight: 600">По прибыли</button>
        <button type="button" style="height: 36px; padding: 0 14px; border-radius: 9px; border: 0; background: transparent; color: #475467; font-family: inherit; font-size: 13px; font-weight: 600">По штукам</button>
      </div>
      <span style="font-size: 13px; color: #667085">Выручка за месяц 81 240 сом · 214 проданных товаров из 307 (93 без продаж в расчёт не входят)</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
      <button type="button" style="text-align: left; background: #FFFFFF; border-radius: 16px; border: 2px solid #0B2A3C; padding: 18px; font-family: inherit; display: flex; flex-direction: column; gap: 6px"><span style="display: flex; align-items: center; gap: 10px"><span style="width: 32px; height: 32px; border-radius: 10px; background: #0B2A3C; color: #FFD600; display: flex; align-items: center; justify-content: center; font-weight: 800">A</span><span style="font-size: 14px; font-weight: 700">Кормят магазин</span></span><span style="font-size: 26px; font-weight: 800; color: #0B2A3C">38 товаров</span><span style="font-size: 13px; color: #475467">80,1 % выручки (65 080 сом) · не допускать нуля на складе</span></button>
      <button type="button" style="text-align: left; background: #FFFFFF; border-radius: 16px; border: 1px solid #E5E7EB; padding: 18px; font-family: inherit; display: flex; flex-direction: column; gap: 6px"><span style="display: flex; align-items: center; gap: 10px"><span style="width: 32px; height: 32px; border-radius: 10px; background: #FFD600; color: #0B2A3C; display: flex; align-items: center; justify-content: center; font-weight: 800">B</span><span style="font-size: 14px; font-weight: 700">Середина</span></span><span style="font-size: 26px; font-weight: 800; color: #0B2A3C">61 товар</span><span style="font-size: 13px; color: #475467">14,9 % выручки (12 100 сом) · держать в наличии</span></button>
      <!-- 2026-10-16: «C» — контрастный бейдж (белый на #667085), не серый на сером -->
      <button type="button" style="text-align: left; background: #FFFFFF; border-radius: 16px; border: 1px solid #E5E7EB; padding: 18px; font-family: inherit; display: flex; flex-direction: column; gap: 6px"><span style="display: flex; align-items: center; gap: 10px"><span style="width: 32px; height: 32px; border-radius: 10px; background: #667085; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800">C</span><span style="font-size: 14px; font-weight: 700">Хвост</span></span><span style="font-size: 26px; font-weight: 800; color: #0B2A3C">115 товаров</span><span style="font-size: 13px; color: #475467">5,0 % выручки (4 060 сом) · пересмотреть закупку</span></button>
    </div>
    <div style="display: flex; height: 14px; border-radius: 7px; overflow: hidden"><span style="width: 80.1%; background: #0B2A3C"></span><span style="width: 14.9%; background: #FFD600"></span><span style="width: 5%; background: #667085"></span></div>
    <section style="flex-grow: 1; min-height: 0; background: #FFFFFF; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">
      <div style="display: grid; grid-template-columns: 0.4fr 2.6fr 1fr 1fr 1fr; gap: 12px; padding: 12px 16px; background: #F9FAFB; font-size: 12px; font-weight: 700; color: #475467"><span>Гр.</span><span>Товар</span><span style="text-align: right">Выручка</span><span style="text-align: right">Доля</span><span style="text-align: right">Накоплено</span></div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div style="display: grid; grid-template-columns: 0.4fr 2.6fr 1fr 1fr 1fr; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid #F2F4F7"><span style="width: 26px; height: 26px; border-radius: 8px; background: {{r.bg}}; color: {{r.fg}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800">{{r.g}}</span><span style="font-size: 13px; font-weight: 700">{{r.name}} <span style="font-weight: 500; color: #667085">{{r.note}}</span></span><span style="text-align: right; font-size: 13px; white-space: nowrap">{{r.sum}}</span><span style="text-align: right; font-size: 13px; white-space: nowrap">{{r.share}}</span><span style="text-align: right; font-size: 13px; color: #667085; white-space: nowrap">{{r.cum}}</span></div>
      </sc-for>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    // 2026-10-16: месяц 01–12.10, выручка 81 240 сом (SPEC): A — 38 товаров 80,1 %, B — 61 товар 14,9 %, C — 115 товаров 5,0 %.
    // Показаны первые 3, начало группы B (№39–40) и последний товар хвоста.
    const S = ' ';
    const data = [
      ['A', '1. Хлеб белый', '168 шт', '5 880', '7,2', '7,2'],
      ['A', '2. Молоко 1л', '52 шт', '4 940', '6,1', '13,3'],
      ['A', '3. Макароны «Макфа» спагетти 450г', '46 шт', '3 910', '4,8', '18,1'],
      ['B', '39. Вафли «Лесной орех» 220г', '2 шт', '228', '0,3', '80,4'],
      ['B', '40. Салфетки «Мягкие» 100 шт', '5 шт', '225', '0,3', '80,7'],
      ['C', '214. Патроны для степлера', '1 шт · на складе 1 162', '35', '0,04', '100']
    ];
    const rows = data.map(([x, name, note, sum, share, cum]) => ({
      g: x, name, note, sum: sum + S + 'сом', share: share + S + '%', cum: cum + S + '%',
      bg: x === 'A' ? '#0B2A3C' : x === 'B' ? '#FFD600' : '#667085', fg: x === 'A' ? '#FFD600' : x === 'B' ? '#0B2A3C' : '#FFFFFF'
    }));
    return { rows };
  }
}
</script>
</body>
</html>
