<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.m{background:#FFFFFF;border-radius:20px;box-shadow:0 24px 60px rgba(11,42,60,.22);display:flex;flex-direction:column;overflow:hidden}

.mt b{font-size:16px;font-weight:800}

.x{width:34px;height:34px;border-radius:10px;border:1px solid #E5E7EB;background:#FFFFFF;font-size:14px;color:#344054;font-family:inherit}
.mb{padding:14px 20px;display:flex;flex-direction:column;gap:8px}
.mf{display:flex;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid #EAECF0;background:#FCFCFD}
.tot{flex-grow:1;font-size:12px;color:#475467}
.tot b{font-size:14px;color:#0B2A3C}
.b2{height:42px;padding:0 14px;border-radius:12px;border:1.5px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:13px;font-weight:700;color:#344054}
.b1{height:42px;padding:0 16px;border-radius:12px;border:0;background:#FFD600;font-family:inherit;font-size:13px;font-weight:800;color:#0B2A3C}
.bd{height:42px;padding:0 16px;border-radius:12px;border:0;background:#C0362C;font-family:inherit;font-size:13px;font-weight:800;color:#FFFFFF}
.lbl{font-size:11px;font-weight:700;color:#667085;letter-spacing:.03em}
.in{height:48px;box-sizing:border-box;border-radius:10px;border:1px solid #D0D5DD;padding:0 12px;font-family:inherit;font-size:16px;width:100%;background:#FFFFFF}
.big{height:52px;font-size:20px;font-weight:800;border:2px solid #0B2A3C}
.chip{height:44px;padding:0 14px;border-radius:22px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:12px;font-weight:600;color:#344054;white-space:nowrap}
.chip.on{border:0;background:#0B2A3C;color:#FFFFFF;font-weight:700}
.sg{display:flex;gap:4px;padding:4px;border-radius:12px;background:#E4E7EC}
.seg{flex-grow:1;height:40px;border-radius:10px;border:0;font-family:inherit;font-size:13px;font-weight:700;background:transparent;color:#475467}
.seg.on{background:#0B2A3C;color:#FFFFFF}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#F9FAFB;font-size:13px}
.rl{display:flex;justify-content:space-between;font-size:13px;padding:5px 0}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
.card{background:#FFFFFF;border:1px solid #E5E7EB;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.kpi{background:#FFFFFF;border:1px solid #E5E7EB;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi span{font-size:12px;font-weight:600;color:#667085}
.kpi b{font-size:22px;font-weight:800;color:#0B2A3C}
.nv{width:48px;height:48px;border-radius:14px;border:1px solid #E5E7EB;background:#FFFFFF;color:#344054;display:flex;align-items:center;justify-content:center}
.pc{background:#FFFFFF;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.cta{height:56px;border-radius:16px;border:0;background:#FFD600;color:#0B2A3C;font-family:inherit;font-size:17px;font-weight:800;width:100%}

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <header style="padding: 16px 16px 8px; display: flex; align-items: center; gap: 12px"><button type="button" class="nv" aria-label="Назад"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button><b style="font-size: 18px; font-weight: 800; flex-grow: 1">Новая позиция</b><span style="font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #E7EEF3; color: #0B2A3C; white-space: nowrap">Администратор</span></header>
  <main style="padding: 0 16px 8px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1; overflow: hidden">
    <div class="sg" role="group" aria-label="Вид"><button type="button" class="seg" style="height: 40px">Товар</button><button type="button" class="seg" style="height: 40px">Одежда</button><button type="button" class="seg on" style="height: 40px">Услуга</button><button type="button" class="seg" style="height: 40px">Прокат</button></div>
    <div class="pc" style="gap: 6px"><label class="lbl" for="ps1">НАЗВАНИЕ</label><input id="ps1" class="in" type="text" value="Стрижка мужская">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px"><span style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><label class="lbl" for="ps2">ЦЕНА</label><input id="ps2" class="in" type="text" value="600" style="border: 2px solid #0B2A3C"></span><span style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><label class="lbl" for="ps3">КАТЕГОРИЯ</label><input id="ps3" class="in" type="text" value="Стрижки"></span></div></div>
    <span class="lbl">ДЛИТЕЛЬНОСТЬ</span>
    <div style="display: flex; gap: 6px; overflow: hidden"><button type="button" class="chip">30 мин</button><button type="button" class="chip on">45 мин</button><button type="button" class="chip">1 ч</button><button type="button" class="chip">1,5 ч</button></div>
    <span class="lbl">МАСТЕРА</span>
    <div class="pc" style="gap: 0; padding: 4px 14px">
      <div class="rl" style="padding: 9px 0; border-bottom: 1px solid #EAECF0"><span><b>Жибек</b></span><span style="white-space: nowrap">600&nbsp;сом · 40&nbsp;% мастеру</span></div>
      <div class="rl" style="padding: 9px 0; border-bottom: 1px solid #EAECF0"><span><b>Айнура</b></span><span style="white-space: nowrap">700&nbsp;сом · 45&nbsp;% мастеру</span></div>
      <button type="button" style="height: 48px; border: 0; background: transparent; font-family: inherit; font-size: 14px; font-weight: 700; color: #0B2A3C; text-align: left; padding: 0">+ мастер</button>
    </div>
    <span class="lbl">РАСХОДНИКИ</span>
    <div class="pc" style="gap: 0; padding: 4px 14px"><div class="rl" style="padding: 9px 0; border-bottom: 1px solid #EAECF0"><span>Шампунь · списать со склада</span><span>10 мл</span></div><button type="button" style="height: 48px; border: 0; background: transparent; font-family: inherit; font-size: 14px; font-weight: 700; color: #0B2A3C; text-align: left; padding: 0">+ расходник</button></div>
    <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; min-height: 32px"><input type="checkbox" style="width: 22px; height: 22px; margin: 0; accent-color: #0B2A3C">Онлайн-запись на сайте и в боте</label>
    <span style="font-size: 12px; color: #667085">позже · нужен сервер NurCRM: мастера и расписание сейчас хранятся только в этом телефоне, сайт и бот их не видят</span>
  </main>
  <div style="padding: 10px 16px 0; background: #FFFFFF; border-top: 1px solid #EAECF0"><button type="button" class="cta">Сохранить услугу</button><div style="height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="width: 134px; height: 5px; border-radius: 3px; background: rgba(11,42,60,.25)"></span></div></div>
