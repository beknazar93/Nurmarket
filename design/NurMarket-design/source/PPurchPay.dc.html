<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.sp{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:#FFFFFF}
.chip{height:44px;padding:0 12px;border-radius:22px;white-space:nowrap;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:12px;font-weight:600;color:#344054}
.chip.on{border:0;background:#0B2A3C;color:#FFFFFF;font-weight:700}
.q{flex-grow:1;height:48px;border-radius:24px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:13px;font-weight:700;color:#344054}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827; position: relative; overflow: hidden">
  <div style="padding: 10px 16px 0; display: flex; justify-content: flex-end"><span style="font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #E7EEF3; color: #0B2A3C; white-space: nowrap">Администратор</span></div>
  <header style="padding: 4px 16px 10px; display: flex; align-items: center; gap: 12px">
    <button type="button" aria-label="Назад" style="width: 48px; height: 48px; border-radius: 14px; border: 1px solid #E5E7EB; background: #FFFFFF; color: #344054; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <b style="font-size: 18px; font-weight: 800">Долги поставщикам</b>
  </header>
  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 8px">
    <section style="border-radius: 16px; background: #0B2A3C; color: #FFFFFF; padding: 14px 16px"><span style="font-size: 12px; color: #C7D2DB">Всего должны</span><br><b style="font-size: 24px; color: #FFD600; white-space: nowrap">3&nbsp;500&nbsp;сом</b></section>
    <div class="sp"><span style="flex-grow: 1; display: flex; flex-direction: column"><b style="font-size: 14px">ОсОО «Бишкек Дистрибьюшн»</b><span style="font-size: 12px; color: #B42318; font-weight: 700">срок 10.10 · просрочен 2 дня</span></span><b style="color: #B42318; white-space: nowrap">2&nbsp;300&nbsp;сом</b></div>
    <div class="sp"><span style="flex-grow: 1; display: flex; flex-direction: column"><b style="font-size: 14px">ИП Асанов</b><span style="font-size: 12px; color: #667085">срок 20.10</span></span><b style="color: #111827; white-space: nowrap">1&nbsp;200&nbsp;сом</b></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(11,42,60,.45)"></div>

  <section role="dialog" aria-label="Оплата поставщику" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 10px 18px 0; display: flex; flex-direction: column; gap: 8px">
    <span style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #D0D5DD"></span>
    <div style="display: flex; align-items: center; gap: 10px"><span style="flex-grow: 1; display: flex; flex-direction: column"><b style="font-size: 17px">Оплата · ОсОО «Бишкек Дистрибьюшн»</b><span style="font-size: 12px; color: #667085">долг 2&nbsp;300&nbsp;сом · срок 10.10 прошёл</span></span><button type="button" aria-label="Закрыть" style="width: 48px; height: 48px; border-radius: 14px; border: 0; background: #F2F4F7; color: #475467; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
    <label for="ps" style="font-size: 11px; font-weight: 700; color: #667085">СУММА</label>
    <input id="ps" type="text" value="2 300" style="height: 54px; box-sizing: border-box; border-radius: 14px; border: 2px solid #0B2A3C; padding: 0 14px; font-family: inherit; font-size: 20px; font-weight: 800">
    <div style="display: flex; gap: 6px"><button type="button" class="q" style="white-space: nowrap">Весь долг · 2&nbsp;300</button><button type="button" class="q" style="white-space: nowrap">Половину · 1&nbsp;150</button></div>
    <span style="font-size: 11px; font-weight: 700; color: #667085">ОТКУДА</span>
    <!-- 2026-10-17: наличные только через открытую смену (админ не у ящика); оплата создаст изъятие в смене кассира -->
    <div style="display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 6px"><button type="button" class="chip on" style="height: 48px; border-radius: 14px; white-space: normal; line-height: 1.2">Наличными через кассу</button><button type="button" class="chip" style="height: 48px; border-radius: 14px">Картой</button><button type="button" class="chip" style="height: 48px; border-radius: 14px">Переводом</button></div>
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 8px 12px; border-radius: 12px; background: #F9FAFB; border: 1px solid #E5E7EB"><span style="font-size: 11px; font-weight: 700; color: #667085; letter-spacing: .03em">ЧЕРЕЗ СМЕНУ</span><button type="button" style="height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #D0D5DD; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #0B2A3C; display: flex; align-items: center; justify-content: space-between">Касса 1 · Кассир Тест<span aria-hidden="true">▾</span></button><span style="font-size: 12px; color: #475467">Кассир подтвердит выдачу в своей смене — изъятие запишется само</span></div>
    <button type="button" style="height: 56px; border-radius: 16px; border: 0; background: #FFD600; color: #0B2A3C; font-family: inherit; font-size: 17px; font-weight: 800; margin-top: 4px; white-space: nowrap">Оплатить · 2&nbsp;300&nbsp;сом</button>
    <div style="height: 24px; display: flex; align-items: center; justify-content: center"><span style="width: 134px; height: 5px; border-radius: 3px; background: rgba(11,42,60,.25)"></span></div>
  </section>
</div>
