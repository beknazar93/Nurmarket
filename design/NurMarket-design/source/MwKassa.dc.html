<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Веб в телефоне — веб-касса</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#FFFFFF;border-top:1px solid #EAECF0;padding:6px 4px 2px;flex-shrink:0}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:48px;font-size:11.5px;font-weight:600;color:#475467;text-decoration:none;padding:4px 0}
.nav a.on{color:#0B2A3C;font-weight:800}
.nav a.on span{background:#FFD600}
.nav span{width:44px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.gest{height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#FFFFFF}
.gest i{width:134px;height:5px;border-radius:3px;background:rgba(11,42,60,.25)}
.hd{height:60px;flex-shrink:0;box-sizing:border-box;background:#FFFFFF;border-bottom:1px solid #EAECF0;display:flex;align-items:center;gap:10px;padding:0 16px}
.hd b{font-size:18px;font-weight:800}
.hb{width:44px;height:44px;border-radius:12px;border:0;background:#F2F4F7;color:#0B2A3C;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chip{height:44px;padding:0 14px;border-radius:22px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:14px;font-weight:600;color:#344054;white-space:nowrap;flex-shrink:0}
.chip.on{border:0;background:#0B2A3C;color:#FFFFFF;font-weight:700}
.sg{display:flex;background:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;padding:3px;flex-shrink:0}
.sg button{flex:1 1 0;height:44px;border-radius:9px;border:0;background:transparent;color:#475467;font-family:inherit;font-size:14px;font-weight:600;white-space:nowrap;padding:0 4px}
.sg button.on{background:#0B2A3C;color:#FFFFFF;font-weight:700}
.srch{height:48px;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:12px;border:1px solid #D0D5DD;background:#FFFFFF;flex-shrink:0}
.srch input{border:0;outline:0;background:transparent;font-family:inherit;font-size:16px;width:100%;min-width:0;color:#111827}
.p{background:#FFFFFF;border:0;border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px;font-family:inherit;text-align:left;min-width:0}
.pl{width:44px;height:44px;border-radius:22px;border:0;background:#FFD600;color:#0B2A3C;font-family:inherit;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column">
  <header class="hd"><span style="flex-grow: 1; display: flex; flex-direction: column"><b>Веб-касса</b><span style="font-size: 12px; color: #0E7A3A; font-weight: 700">● на связи · Нурлан с 10:30</span></span><button type="button" class="chip" style="height: 40px">Закрыть смену</button></header>
  <div style="padding: 10px 16px 6px; display: flex; flex-direction: column; gap: 8px">
    <span style="display: flex; gap: 8px"><label class="srch" style="flex-grow: 1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input type="text" placeholder="Товар или штрихкод" aria-label="Поиск товара"></label>
    <!-- 2026-10-17: сканер камерой по кнопке (Chrome Android — BarcodeDetector, iPhone — zxing) -->
    <button type="button" aria-label="Сканировать камерой" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 12px; border: 0; background: #0B2A3C; color: #FFD600; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8V5h4M16 4h4v4M20 16v4h-4M8 20H4v-4M8 9v6M12 9v6M16 9v6"></path></svg></button></span>
    <div style="display: flex; gap: 6px; overflow: hidden"><button type="button" class="chip on">Все</button><button type="button" class="chip">Избранное</button><button type="button" class="chip">Весовые</button><button type="button" class="chip">Напитки</button></div>
  </div>
  <main style="flex-grow: 1; min-height: 0; padding: 4px 16px 8px; overflow: hidden">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{products}}" as="p" hint-placeholder-count="6">
        <div class="p">
          <span style="height: 64px; border-radius: 12px; background: {{p.tint}}; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #0B2A3C; position: relative">{{p.mono}}<sc-if value="{{p.qty}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 6px; right: 6px; min-width: 24px; height: 24px; border-radius: 12px; background: #0B2A3C; color: #FFFFFF; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{p.qty}}</span></sc-if></span>
          <span style="font-size: 14px; font-weight: 600; line-height: 18px; height: 36px; overflow: hidden">{{p.name}}</span>
          <span style="display: flex; justify-content: space-between; align-items: center"><b style="font-size: 15px; color: #0B2A3C; white-space: nowrap">{{p.price}}</b><button type="button" class="pl" aria-label="Добавить в чек">+</button></span>
        </div>
      </sc-for>
    </div>
  </main>
  <button type="button" style="margin: 0 12px 8px; height: 60px; flex-shrink: 0; border-radius: 18px; border: 0; background: #0B2A3C; color: #FFFFFF; font-family: inherit; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 18px; box-shadow: 0 10px 24px rgba(11,42,60,.3)">
    <span style="flex-grow: 1; display: flex; flex-direction: column; align-items: flex-start"><span style="font-size: 13px; color: #C7D2DB">Чек · 2 позиции</span><b style="font-size: 16px">3 шт</b></span>
    <span style="height: 44px; padding: 0 16px; border-radius: 12px; background: #FFD600; color: #0B2A3C; display: flex; align-items: center; font-size: 15px; font-weight: 800; white-space: nowrap">Оплатить 209&nbsp;сом</span>
  </button>
  <!-- 2026-10-17: нижнее меню как в приложении администратора; «Ещё» = бывшее ☰ (8 групп) -->
  <nav class="nav" aria-label="Разделы">
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21H3z"></path></svg></span>Главная</a>
    <a href="#" class="on" aria-current="page"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.5 11h11L21 7H6.5"></path><circle cx="9" cy="19.5" r="1.5"></circle><circle cx="17" cy="19.5" r="1.5"></circle></svg></span>Продажа</a>
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg></span>Товары</a>
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span>Отчёты</a>
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg></span>Ещё</a>
  </nav>
  <div class="gest" aria-hidden="true"><i></i></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // 2026-10-17: товары и цены — единые данные NBS
    const p = (name, mono, tint, price, qty) => ({ name, mono, tint, price, qty: qty || '' });
    return {
      products: [
        p('Макароны «Макфа» спагетти 450г', 'Мк', '#FFF4C2', '85 сом', '2'),
        p('Кока-Кола (ПЭТ) 2л', 'Кк', '#FDE8E8', '170 сом'),
        p('Mars 50г', 'Ms', '#F1E8FD', '39 сом', '1'),
        p('Хлеб белый', 'Хб', '#FFEBD6', '35 сом'),
        p('Сок Gracio яблочный 1л', 'Сг', '#E7F6EC', '120 сом'),
        p('Молоко 1л', 'Мл', '#E3F2FD', '95 сом')
      ]
    };
  }
}
</script>
</body>
</html>
