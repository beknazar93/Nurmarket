<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Веб в телефоне — товары и склад</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#FFFFFF;border-top:1px solid #EAECF0;padding:6px 4px 2px;flex-shrink:0}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:48px;font-size:11.5px;font-weight:600;color:#475467;text-decoration:none;padding:4px 0}
.nav a.on{color:#0B2A3C;font-weight:800}
.nav a.on span{background:#FFD600}
.nav span{width:44px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.gest{height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#FFFFFF}
.gest i{width:134px;height:5px;border-radius:3px;background:rgba(11,42,60,.25)}
.hd{height:60px;flex-shrink:0;box-sizing:border-box;background:#FFFFFF;border-bottom:1px solid #EAECF0;display:flex;align-items:center;gap:10px;padding:0 16px}
.hd b{font-size:18px;font-weight:800}
.hb{width:44px;height:44px;border-radius:12px;border:0;background:#F2F4F7;color:#0B2A3C;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chip{height:44px;padding:0 14px;border-radius:22px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:14px;font-weight:600;color:#344054;white-space:nowrap;flex-shrink:0}
.chip.on{border:0;background:#0B2A3C;color:#FFFFFF;font-weight:700}
.sg{display:flex;background:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;padding:3px;flex-shrink:0}
.sg button{flex:1 1 0;height:44px;border-radius:9px;border:0;background:transparent;color:#475467;font-family:inherit;font-size:14px;font-weight:600;white-space:nowrap;padding:0 4px}
.sg button.on{background:#0B2A3C;color:#FFFFFF;font-weight:700}
.srch{height:48px;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:12px;border:1px solid #D0D5DD;background:#FFFFFF;flex-shrink:0}
.srch input{border:0;outline:0;background:transparent;font-family:inherit;font-size:16px;width:100%;min-width:0;color:#111827}
.it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:#FFFFFF}
.cb{width:24px;height:24px;flex-shrink:0;accent-color:#0B2A3C}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column; position: relative">
  <header class="hd"><span style="flex-grow: 1; display: flex; flex-direction: column"><b>Склад</b><span style="font-size: 12px; color: #667085">307 товаров · Главный склад</span></span><button type="button" class="chip" style="height: 40px">Склад ▾</button></header>
  <div style="padding: 10px 16px 6px; display: flex; flex-direction: column; gap: 8px">
    <label class="srch"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input type="text" placeholder="Название или штрихкод" aria-label="Поиск товара"></label>
    <div style="display: flex; gap: 6px; overflow: hidden"><button type="button" class="chip on">Все</button><button type="button" class="chip">Мало · 4</button><button type="button" class="chip">Нет · 1</button><button type="button" class="chip">Напитки</button></div>
  </div>
  <div style="margin: 0 16px 6px; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; border-radius: 12px; background: #FFF7CC; font-size: 14px"><b style="flex-grow: 1">Выбрано 2</b><button type="button" class="chip" style="height: 40px">Цена</button><button type="button" class="chip" style="height: 40px">Ценники</button></div>
  <main style="flex-grow: 1; min-height: 0; padding: 0 16px 8px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <label class="it" style="box-shadow: {{r.ring}}">
        <span aria-hidden="true" style="width: 24px; height: 24px; flex-shrink: 0; box-sizing: border-box; border-radius: 6px; border: 2px solid #0B2A3C; background: {{r.cbg}}; color: #FFFFFF; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{r.tick}}</span>
        <span style="width: 40px; height: 40px; border-radius: 12px; background: {{r.tint}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #0B2A3C; flex-shrink: 0">{{r.mono}}</span>
        <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</b><span style="font-size: 13px; color: #475467; white-space: nowrap">{{r.price}} · закупка {{r.cost}}</span></span>
        <span style="flex-shrink: 0; min-width: 72px; text-align: center; font-size: 13px; font-weight: 700; padding: 4px 8px; border-radius: 999px; background: {{r.sbg}}; color: {{r.sfg}}; white-space: nowrap">{{r.stock}}</span>
      </label>
    </sc-for>
  </main>
  <!-- 2026-10-17: «+ Товар» — плавающая кнопка внизу, в зоне большого пальца -->
  <button type="button" aria-label="Новый товар" style="position: absolute; right: 16px; bottom: 112px; height: 56px; padding: 0 20px; border-radius: 28px; border: 0; background: #FFD600; color: #0B2A3C; font-family: inherit; font-size: 16px; font-weight: 800; box-shadow: 0 8px 20px rgba(11,42,60,.25)">+ Товар</button>
  <!-- 2026-10-17: нижнее меню как в приложении администратора; «Ещё» = бывшее ☰ (8 групп) -->
  <nav class="nav" aria-label="Разделы">
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21H3z"></path></svg></span>Главная</a>
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.5 11h11L21 7H6.5"></path><circle cx="9" cy="19.5" r="1.5"></circle><circle cx="17" cy="19.5" r="1.5"></circle></svg></span>Продажа</a>
    <a href="#" class="on" aria-current="page"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg></span>Товары</a>
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span>Отчёты</a>
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg></span>Ещё</a>
  </nav>
  <div class="gest" aria-hidden="true"><i></i></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // 2026-10-17: остаток — одно правило со словом: 0 → «нет», ≤ мин. → «мало», иначе зелёный; выбор — галочкой
    const ok = { sbg: '#E7F6EC', sfg: '#0E7A3A' }, low = { sbg: '#FEF3E2', sfg: '#B54708' }, no = { sbg: '#FDE8E8', sfg: '#B42318' };
    const r = (name, mono, tint, price, cost, stock, s, sel) => Object.assign({ name, mono, tint, price, cost, stock, tick: sel ? '✓' : '', cbg: sel ? '#0B2A3C' : '#FFFFFF', ring: sel ? 'inset 0 0 0 2px #0B2A3C' : 'none' }, s);
    return {
      rows: [
        r('Макароны «Макфа» спагетти 450г', 'Мк', '#FFF4C2', '85 сом', '68', '50 шт', ok, true),
        r('Кока-Кола (ПЭТ) 2л', 'Кк', '#FDE8E8', '170 сом', 'не указана', 'мало · 1', low, true),
        r('Mars 50г', 'Ms', '#F1E8FD', '39 сом', '30', '48 шт', ok),
        r('Сок Gracio яблочный 1л', 'Сг', '#FFEBD6', '120 сом', '92', 'мало · 2', low),
        r('Aos Extra pover 450гр бальзам', 'Ao', '#E7F6EC', '50 сом', '35', 'нет · 0', no),
        r('Патроны для степлера', 'Пс', '#E3F2FD', '35 сом', '28', '1 162 шт', ok)
      ]
    };
  }
}
</script>
</body>
</html>
