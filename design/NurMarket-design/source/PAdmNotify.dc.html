<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Уведомления</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.nt{display:flex;gap:12px;padding:12px;border-radius:16px;background:#FFFFFF;border:0;font-family:inherit;text-align:left;width:100%;align-items:flex-start}
.ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.g{font-size:12px;font-weight:700;color:#667085;padding:4px 2px 0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; font-family: Montserrat, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column">
  <header style="padding: 18px 16px 10px; display: flex; align-items: center; gap: 12px">
    <button type="button" aria-label="Назад" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #E5E7EB; background: #FFFFFF; color: #344054; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <b style="font-size: 18px; font-weight: 800; flex-grow: 1">Уведомления <span style="font-size: 11px; font-weight: 700; background: #E4E7EC; border-radius: 6px; padding: 3px 7px; vertical-align: middle">Администратор</span></b>
    <a href="#" style="font-size: 13px; font-weight: 700">Прочитать все</a>
  </header>
  <main style="flex-grow: 1; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
    <span class="g">СЕГОДНЯ</span>
    <sc-for list="{{items}}" as="n" hint-placeholder-count="6">
      <button type="button" class="nt" style="box-shadow: {{n.ring}}">
        <span class="ic" style="background: {{n.bg}}; color: {{n.fg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg></span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 14px; font-weight: {{n.w}}">{{n.title}}</b><span style="font-size: 13px; color: #475467; line-height: 18px">{{n.text}}</span></span>
        <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px"><span style="font-size: 12px; color: #667085; white-space: nowrap">{{n.time}}</span><span aria-label="не прочитано" style="width: 9px; height: 9px; border-radius: 5px; background: {{n.dot}}"></span></span>
      </button>
    </sc-for>
    <span style="font-size: 12px; color: #667085">Сейчас уведомления собирает телефон сам; события смен, ревизий и заказов на все телефоны (push) — нужен сервер NurCRM.</span>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // 2026-10-16: непрочитанное — точкой, жирным заголовком и полоской (не только цветом); данные NBS на 12.10.
    const n = (title, text, time, icon, bg, fg, unread) => ({ title, text, time, icon, bg, fg, ring: unread ? 'inset 3px 0 0 #FFD600' : 'none', dot: unread ? '#0B2A3C' : 'transparent', w: unread ? '800' : '600', mark: unread ? 'новое · ' : '' });
    return {
      items: [
        n('Новый заказ с сайта', 'Заказ №10 · Умар · 530 сом · самовывоз · из Телеграм-бота', '13:52', 'M5 8h14l-1 13H6zM9 8a3 3 0 0 1 6 0', '#E7F6EC', '#0E7A3A', true),
        n('Смена закрыта с недостачей', 'Айгерим Садыкова · телефон · вчера · не хватает 150 сом', '09:05', 'M12 3 2 21h20zM12 10v5M12 18h.01', '#FDE2E1', '#B42318', true),
        n('Кассир прислал ревизию', 'Напитки · Кассир Тест · расхождение в 1 товаре (Кока-Кола 2л)', '11:40', 'M9 11l3 3 8-8M20 12v7H4V5h11', '#FFF7CC', '#0B2A3C', true),
        n('Неизвестный штрихкод при приёмке', 'Кассир Тест · 4600682009183 · заведите товар', '10:15', 'M4 8V5h4M16 4h4v4M20 16v4h-4M8 20H4v-4M8 9v6M12 9v6M16 9v6', '#FEF3E2', '#B54708', false),
        n('Заканчиваются товары', '4 позиции · Aos, Эссе манго, Сок Gracio, Кока-Кола — пора заказать', '09:00', 'M3 8l9-5 9 5v8l-9 5-9-5z', '#FEF3E2', '#B54708', false),
        n('Срок долга сегодня', 'Айпери · 9 800 сом · напомнить в WhatsApp', '09:00', 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M12 7v5l3 2', '#E7EEF3', '#0B2A3C', false)
      ]
    };
  }
}
</script>
</body>
</html>
