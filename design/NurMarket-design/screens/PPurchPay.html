<!doctype html>
<html lang="ru"><head><style>
    .sc-placeholder{background:color-mix(in srgb,currentColor 8%,transparent);
      border:1px solid color-mix(in srgb,currentColor 50%,transparent);
      border-radius:2px;box-sizing:border-box;overflow:hidden}
    @keyframes sc-shine{0%{background-position:100% 50%}100%{background-position:0% 50%}}
    html.sc-dc-streaming .sc-placeholder,
    html.sc-dc-streaming .sc-interp.sc-missing{position:relative;
      background:color-mix(in srgb,currentColor 5%,transparent);
      border-color:transparent}
    html.sc-dc-streaming .sc-placeholder::before,
    html.sc-dc-streaming .sc-interp.sc-missing::before{content:'';
      position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(90deg,rgba(217,119,87,0) 25%,rgba(247,225,211,.95) 37%,rgba(217,119,87,0) 63%);
      background-size:400% 100%;animation:sc-shine 1.4s ease infinite}
    html.sc-dc-streaming .sc-placeholder:nth-child(n+9 of .sc-placeholder)::before,
    html.sc-dc-streaming .sc-interp.sc-missing:nth-child(n+9 of .sc-interp.sc-missing)::before{animation:none;
      background:color-mix(in srgb,currentColor 8%,transparent)}
    .sc-placeholder-error{padding:4px 8px;font:11px/1.4 ui-monospace,monospace;
      color:color-mix(in srgb,currentColor 70%,transparent);word-break:break-word}
    .sc-interp.sc-missing{display:inline-block;width:2em;height:1em;overflow:hidden;
      vertical-align:text-bottom;background:rgba(255,255,255,.3);border:1px solid rgba(0,0,0,.5);
      border-radius:2px;box-sizing:border-box;color:transparent;
      user-select:none}
    .sc-interp.sc-unresolved{font-family:ui-monospace,monospace;font-size:.85em;
      color:color-mix(in srgb,currentColor 50%,transparent);
      background:color-mix(in srgb,currentColor 10%,transparent);border-radius:3px;
      padding:0 3px}
    .sc-host.sc-has-error{position:relative}
    .sc-logic-error{position:absolute;top:8px;left:8px;z-index:2147483647;max-width:60ch;
      padding:6px 10px;background:#b00020;color:#fff;font:12px/1.4 ui-monospace,monospace;
      border-radius:4px;white-space:pre-wrap;pointer-events:none}
    /* Mirrors PRINT_BASELINE_CSS in apps/web deck-stage-export.ts — keep both
       in sync until dc-runtime regains a build step. */
    @media print {
      @page { margin: 0.5cm; }
      figure, table { break-inside: avoid; }
      #dc-root, #dc-root > .sc-host { height: auto; }
      *, *::before, *::after {
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
        backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
        animation-delay: -99s !important; animation-duration: .001s !important;
        animation-iteration-count: 1 !important; animation-fill-mode: both !important;
        animation-play-state: running !important; transition-duration: 0s !important;
      }
    }
  </style>
<meta charset="utf-8">
<title>Телефон — оплата поставщику</title>
<style>x-dc{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.sp{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:#FFFFFF}
.chip{height:44px;padding:0 12px;border-radius:22px;white-space:nowrap;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:12px;font-weight:600;color:#344054}
.chip.on{border:0;background:#0B2A3C;color:#FFFFFF;font-weight:700}
.q{flex-grow:1;height:48px;border-radius:24px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:13px;font-weight:700;color:#344054}
</style></head>
<body>
<div id="dc-root"><div class="sc-host" data-sc-name="PPurchPay"><div style="width: 390px; height: 844px; box-sizing: border-box; background: rgb(244, 245, 247); font-family: Montserrat, system-ui, sans-serif; color: rgb(17, 24, 39); position: relative; overflow: hidden;">
  <div style="padding: 10px 16px 0px; display: flex; justify-content: flex-end;"><span style="font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: rgb(231, 238, 243); color: rgb(11, 42, 60); white-space: nowrap;">Администратор</span></div>

    <button type="button" aria-label="Назад" style="width: 48px; height: 48px; border-radius: 14px; border: 1px solid rgb(229, 231, 235); background: rgb(255, 255, 255); color: rgb(52, 64, 84); display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <b style="font-size: 18px; font-weight: 800;">Долги поставщикам</b>

  <div style="padding: 0px 16px; display: flex; flex-direction: column; gap: 8px;">

    <div class="sp"><span style="flex-grow: 1; display: flex; flex-direction: column;"><b style="font-size: 14px;">ОсОО «Бишкек Дистрибьюшн»</b><span style="font-size: 12px; color: rgb(180, 35, 24); font-weight: 700;">срок 10.10 · просрочен 2 дня</span></span><b style="color: rgb(180, 35, 24); white-space: nowrap;">2&nbsp;300&nbsp;сом</b></div>
    <div class="sp"><span style="flex-grow: 1; display: flex; flex-direction: column;"><b style="font-size: 14px;">ИП Асанов</b><span style="font-size: 12px; color: rgb(102, 112, 133);">срок 20.10</span></span><b style="color: rgb(17, 24, 39); white-space: nowrap;">1&nbsp;200&nbsp;сом</b></div>
  </div>
  <div style="position: absolute; inset: 0px; background: rgba(11, 42, 60, 0.45);"></div>

  <section role="dialog" aria-label="Оплата поставщику" style="position: absolute; left: 0px; right: 0px; bottom: 0px; background: rgb(255, 255, 255); border-radius: 24px 24px 0px 0px; padding: 10px 18px 0px; display: flex; flex-direction: column; gap: 8px;">
    <span style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: rgb(208, 213, 221);"></span>
    <div style="display: flex; align-items: center; gap: 10px;"><span style="flex-grow: 1; display: flex; flex-direction: column;"><b style="font-size: 17px;">Оплата · ОсОО «Бишкек Дистрибьюшн»</b><span style="font-size: 12px; color: rgb(102, 112, 133);">долг 2&nbsp;300&nbsp;сом · срок 10.10 прошёл</span></span><button type="button" aria-label="Закрыть" style="width: 48px; height: 48px; border-radius: 14px; border: 0px; background: rgb(242, 244, 247); color: rgb(71, 84, 103); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
    <label for="ps" style="font-size: 11px; font-weight: 700; color: rgb(102, 112, 133);">СУММА</label>
    <input id="ps" type="text" value="2 300" style="height: 54px; box-sizing: border-box; border-radius: 14px; border: 2px solid rgb(11, 42, 60); padding: 0px 14px; font-family: inherit; font-size: 20px; font-weight: 800;">
    <div style="display: flex; gap: 6px;"><button type="button" class="q" style="white-space: nowrap;">Весь долг · 2&nbsp;300</button><button type="button" class="q" style="white-space: nowrap;">Половину · 1&nbsp;150</button></div>
    <span style="font-size: 11px; font-weight: 700; color: rgb(102, 112, 133);">ОТКУДА</span>
    
    <div style="display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 6px;"><button type="button" class="chip on" style="height: 48px; border-radius: 14px; white-space: normal; line-height: 1.2;">Наличными через кассу</button><button type="button" class="chip" style="height: 48px; border-radius: 14px;">Картой</button><button type="button" class="chip" style="height: 48px; border-radius: 14px;">Переводом</button></div>
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 8px 12px; border-radius: 12px; background: rgb(249, 250, 251); border: 1px solid rgb(229, 231, 235);"><span style="font-size: 11px; font-weight: 700; color: rgb(102, 112, 133); letter-spacing: 0.03em;">ЧЕРЕЗ СМЕНУ</span><button type="button" style="height: 48px; padding: 0px 12px; border-radius: 10px; border: 1px solid rgb(208, 213, 221); background: rgb(255, 255, 255); font-family: inherit; font-size: 14px; font-weight: 700; color: rgb(11, 42, 60); display: flex; align-items: center; justify-content: space-between;">Касса 1 · Кассир Тест<span aria-hidden="true">▾</span></button><span style="font-size: 12px; color: rgb(71, 84, 103);">Кассир подтвердит выдачу в своей смене — изъятие запишется само</span></div>
    <button type="button" style="height: 56px; border-radius: 16px; border: 0px; background: rgb(255, 214, 0); color: rgb(11, 42, 60); font-family: inherit; font-size: 17px; font-weight: 800; margin-top: 4px; white-space: nowrap;">Оплатить · 2&nbsp;300&nbsp;сом</button>
    <div style="height: 24px; display: flex; align-items: center; justify-content: center;"><span style="width: 134px; height: 5px; border-radius: 3px; background: rgba(11, 42, 60, 0.25);"></span></div>
  </section></div></div></div>
