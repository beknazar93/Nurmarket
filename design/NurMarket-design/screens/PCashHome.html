<!doctype html>
<html lang="ru"><head><style>
    .sc-placeholder{background:color-mix(in srgb,currentColor 8%,transparent);
      border:1px solid color-mix(in srgb,currentColor 50%,transparent);
      border-radius:2px;box-sizing:border-box;overflow:hidden}
    @keyframes sc-shine{0%{background-position:100% 50%}100%{background-position:0% 50%}}
    html.sc-dc-streaming .sc-placeholder,
    html.sc-dc-streaming .sc-interp.sc-missing{position:relative;
      background:color-mix(in srgb,currentColor 5%,transparent);
      border-color:transparent}
    html.sc-dc-streaming .sc-placeholder::before,
    html.sc-dc-streaming .sc-interp.sc-missing::before{content:'';
      position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(90deg,rgba(217,119,87,0) 25%,rgba(247,225,211,.95) 37%,rgba(217,119,87,0) 63%);
      background-size:400% 100%;animation:sc-shine 1.4s ease infinite}
    html.sc-dc-streaming .sc-placeholder:nth-child(n+9 of .sc-placeholder)::before,
    html.sc-dc-streaming .sc-interp.sc-missing:nth-child(n+9 of .sc-interp.sc-missing)::before{animation:none;
      background:color-mix(in srgb,currentColor 8%,transparent)}
    .sc-placeholder-error{padding:4px 8px;font:11px/1.4 ui-monospace,monospace;
      color:color-mix(in srgb,currentColor 70%,transparent);word-break:break-word}
    .sc-interp.sc-missing{display:inline-block;width:2em;height:1em;overflow:hidden;
      vertical-align:text-bottom;background:rgba(255,255,255,.3);border:1px solid rgba(0,0,0,.5);
      border-radius:2px;box-sizing:border-box;color:transparent;
      user-select:none}
    .sc-interp.sc-unresolved{font-family:ui-monospace,monospace;font-size:.85em;
      color:color-mix(in srgb,currentColor 50%,transparent);
      background:color-mix(in srgb,currentColor 10%,transparent);border-radius:3px;
      padding:0 3px}
    .sc-host.sc-has-error{position:relative}
    .sc-logic-error{position:absolute;top:8px;left:8px;z-index:2147483647;max-width:60ch;
      padding:6px 10px;background:#b00020;color:#fff;font:12px/1.4 ui-monospace,monospace;
      border-radius:4px;white-space:pre-wrap;pointer-events:none}
    /* Mirrors PRINT_BASELINE_CSS in apps/web deck-stage-export.ts — keep both
       in sync until dc-runtime regains a build step. */
    @media print {
      @page { margin: 0.5cm; }
      figure, table { break-inside: avoid; }
      #dc-root, #dc-root > .sc-host { height: auto; }
      *, *::before, *::after {
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
        backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
        animation-delay: -99s !important; animation-duration: .001s !important;
        animation-iteration-count: 1 !important; animation-fill-mode: both !important;
        animation-play-state: running !important; transition-duration: 0s !important;
      }
    }
  </style>
<meta charset="utf-8">
<title>Кассир — главная</title>
<style>x-dc{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#FFFFFF;border-top:1px solid #EAECF0;padding:6px 4px 2px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#667085;text-decoration:none;padding:6px 0;border-radius:12px}
.nav a.on{color:#0B2A3C;font-weight:800}
.nav a.on span{background:#FFD600}
.nav span{width:44px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.tile{border:0;border-radius:20px;padding:18px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;font-family:inherit;text-align:left;min-height:116px}
.tile b{font-size:17px;font-weight:800}
.tile small{font-size:12px;line-height:16px}
.ti{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.gest{height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#FFFFFF}
.gest i{width:134px;height:5px;border-radius:3px;background:rgba(11,42,60,.25)}
.role{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#E7EEF3;color:#0B2A3C;white-space:nowrap}
.row{border-radius:16px;background:#FFFFFF;border:1px solid #E5E7EB;padding:10px 14px;min-height:56px;box-sizing:border-box;display:flex;align-items:center;gap:12px;font-family:inherit;text-align:left;width:100%}
</style></head>
<body>
<div id="dc-root"><div class="sc-host" data-sc-name="PCashHome"><div style="width: 390px; height: 844px; box-sizing: border-box; background: rgb(244, 245, 247); font-family: Montserrat, system-ui, sans-serif; color: rgb(17, 24, 39); display: flex; flex-direction: column;">
  <header style="padding: 20px 20px 12px; display: flex; align-items: center; gap: 12px;">
    <span style="width: 44px; height: 44px; border-radius: 22px; background: rgb(11, 42, 60); color: rgb(255, 255, 255); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px;">АС</span>
    
    <span style="display: flex; flex-direction: column; flex-grow: 1; gap: 2px;"><b style="font-size: 16px;">Айгерим Садыкова</b><span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgb(102, 112, 133);">NBS · Телефон <span class="role">Кассир</span></span></span>
    <button type="button" aria-label="Уведомления" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid rgb(229, 231, 235); background: rgb(255, 255, 255); color: rgb(52, 64, 84); display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg></button>
  </header>

  <main style="flex-grow: 1; padding: 4px 20px 16px; display: flex; flex-direction: column; gap: 14px;">
    <section style="border-radius: 20px; background: rgb(11, 42, 60); color: rgb(255, 255, 255); padding: 18px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 8px;"><span style="width: 8px; height: 8px; border-radius: 4px; background: rgb(74, 222, 128);"></span><span style="font-size: 13px; font-weight: 600; color: rgb(208, 213, 221);">Смена открыта · с 09:00</span></div>
      <div style="display: flex; justify-content: space-between; align-items: flex-end;">
        <span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 12px; color: rgb(199, 210, 219);">Мои продажи за смену</span><b style="font-size: 28px; font-weight: 800; color: rgb(255, 214, 0); white-space: nowrap;">1&nbsp;080&nbsp;сом</b></span>
        <span style="font-size: 13px; color: rgb(199, 210, 219); white-space: nowrap;">12 чеков</span>

      <button type="button" class="tile" style="background: rgb(255, 255, 255); color: rgb(11, 42, 60);"><span class="ti" style="background: rgb(242, 244, 247);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6v3H9zM7 5H5v16h14V5h-2"></path><path d="M8.5 13l2.5 2.5 4.5-5"></path></svg></span><b>Ревизия</b><small style="color: rgb(102, 112, 133);">Пересчёт товара на полке</small></button>
      <button type="button" class="tile" style="background: rgb(255, 255, 255); color: rgb(11, 42, 60);"><span class="ti" style="background: rgb(242, 244, 247);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l1.5 1.5L8 5M4 12l1.5 1.5L8 11M4 18l1.5 1.5L8 17M11 6h9M11 12h9M11 18h9"></path></svg></span><b style="white-space: nowrap;">Мои задачи · 2</b><small style="color: rgb(102, 112, 133);">От администратора</small></button>
    </div>

    
    <button type="button" class="row">
      <span style="width: 36px; height: 36px; border-radius: 10px; background: rgb(254, 243, 226); color: rgb(181, 71, 8); display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0;">!</span>
      <span style="display: flex; flex-direction: column; flex-grow: 1;"><b style="font-size: 14px;">Заканчиваются 4 товара</b><span style="font-size: 12px; color: rgb(102, 112, 133);">Сок Gracio, Кока-Кола, Эссе манго, Aos</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
    <button type="button" class="row">
      <span style="width: 36px; height: 36px; border-radius: 10px; background: rgb(231, 238, 243); color: rgb(11, 42, 60); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg></span>
      <span style="display: flex; flex-direction: column; flex-grow: 1;"><b style="font-size: 14px;">Сообщить администратору</b><span style="font-size: 12px; color: rgb(102, 112, 133);">Нет товара, ошибка цены, вопрос</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
  </main>

  <nav class="nav" aria-label="Разделы кассира">
    <a href="#" class="on" aria-current="page"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21H3z"></path></svg></span>Главная</a>
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.5 11h11L21 7H6.5"></path><circle cx="9" cy="19.5" r="1.5"></circle><circle cx="17" cy="19.5" r="1.5"></circle></svg></span>Продажа</a>
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path><path d="M8 9v6M12 9v6M16 9v6"></path></svg></span>Сканер</a>
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg></span>Чеки</a>
    <a href="#"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg></span>Товары</a>

  <div class="gest" aria-hidden="true"><i></i></div></div></div></div>
