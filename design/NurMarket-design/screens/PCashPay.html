<!doctype html>
<html lang="ru"><head><style>
    .sc-placeholder{background:color-mix(in srgb,currentColor 8%,transparent);
      border:1px solid color-mix(in srgb,currentColor 50%,transparent);
      border-radius:2px;box-sizing:border-box;overflow:hidden}
    @keyframes sc-shine{0%{background-position:100% 50%}100%{background-position:0% 50%}}
    html.sc-dc-streaming .sc-placeholder,
    html.sc-dc-streaming .sc-interp.sc-missing{position:relative;
      background:color-mix(in srgb,currentColor 5%,transparent);
      border-color:transparent}
    html.sc-dc-streaming .sc-placeholder::before,
    html.sc-dc-streaming .sc-interp.sc-missing::before{content:'';
      position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(90deg,rgba(217,119,87,0) 25%,rgba(247,225,211,.95) 37%,rgba(217,119,87,0) 63%);
      background-size:400% 100%;animation:sc-shine 1.4s ease infinite}
    html.sc-dc-streaming .sc-placeholder:nth-child(n+9 of .sc-placeholder)::before,
    html.sc-dc-streaming .sc-interp.sc-missing:nth-child(n+9 of .sc-interp.sc-missing)::before{animation:none;
      background:color-mix(in srgb,currentColor 8%,transparent)}
    .sc-placeholder-error{padding:4px 8px;font:11px/1.4 ui-monospace,monospace;
      color:color-mix(in srgb,currentColor 70%,transparent);word-break:break-word}
    .sc-interp.sc-missing{display:inline-block;width:2em;height:1em;overflow:hidden;
      vertical-align:text-bottom;background:rgba(255,255,255,.3);border:1px solid rgba(0,0,0,.5);
      border-radius:2px;box-sizing:border-box;color:transparent;
      user-select:none}
    .sc-interp.sc-unresolved{font-family:ui-monospace,monospace;font-size:.85em;
      color:color-mix(in srgb,currentColor 50%,transparent);
      background:color-mix(in srgb,currentColor 10%,transparent);border-radius:3px;
      padding:0 3px}
    .sc-host.sc-has-error{position:relative}
    .sc-logic-error{position:absolute;top:8px;left:8px;z-index:2147483647;max-width:60ch;
      padding:6px 10px;background:#b00020;color:#fff;font:12px/1.4 ui-monospace,monospace;
      border-radius:4px;white-space:pre-wrap;pointer-events:none}
    /* Mirrors PRINT_BASELINE_CSS in apps/web deck-stage-export.ts — keep both
       in sync until dc-runtime regains a build step. */
    @media print {
      @page { margin: 0.5cm; }
      figure, table { break-inside: avoid; }
      #dc-root, #dc-root > .sc-host { height: auto; }
      *, *::before, *::after {
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
        backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
        animation-delay: -99s !important; animation-duration: .001s !important;
        animation-iteration-count: 1 !important; animation-fill-mode: both !important;
        animation-play-state: running !important; transition-duration: 0s !important;
      }
    }
  </style>
<meta charset="utf-8">
<title>Оплата с телефона</title>
<style>x-dc{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
body{margin:0}
a{color:#0B2A3C}a:hover{color:#123B52}
.m{height:60px;border-radius:14px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:700;color:#344054;white-space:nowrap}
.m.on{border:1px solid #0B2A3C;background:#0B2A3C;color:#FFFFFF}
.m small{font-size:11px;font-weight:600;color:#667085}
.q{flex-grow:1;height:48px;border-radius:21px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:14px;font-weight:700;color:#344054}
.lbl{font-size:11px;font-weight:700;color:#667085;letter-spacing:.03em}
.q.on{border-color:#0B2A3C;background:#0B2A3C;color:#FFFFFF}
.r{flex-grow:1;height:48px;border-radius:12px;border:1px solid #D0D5DD;background:#FFFFFF;font-family:inherit;font-size:13px;font-weight:600;color:#344054;white-space:nowrap}
.r.on{border-color:#0B2A3C;background:#0B2A3C;color:#FFFFFF;font-weight:700}
.role{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#E7EEF3;color:#0B2A3C;white-space:nowrap}
.gest{height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#F4F5F7}
.gest i{width:134px;height:5px;border-radius:3px;background:rgba(11,42,60,.25)}
</style></head>
<body>
<div id="dc-root"><div class="sc-host" data-sc-name="PCashPay"><div style="width: 390px; height: 844px; box-sizing: border-box; background: rgb(244, 245, 247); font-family: Montserrat, system-ui, sans-serif; color: rgb(17, 24, 39); display: flex; flex-direction: column;">
  <header style="padding: 18px 16px 8px; display: flex; align-items: center; gap: 12px;">
    <button type="button" aria-label="Назад к чеку" style="width: 48px; height: 48px; border-radius: 14px; border: 1px solid rgb(229, 231, 235); background: rgb(255, 255, 255); color: rgb(52, 64, 84); display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <b style="font-size: 18px; font-weight: 800; flex-grow: 1;">Оплата</b>
    <span class="role">Кассир</span>
  </header>

  <main style="flex-grow: 1; padding: 4px 16px; display: flex; flex-direction: column; gap: 10px;">
    <section style="border-radius: 20px; background: rgb(11, 42, 60); color: rgb(255, 255, 255); padding: 14px 18px; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <span style="font-size: 12px; color: rgb(199, 210, 219);">К оплате · 2 позиции · 3 шт</span>
      <b style="font-size: 34px; font-weight: 800; color: rgb(255, 214, 0); white-space: nowrap;">209&nbsp;сом</b>
      
      <span style="font-size: 12px; color: rgb(199, 210, 219); display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 4px; background: rgb(74, 222, 128);"></span>ККМ на связи · чек будет фискальным</span>
    </section>

    <span class="lbl">СПОСОБ ОПЛАТЫ</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0px, 1fr)); gap: 8px;">
      <button type="button" class="m on" aria-pressed="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2.5"></circle></svg>Наличные</button>
      <button type="button" class="m"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path></svg>Карта</button>
      <button type="button" class="m"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><path d="M14 14h3v3h-3zM20 14v.01M20 20h-3v-3"></path></svg>QR</button>
      <button type="button" class="m">Смешанная<small>нал. + карта/QR</small></button>
      <button type="button" class="m">В долг<small>нужен клиент</small></button>
      <button type="button" class="m">Бонусами<small>нужен клиент</small></button>
    </div>

    <label class="lbl" for="got">ПОЛУЧЕНО НАЛИЧНЫМИ</label>
    <input id="got" type="text" value="500" style="height: 56px; box-sizing: border-box; border-radius: 14px; border: 2px solid rgb(11, 42, 60); padding: 0px 16px; font-family: inherit; font-size: 24px; font-weight: 800; background: rgb(255, 255, 255);">
    <div style="display: flex; gap: 8px;"><button type="button" class="q">210</button><button type="button" class="q">250</button><button type="button" class="q on" aria-pressed="true">500</button><button type="button" class="q">1000</button></div>
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; border-radius: 14px; background: rgb(255, 255, 255); border: 1px solid rgb(229, 231, 235);"><span style="font-size: 15px; font-weight: 700;">Сдача</span><b style="font-size: 28px; font-weight: 800; color: rgb(14, 122, 58); white-space: nowrap;">291&nbsp;сом</b></div>

    <span class="lbl">ЧЕК ПОКУПАТЕЛЮ</span>
    <div style="display: flex; gap: 8px;"><button type="button" class="r on" aria-pressed="true">WhatsApp</button><button type="button" class="r">Печать</button><button type="button" class="r">Не нужен</button></div>
    <div style="display: flex; gap: 8px;">
      <input type="tel" placeholder="Телефон покупателя" aria-label="Телефон для чека в WhatsApp" style="flex-grow: 1; min-width: 0px; height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid rgb(208, 213, 221); padding: 0px 14px; font-family: inherit; font-size: 16px; background: rgb(255, 255, 255);">
      <button type="button" class="r" style="flex-grow: 0; padding: 0px 12px;">Из клиента</button>
    </div>
  </main>

  <div style="padding: 10px 16px 0px;">
    <button type="button" style="width: 100%; height: 58px; border-radius: 16px; border: 0px; background: rgb(255, 214, 0); color: rgb(11, 42, 60); font-family: inherit; font-size: 17px; font-weight: 800; white-space: nowrap; box-shadow: rgba(255, 214, 0, 0.35) 0px 8px 20px;">Принять оплату 209&nbsp;сом</button>
  </div>
  <div class="gest" aria-hidden="true"><i></i></div></div></div></div>



</body></html>
