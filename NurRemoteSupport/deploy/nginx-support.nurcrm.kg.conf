# 2026-10-16: nginx перед ретранслятором NurRemoteSupport (support.nurcrm.kg → 127.0.0.1:8080).
# Положить в /etc/nginx/sites-available/support.nurcrm.kg и включить ссылкой в sites-enabled.
# Порядок с сертификатом — README.md, раздел «HTTPS через nginx и certbot».

# WebSocket: заголовок Connection — «upgrade» для WebSocket, «close» для обычных запросов.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name support.nurcrm.kg;

    # Проверка certbot (--webroot) и перевод всего остального на HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- БЛОК HTTPS: включить после получения сертификата (см. README) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name support.nurcrm.kg;

    ssl_certificate     /etc/letsencrypt/live/support.nurcrm.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support.nurcrm.kg/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:nurremote:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;
    access_log /var/log/nginx/support.nurcrm.kg.access.log;
    error_log  /var/log/nginx/support.nurcrm.kg.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # Настоящий IP клиента — для лимитов попыток; $remote_addr, а не цепочка от клиента (её можно подделать).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Сервер шлёт ping каждые 20 с — 120 с с запасом; буферизация не нужна (поток кадров).
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
